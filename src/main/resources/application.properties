#项目配置主加载文件 用于确定部署方式和环境 根据环境配置去加载单独的配置文件
#系统名称
system_name =矽翔质管部管理系统
#系统版权所有人
system_copyright_company=©Hanzj
#系统版权所有人链接URL
system_copyright_link=https://www.siargo.com.cn/
#project deploy environment dev or pro
#仅对下方清单内的本地资源生效；外部URL、第三方插件和其他资源不做任何处理。
#pdev=dev：优先未压缩.css/.js，缺少对应未压缩版本时，再使用压缩文件。
#pdev=pro：优先.min.css/.min.js，缺少对应压缩版本时，再使用未压缩文件。
#两种版本均缺失时记录资源缺失；保留引用中的版本参数和URL片段。
pdev=dev
#清单统一填写未压缩路径；同名.min版本属于同一资源，模板通过ProjectAssets.url选择。
#日常不压缩；打包时仅检查本清单，源文件修改或压缩产物缺失/变化时重新压缩。
#外部引用保持现状；压缩不写入CHANGELOG。
project_assets.environment_files=assets/css/jbolt-admin.css,assets/css/jbolt-mine.css,assets/css/jbolt-page-loading.css,assets/css/jbolt-wechat-menu.css,assets/css/login.css,assets/css/siargo.css,assets/js/jbolt-admin.js,assets/js/jbolt-mine.js,assets/js/jbolt-wechat-menu.js,assets/js/login.js,assets/js/relogin.js,assets/js/siargo.js
#demo mode
demo_mode = false

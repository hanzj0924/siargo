#@jboltLayout()
#define css()
<link rel="stylesheet" href="assets/css/siargo.css">
<style>
.cl-wrap{max-width:900px;margin:0 auto;padding:24px 20px}
.cl-h2{font-size:24px;font-weight:700;color:#2c3e50;padding-bottom:10px;margin-top:32px;margin-bottom:16px;border-bottom:2px solid #e9ecef}
.cl-h3{font-size:20px;font-weight:600;color:#495057;margin-top:24px;margin-bottom:10px}
.cl-list{list-style:none;padding:0;margin:0 0 16px 0}
.cl-list li{position:relative;padding:6px 0 6px 20px;font-size:17px;color:#555;line-height:1.7;border-bottom:1px solid #f8f9fa}
.cl-list li::before{content:"";position:absolute;left:4px;top:17px;width:6px;height:6px;border-radius:50%;background:#adb5bd}
.cl-list li code{display:inline-block;padding:1px 6px;background:#f1f3f5;border-radius:3px;font-size:16px;color:#e83e8c}
</style>
#end

#define main()
<div class="cl-wrap">
	#(changelogHtml)
</div>
#end

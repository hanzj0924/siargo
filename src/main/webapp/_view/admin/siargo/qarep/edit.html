#@jboltLayout()
#define css()
<link rel="stylesheet" href="assets/css/siargo.css?v=#(JBoltConfig.ASSETS_VERSION)">
#end

#define main()
<div class="jbolt_page">
	
	<div class="jbolt_page_content">
		<form onsubmit="return false;" id="qareportUpdateForm"
			action="admin/siargo/qarep/update" method="post">
			<input type="hidden" name="qareport.id" value="#(qapro.id??)" /> <input
				type="hidden" name="product.id" value="#(qapro.proid??)" />
			<div class="fm-wrap">

				<!-- 上半部分：左右两栏 -->
				<div class="row">
					<!-- 左栏：报告单信息 + 产品信息 -->
					<div class="col">
						<!-- 报告单信息 -->
						<div class="fm-sec">
							<div class="fm-hd"><span>&#128203; 报告单信息</span><i></i></div>
							<div class="fm-card">
								<div class="form-group row">
									<label class="col-auto col-form-label">类型</label>
									<div class="col input-group">
										<select class="form-control" data-autoload
											name="qareport.rep_type"
											data-url="admin/dictionary/options?key=siargo_rep_type"
											data-rule="select" data-tips="请选择报告单类型" data-text="=请选择="
											data-value="" data-value-attr="sn"  
											data-select="#(qapro.repType ??)">
										</select>
									</div>
									<label class="col-auto col-form-label">版号</label>
									<div class="col input-group">
										<select class="form-control" data-autoload
											name="product.pdfver"
											data-url="admin/dictionary/options?key=siargo_pdfver"
											data-rule="select" data-tips="请选择版号" 
											data-value="" data-value-attr="name"  
											data-select="#(qapro.sp_pdfver ??)">
										</select>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">订单号</label>
									<div class="col">
										<input type="number" data-with-clearbtn="true" autocomplete="off"
											class="form-control" data-rule="pint" placeholder="=请填写="
											maxlength="10" name="qareport.order_id"
											value="#(qapro.order_id ??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">客户名称</label>
									<div class="col input-group">
										<select class="form-control " data-autoload data-refresh="true"
											data-url="admin/siargo/qarep/getCustName" name="qareport.cust_id"
											data-text="=请选择=" data-value-attr="id" data-rule="select"
											data-text-attr="name" data-select="#(qapro.cust_id ??)"
											data-select-type="select2" id="custSelect">
										</select>
										<span class="input-group-btn">
											<button class="btn btn-default" type="button" style="height:34px;border:1px solid #ccc;border-left:none;border-top-left-radius:0;border-bottom-left-radius:0;"
												data-dialogbtn data-area="350,250"
												data-handler="refreshCustSelect" data-title="新增客户"
												data-url="admin/siargo/customer/add">
												<i class="fa fa-plus"></i>
											</button>
										</span>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">检验进度</label>
									<div class="col input-group">
										<select class="form-control" data-autoload name="product.insp"
											data-rule="select" data-tips="请选择检验进度" 
											data-value="" data-options="精度待检:1,成品检漏待检:6,外观待检:2,包装待检:3,待批准:4,已完成:5"
											data-select="#(qapro.insp ??)">
										</select>
									</div>
								</div>
							</div>
						</div>
						<!-- 产品信息 -->
						<div class="fm-sec">
							<div class="fm-hd"><span>&#128230; 产品信息</span><i></i></div>
							<div class="fm-card">
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">产品类型</label>
									<div class="col input-group">
										<select class="form-control" data-autoload name="product.type"
											data-url="admin/dictionary/options?key=siargo_prod_type"
											data-rule="select" data-tips="请选择产品类型" data-text="=请选择="
											data-value="" data-value-attr="sn"  
											data-select="#(qapro.sp_type??)">
										</select>
									</div>
									<label class="col-auto col-form-label">成品检漏</label>
									<div class="col input-group">
										<select class="form-control" data-autoload name="product.lt_status"
											data-rule="select" data-tips="请选择是否有成品检漏" data-text="=请选择="
											data-value="" data-options="已检验:1,无:2"
											data-select="#(qapro.lt_status ?? 2)">
										</select>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">送检数量</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											class="form-control" data-rule="required" placeholder="请输入送检数量"
											maxlength="100" name="product.qsi" value="#(qapro.sp_qsi??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">检验数量</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											class="form-control" data-rule="required" placeholder="请输入检验数量"
											maxlength="100" name="product.qi" value="#(qapro.sp_qi??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">型号</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											class="form-control" data-rule="required" placeholder="请输入型号"
											maxlength="100" name="product.model" value="#(qapro.sp_model??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">编号</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											class="form-control" data-rule="required" placeholder="请输入编号"
											maxlength="100" name="product.number" value="#(qapro.sp_number??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-2 col-form-label">备注</label>
									<div class="col">
										<textarea class="form-control" style="height: 50px;white-space: pre;"
											placeholder="（选填）请输入备注" data-tips="请输入备注" data-with-clearbtn="true"
											maxlength="900" name="product.des" >#(qapro.sp_des??)</textarea>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- 右栏：技术参数 -->
					<div class="col">
						<div class="fm-sec">
							<div class="fm-hd"><span>&#9889; 大流量计参数</span><i></i></div>
							<div class="fm-card">
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">流量范围</label>
									<div class="col input-group">
										<select class="form-control " data-autoload data-refresh="true"
											data-url="admin/dictionary/options?key=siargo_flow_range"
											name="product.flow_range" data-text="（选填）..."
											data-value-attr="sn" data-select="#(qapro.sp_flow_range ??)"
											data-notnull="false" data-rule="select"
											data-select-type="select2">
										</select>
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">电池电压</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_4"
											class="form-control" placeholder="（选填）3.2505-3.3495V" maxlength="6"
											name="product.bv" value="#(qapro.sp_bv??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">故障电平</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_2"
											class="form-control" placeholder="（选填）≧2.7V" maxlength="5"
											name="product.fl" value="#(qapro.sp_fl??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">整机电流 24v</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_2"
											class="form-control" placeholder="（选填）≤0.5mA/10~20mA" maxlength="5"
											name="product.cucmax" value="#(qapro.sp_cucmax??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">整机电流 12v</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_2"
											class="form-control" placeholder="（选填）≤0.5mA/10~30mA" maxlength="5"
											name="product.cucmin" value="#(qapro.sp_cucmin??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">整机电流 8v</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_2"
											class="form-control" placeholder="（选填）6-24mA" maxlength="5" 
											name="product.cuc" value="#(qapro.sp_cuc??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">脉冲电压</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="siargo_tofixed_3"
											class="form-control" placeholder="（选填）≧2.7V/≧4.75V" maxlength="6"
											name="product.pv" value="#(qapro.sp_pv ??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">本地地址</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="pint"
											class="form-control" placeholder="（选填）≤50" maxlength="2"
											name="product.la" value="#(qapro.sp_la ??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">热头电压</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="pint"
											class="form-control" placeholder="（选填）≤1690" maxlength="4"
											name="product.thv" value="#(qapro.sp_thv??)" />
									</div>
								</div>
								<div class="form-group row">
									<label class="col-sm-3 col-form-label">零点内码</label>
									<div class="col">
										<input type="text" data-with-clearbtn="true" autocomplete="off"
											data-notnull="false"  data-rule="pint"
											class="form-control" placeholder="（选填）≤30" maxlength="2"
											name="product.zp" value="#(qapro.sp_zp??)" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</form>
		#define js()
		<script>
			
		</script>
		#include("/_view/_admin/common/_formjs.html",formId="qareportUpdateForm")
		#end
	</div>
</div>
#end

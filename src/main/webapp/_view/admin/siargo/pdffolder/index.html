#@jboltLayout()
#define css()
<link rel="stylesheet" href="assets/css/siargo.css">
<style>
.pf-panel{display:flex;height:100%;overflow:hidden;}
.pf-left{width:30%;min-width:240px;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;background:#fafafa;}
.pf-right{width:70%;display:flex;flex-direction:column;overflow:hidden;}
.pf-left-header{padding:10px 12px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;}
.pf-left-body{flex:1;overflow-y:auto;padding:6px 8px;}
.pf-left-footer{padding:8px 12px;border-top:1px solid #e0e0e0;text-align:right;}
.pf-folder-item{padding:6px 12px;margin-bottom:2px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.pf-folder-item:hover{background:#e8f4fd;border-color:#b3d9f2;}
.pf-folder-item.active{background:#d0ebff;border-color:#74b9ff;font-weight:600;}
.pf-group-header{padding:8px 12px;margin-bottom:2px;font-size:14px;font-weight:600;color:#555;cursor:pointer;user-select:none;border-radius:4px;transition:background .15s;}
.pf-group-header:hover{background:#f0f0f0;}
.pf-group-header .fa{transition:transform .2s;}
.pf-group-header.collapsed .fa{transform:rotate(-90deg);}
.pf-group-children{padding-left:12px;}
.pf-group-children.collapsed{display:none;}
.pf-sub-item{padding:5px 12px 5px 24px;margin-bottom:2px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:all .15s;font-size:13px;}
.pf-sub-item:hover{background:#e8f4fd;border-color:#b3d9f2;}
.pf-sub-item.active{background:#d0ebff;border-color:#74b9ff;font-weight:600;}
.pf-right-header{padding:10px 14px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between;}
.pf-right-header h4{margin:0;font-size:15px;color:#555;}
.pf-right-body{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.pf-tab-links{border-bottom:1px solid #ddd;padding:0 14px;}
.pf-tab-links a{display:inline-block;padding:8px 16px;margin-bottom:-1px;border:1px solid transparent;border-radius:4px 4px 0 0;color:#666;text-decoration:none;font-size:13px;}
.pf-tab-links a.active{background:#fff;border-color:#ddd #ddd #fff;color:#333;font-weight:600;}
.pf-tab-content{flex:1;overflow:auto;padding:12px 14px;}
.pf-tab-pane{display:none;}
.pf-tab-pane.active{display:block;}
.pf-file-row td{vertical-align:middle!important;}
.pf-empty{text-align:center;color:#aaa;padding:40px 0;font-size:14px;}
</style>
#end

#define main()
#set(pageId=RandomUtil.random(6))

<div class="jbolt_page jb_vflex" data-key="#(pmkey)">
<div class="jbolt_page_title">
	<div class="row">
		<div class="col-md-auto"><h1>报告单模板管理</h1></div>
		<div class="col-md-auto ml-auto">
			<button class="btn btn-outline-secondary btn-sm" onclick="pfClearCache_#(pageId)()">
				<i class="fa fa-refresh"></i> 刷新缓存
			</button>
		</div>
	</div>
</div>
<div class="jbolt_page_content jb_vbody">
<div class="pf-panel" id="pfPanel_#(pageId)">

<!-- ========== 左侧：版号文件夹列表 ========== -->
<div class="pf-left">
	<div class="pf-left-header">
		<span style="font-weight:600;font-size:14px;"><i class="fa fa-folder-open-o"></i> 版号文件夹</span>
		<button class="btn btn-outline-primary btn-xs" onclick="pfShowAddFolder_#(pageId)()">
			<i class="fa fa-plus"></i> 新增
		</button>
	</div>
	<div class="pf-left-body" id="pfFolderList_#(pageId)">
		<div class="pf-empty">加载中...</div>
	</div>
	<div class="pf-left-footer">
		<button class="btn btn-outline-danger btn-xs" onclick="pfDeleteFolder_#(pageId)()">
			<i class="fa fa-trash"></i> 删除选中
		</button>
	</div>
</div>

<!-- ========== 右侧：模板管理区 ========== -->
<div class="pf-right">
	<div class="pf-right-header">
		<h4><i class="fa fa-cog"></i> <span id="pfCurrentVer_#(pageId)">请选择左侧版号</span></h4>
	</div>
	<div class="pf-right-body">
		<!-- Tab 切换 -->
		<div class="pf-tab-links" id="pfTabLinks_#(pageId)">
			<a href="javascript:;" class="active" data-tab="files" onclick="pfSwitchTab_#(pageId)(this,'files')">
				<i class="fa fa-file-pdf-o"></i> 模板文件
			</a>
			<a href="javascript:;" data-tab="rules" onclick="pfSwitchTab_#(pageId)(this,'rules')">
				<i class="fa fa-random"></i> 匹配规则
			</a>
		</div>
		<!-- Tab 内容 -->
		<div class="pf-tab-content">
			<!-- 模板文件 Tab -->
			<div class="pf-tab-pane active" id="pfTabFiles_#(pageId)">
				<div style="margin-bottom:10px;">
					<button class="btn btn-outline-primary btn-sm" onclick="pfUploadFile_#(pageId)()">
						<i class="fa fa-upload"></i> 上传模板
					</button>
					<input type="file" id="pfFileInput_#(pageId)" style="display:none;" accept=".pdf"
						onchange="pfDoUpload_#(pageId)(this)"/>
				</div>
				<table class="table table-bordered table-sm table-hover">
					<thead><tr><th style="width:50px">#</th><th>文件名</th><th style="width:100px">大小</th><th style="width:80px">操作</th></tr></thead>
					<tbody id="pfFileTable_#(pageId)">
						<tr><td colspan="4" class="pf-empty">请先选择版号</td></tr>
					</tbody>
				</table>
			</div>
			<!-- 匹配规则 Tab -->
			<div class="pf-tab-pane" id="pfTabRules_#(pageId)">
				<div style="margin-bottom:10px;">
					<button class="btn btn-outline-primary btn-sm" onclick="pfAddRule_#(pageId)()">
						<i class="fa fa-plus"></i> 新增规则
					</button>
				</div>
				<table class="table table-bordered table-sm table-hover">
					<thead><tr>
						<th style="width:50px">#</th>
						<th style="width:80px">版号</th>
						<th style="width:100px">产品类型</th>
						<th>型号关键词</th>
						<th>模板文件</th>
						<th style="width:70px">优先级</th>
						<th style="width:100px">操作</th>
					</tr></thead>
					<tbody id="pfRuleTable_#(pageId)">
						<tr><td colspan="7" class="pf-empty">请先选择版号</td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</div>
</div>
</div>

#end

#define js()
<script>
(function(){
var pageId = '#(pageId)';
var BASE = 'admin/siargo/qarep/pdffolder/';
var selectedVer = null;

// ========== 左侧文件夹列表 ==========
window['pfLoadFolders_'+pageId] = function() {
	$.ajax({
		url: BASE + 'folders', type: 'get', dataType: 'json',
		success: function(res) {
			var list = res.data || [];
			var html = '';
			if (list.length === 0) {
				html = '<div class="pf-empty">暂无文件夹，请点击"新增"创建</div>';
			} else {
				// 按主版号分组：pdfver格式如 "G/2" → 主版号"G"，子版号"2"
				var groups = {};
				var groupOrder = [];
				for (var i = 0; i < list.length; i++) {
					var f = list[i];
					var parts = f.pdfver.split('/');
					var major = parts.length > 1 ? parts[0] : f.pdfver;
					var sub = parts.length > 1 ? parts[1] : f.pdfver;
					if (!groups[major]) {
						groups[major] = [];
						groupOrder.push(major);
					}
					groups[major].push({sub: sub, pdfver: f.pdfver, description: f.description || ''});
				}
				// 渲染树形结构
				for (var g = 0; g < groupOrder.length; g++) {
					var major = groupOrder[g];
					var children = groups[major];
					// 组头
					html += '<div class="pf-group-header" onclick="pfToggleGroup_'+pageId+'(this)">';
					html += '<i class="fa fa-caret-down"></i> <i class="fa fa-folder-o"></i> ' + major;
					html += '</div>';
					html += '<div class="pf-group-children">';
					for (var c = 0; c < children.length; c++) {
						var item = children[c];
						var cls = (selectedVer === item.pdfver) ? ' active' : '';
						html += '<div class="pf-sub-item' + cls + '" data-ver="' + item.pdfver + '" onclick="pfSelectFolder_'+pageId+'(this)">';
						html += '<i class="fa fa-file-o"></i> ' + item.sub;
						if (item.description) html += ' <span style="color:#aaa;font-size:11px;">' + item.description + '</span>';
						html += '</div>';
					}
					html += '</div>';
				}
			}
			$('#pfFolderList_'+pageId).html(html);
		}
	});
};

window['pfToggleGroup_'+pageId] = function(el) {
	$(el).toggleClass('collapsed');
	$(el).next('.pf-group-children').toggleClass('collapsed');
};

window['pfSelectFolder_'+pageId] = function(el) {
	$('#pfFolderList_'+pageId+' .pf-sub-item').removeClass('active');
	$(el).addClass('active');
	selectedVer = $(el).data('ver');
	$('#pfCurrentVer_'+pageId).html('版号：<strong>' + selectedVer + '</strong>');
	// 加载当前Tab数据
	var activeTab = $('#pfTabLinks_'+pageId+' a.active').data('tab');
	if (activeTab === 'files') {
		window['pfLoadFiles_'+pageId]();
	} else {
		window['pfLoadRules_'+pageId]();
	}
};

// ========== 新增文件夹 ==========
window['pfShowAddFolder_'+pageId] = function() {
	$.ajax({
		url: BASE + 'dictVersions', type: 'get', dataType: 'json',
		success: function(res) {
			var list = res.data || [];
			var options = '';
			var hasAvailable = false;
			for (var i = 0; i < list.length; i++) {
				if (!list[i].created) {
					hasAvailable = true;
					options += '<option value="' + list[i].dict_id + '">' + list[i].name + '</option>';
				}
			}
			if (!hasAvailable) {
				layer.msg('所有字典版号已创建', {icon: 0});
				return;
			}
			var content = '<div style="padding:20px;">'
				+ '<div class="form-group"><label>选择要创建的版号：</label>'
				+ '<select class="form-control" id="pfNewFolderSelect_'+pageId+'">' + options + '</select></div>'
				+ '</div>';
			layer.open({
				type: 1, title: '新增版号文件夹', area: ['400px','220px'],
				content: content,
				btn: ['确定','取消'],
				yes: function(idx) {
					var dictId = $('#pfNewFolderSelect_'+pageId).val();
					if (!dictId) { layer.msg('请选择版号',{icon:0}); return; }
					$.post(BASE + 'createFolder', {dictId: dictId}, function(ret) {
						if (ret.state === 'ok' || ret.success) {
							layer.close(idx);
							layer.msg('创建成功', {icon: 1});
							window['pfLoadFolders_'+pageId]();
						} else {
							layer.msg(ret.msg || '创建失败', {icon: 2});
						}
					}, 'json');
				}
			});
		}
	});
};

// ========== 删除文件夹 ==========
window['pfDeleteFolder_'+pageId] = function() {
	if (!selectedVer) { layer.msg('请先选中一个文件夹', {icon: 0}); return; }
	layer.confirm('确定删除版号 [' + selectedVer + '] 的文件夹？<br><small class="text-danger">关联的模板规则也将一并删除</small>', {
		icon: 3, title: '确认删除'
	}, function(idx) {
		$.post(BASE + 'deleteFolder', {pdfver: selectedVer}, function(ret) {
			if (ret.state === 'ok' || ret.success) {
				layer.close(idx);
				layer.msg('已删除', {icon: 1});
				selectedVer = null;
				$('#pfCurrentVer_'+pageId).text('请选择左侧版号');
				$('#pfFileTable_'+pageId).html('<tr><td colspan="4" class="pf-empty">请先选择版号</td></tr>');
				$('#pfRuleTable_'+pageId).html('<tr><td colspan="7" class="pf-empty">请先选择版号</td></tr>');
				window['pfLoadFolders_'+pageId]();
			} else {
				layer.msg(ret.msg || '删除失败', {icon: 2});
			}
		}, 'json');
	});
};

// ========== Tab 切换 ==========
window['pfSwitchTab_'+pageId] = function(el, tab) {
	$('#pfTabLinks_'+pageId+' a').removeClass('active');
	$(el).addClass('active');
	$('#pfTabFiles_'+pageId+',#pfTabRules_'+pageId).removeClass('active');
	if (tab === 'files') {
		$('#pfTabFiles_'+pageId).addClass('active');
		if (selectedVer) window['pfLoadFiles_'+pageId]();
	} else {
		$('#pfTabRules_'+pageId).addClass('active');
		if (selectedVer) window['pfLoadRules_'+pageId]();
	}
};

// ========== 模板文件列表 ==========
window['pfLoadFiles_'+pageId] = function() {
	if (!selectedVer) return;
	$.ajax({
		url: BASE + 'templates', type: 'get', data: {pdfver: selectedVer}, dataType: 'json',
		success: function(res) {
			var list = res.data || [];
			if (list.length === 0) {
				$('#pfFileTable_'+pageId).html('<tr><td colspan="4" class="pf-empty">暂无模板文件</td></tr>');
				return;
			}
			var html = '';
			for (var i = 0; i < list.length; i++) {
				var f = list[i];
				var sizeKB = (f.fileSize / 1024).toFixed(1) + ' KB';
				html += '<tr class="pf-file-row"><td>' + (i+1) + '</td>';
				html += '<td><i class="fa fa-file-pdf-o text-danger"></i> ' + f.fileName + '</td>';
				html += '<td>' + sizeKB + '</td>';
				html += '<td><a href="javascript:;" class="c-danger" onclick="pfDeleteFile_'+pageId+'(this)" data-fname="' + f.fileName + '"><i class="fa fa-trash"></i></a></td>';
				html += '</tr>';
			}
			$('#pfFileTable_'+pageId).html(html);
		}
	});
};

// ========== 上传模板文件 ==========
window['pfUploadFile_'+pageId] = function() {
	if (!selectedVer) { layer.msg('请先选择版号', {icon: 0}); return; }
	$('#pfFileInput_'+pageId).click();
};

window['pfDoUpload_'+pageId] = function(input) {
	if (!input.files || !input.files[0]) return;
	var formData = new FormData();
	formData.append('file', input.files[0]);
	formData.append('pdfver', selectedVer);
	var loadIdx = layer.load(1, {shade: [0.3, '#000']});
	$.ajax({
		url: BASE + 'upload', type: 'post', data: formData,
		processData: false, contentType: false, dataType: 'json',
		success: function(ret) {
			layer.close(loadIdx);
			if (ret.state === 'ok' || ret.success) {
				layer.msg('上传成功', {icon: 1});
				window['pfLoadFiles_'+pageId]();
			} else {
				layer.msg(ret.msg || '上传失败', {icon: 2});
			}
		},
		error: function() { layer.close(loadIdx); layer.msg('上传异常', {icon: 2}); }
	});
	input.value = '';
};

// ========== 删除模板文件 ==========
window['pfDeleteFile_'+pageId] = function(el) {
	var fileName = $(el).data('fname');
	layer.confirm('确定删除文件 [' + fileName + ']？', {icon: 3, title: '确认'}, function(idx) {
		$.post(BASE + 'deleteFile', {pdfver: selectedVer, fileName: fileName}, function(ret) {
			if (ret.state === 'ok' || ret.success) {
				layer.close(idx);
				layer.msg('已删除', {icon: 1});
				window['pfLoadFiles_'+pageId]();
			} else {
				layer.msg(ret.msg || '删除失败', {icon: 2});
			}
		}, 'json');
	});
};

// ========== 匹配规则 ==========
var _pfRuleData_#(pageId) = {};
window['pfLoadRules_'+pageId] = function() {
	if (!selectedVer) return;
	$.ajax({
		url: BASE + 'rules', type: 'get', data: {pdfver: selectedVer, page: 1, pageSize: 100}, dataType: 'json',
		success: function(res) {
			var list = (res.data && res.data.list) || [];
			var $tbody = $('#pfRuleTable_'+pageId);
			_pfRuleData_#(pageId) = {};
			if (list.length === 0) {
				$tbody.html('<tr><td colspan="7" class="pf-empty">暂无匹配规则</td></tr>');
				return;
			}
			var html = '';
			for (var i = 0; i < list.length; i++) {
				var d = list[i];
				_pfRuleData_#(pageId)[d.id] = d;
				var kw = d.model_keywords || '';
				var kwHtml = kw ? kw : '<span class="text-muted">（兜底-不限型号）</span>';
				html += '<tr data-id="' + d.id + '">';
				html += '<td>' + (i + 1) + '</td>';
				html += '<td>' + d.pdfver + '</td>';
				html += '<td>' + d.prod_type + '</td>';
				html += '<td>' + kwHtml + '</td>';
				html += '<td>' + d.template_file + '</td>';
				html += '<td>' + d.priority + '</td>';
				html += '<td>';
				html += '<a href="javascript:;" onclick="pfEditRule_'+pageId+'(\''+d.id+'\')" tooltip data-title="编辑"><i class="fa fa-pencil"></i></a>';
				html += ' <a href="javascript:;" onclick="pfDeleteRule_'+pageId+'(\''+d.id+'\')" class="c-danger" tooltip data-title="删除"><i class="fa fa-remove"></i></a>';
				html += '</td></tr>';
			}
			$tbody.html(html);
		}
	});
};

window['pfAddRule_'+pageId] = function() {
	if (!selectedVer) { layer.msg('请先选择版号', {icon: 0}); return; }
	pfOpenRuleDialog_inner(null, selectedVer, '', '', '', '', 0);
};

window['pfEditRule_'+pageId] = function(id) {
	var d = _pfRuleData_#(pageId)[id];
	if (!d) { layer.msg('数据不存在', {icon: 0}); return; }
	pfOpenRuleDialog_inner(d.id, d.pdfver, d.prod_type, d.model_keywords || '', d.template_file, d.error_hint || '', d.priority);
};

function pfOpenRuleDialog_inner(id, pdfver, prodType, keywords, tplFile, errorHint, priority) {
	var title = id ? '编辑规则' : '新增规则';
	var content = '<div style="padding:16px;">'
		+ '<form id="pfRuleForm_'+pageId+'">'
		+ (id ? '<input type="hidden" name="rule.id" value="'+id+'"/>' : '')
		+ '<input type="hidden" name="rule.pdfver" value="'+pdfver+'"/>'
		+ '<input type="hidden" name="rule.is_active" value="1"/>'
		+ '<div class="form-group row"><label class="col-sm-4 col-form-label">产品类型</label><div class="col"><input type="text" class="form-control" name="rule.prod_type" value="'+prodType+'" placeholder="如 G、MF 等"/></div></div>'
		+ '<div class="form-group row"><label class="col-sm-4 col-form-label">型号关键词</label><div class="col"><input type="text" class="form-control" name="rule.model_keywords" value="'+keywords+'" placeholder="逗号分隔，留空为兜底"/></div></div>'
		+ '<div class="form-group row"><label class="col-sm-4 col-form-label">模板文件名</label><div class="col"><input type="text" class="form-control" name="rule.template_file" value="'+tplFile+'" placeholder="如 report_G.pdf"/></div></div>'
		+ '<div class="form-group row"><label class="col-sm-4 col-form-label">错误提示</label><div class="col"><input type="text" class="form-control" name="rule.error_hint" value="'+(errorHint||'')+'" placeholder="如 传感器"/></div></div>'
		+ '<div class="form-group row"><label class="col-sm-4 col-form-label">优先级</label><div class="col"><input type="number" class="form-control" name="rule.priority" value="'+(priority != null ? priority : 0)+'" placeholder="数字越小越优先"/></div></div>'
		+ '</form></div>';
	layer.open({
		type: 1, title: title, area: ['480px','360px'],
		content: content,
		btn: ['保存','取消'],
		yes: function(idx) {
			var formData = $('#pfRuleForm_'+pageId).serialize();
			$.post(BASE + 'saveRule', formData, function(ret) {
				if (ret.state === 'ok' || ret.success) {
					layer.close(idx);
					layer.msg('保存成功', {icon: 1});
					window['pfLoadRules_'+pageId]();
				} else {
					layer.msg(ret.msg || '保存失败', {icon: 2});
				}
			}, 'json');
		}
	});
}

window['pfDeleteRule_'+pageId] = function(id) {
	layer.confirm('确定删除该规则？', {icon: 3, title: '确认'}, function(idx) {
		$.post(BASE + 'deleteRule', {id: id}, function(ret) {
			if (ret.state === 'ok' || ret.success) {
				layer.close(idx);
				layer.msg('已删除', {icon: 1});
				window['pfLoadRules_'+pageId]();
			} else {
				layer.msg(ret.msg || '删除失败', {icon: 2});
			}
		}, 'json');
	});
};

// ========== 刷新缓存 ==========
window['pfClearCache_'+pageId] = function() {
	$.post(BASE + 'clearCache', function(ret) {
		if (ret.state === 'ok' || ret.success) {
			layer.msg(ret.msg || '缓存已刷新', {icon: 1});
		} else {
			layer.msg(ret.msg || '操作失败', {icon: 2});
		}
	}, 'json');
};

// ========== 初始化 ==========
$(function(){
	window['pfLoadFolders_'+pageId]();
});

})();
</script>
#end

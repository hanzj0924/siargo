const fullMarkdown = `## 一、计量标准的建立与考核 ★★★
### 1.1 计量标准的作用与法律地位
#### 作用定位
- 处于国家计量检定系统表的中间环节
- 承上启下：将计量基准复现的单位量值通过检定逐级传递到工作计量器具
- 确保全国计量单位制和量值的统一
#### 量值传递的资格要求
- 县级以上计量行政部门建立的社会公用计量标准
- 部门、企事业单位建立的最高计量标准
- 必须依法考核合格才有量值传递资格
#### 计量标准的应用范围
- 社会公用计量标准 → 向社会开展计量检定或校准
- 部门计量标准 → 部门内部开展非强制检定或校准
- 企事业单位计量标准 → 单位内部非强制检定或校准
- 超范围或强制检定 → 须申请计量授权

### 1.2 法律法规与技术依据 ★★
#### 法律法规依据（三大法规）
- 《中华人民共和国计量法》
- 《计量法实施细则》
- 《计量标准考核办法》
#### 技术依据
- JJF 1033-2016《计量标准考核规范》★★★
- 国家计量检定系统表
- 相应的计量检定规程或技术规范

### 1.3 计量标准使用基本条件（人机料法环）★★
- 经计量检定合格（机）
- 具有正常工作所需要的环境条件（环）
- 具有称职的保存、维护、使用人员（人）
- 具有完善的管理制度（法）

### 1.4 计量标准命名原则
#### 命名基本类型四类
- 标准装置
- 检定装置
- 校准装置
- 工作基准装置
#### 标准装置命名原则
##### 主要计量标准器或参量名称后加"标准装置"
- 例：一等量块标准装置（一等量块+接触式干涉仪）
- 仅由实物量具构成 → 加"标准器"（如显微标尺标准器）
- 一组实物量具 → 加"标准器组"（如高频电容标准器组）

### 1.5 计量标准的考核组织 ★★★
#### (1) 社会公用计量标准考核
- 国务院计量行政部门组织建立的及省级最高等级 → 国务院计量行政部门主持
- 地（市）、县级最高等级 → 上一级计量行政部门主持
- 其他等级 → 组织建立的计量行政部门主持
- 合格颁发《社会公用计量标准证书》
#### (2) 部门计量标准考核
- 国务院有关部门和省级有关部门最高等级
- 同级政府计量行政部门主持考核
- 取得证书后部门内部开展非强制检定
#### (3) 企事业单位计量标准考核
- 主管部门同级的计量行政部门主持考核
- 取得证书后单位内部非强制检定
#### (4) 无主管部门单位
- 向工商注册地计量行政部门申请
#### (5) 授权单位
- 向授权的计量行政部门申请

### 1.6 计量标准考核的内容 ★★★
#### 考评员制度
- 实行考评员考评制度
- 考评员经国家质检总局或省级考核合格
- 取得计量标准考评员证
- 考评项目应与所取得资格的考评项目一致
#### 六大考核内容
##### ① 计量标准器具及配套设备
- 齐全合格、具备开展检定或校准能力
##### ② 计量标准的主要计量特性
- 测量范围
- 不确定度、准确度等级或最大允许误差
- 稳定性
##### ③ 环境条件及设施
- 互不相容区域有效隔离
- 配置温度、湿度等监控记录设备
##### ④ 人员
- 计量标准负责人：负责建立、使用、维护、溯源、文件集更新
- 每项至少两名检定/校准人员
##### ⑤ 文件集（五个重要文件）★★★
##### ⑥ 计量标准测量能力确认
- 测量重复性和稳定性符合技术要求

### 1.7 文件集（五个重要文件）★★★
- ① 计量检定规程或技术规范
##### ② 计量标准技术报告
- 新建必须撰写
- 重大变化引起主要计量特性变化时重新修订
- ③ 检定或校准的原始记录
- ④ 检定或校准证书
- ⑤ 管理制度

### 1.8 计量标准的溯源性 ★★★
#### 基本要求
- 定期溯源至计量基准或社会公用计量标准
- 计量标准器及主要配套设备应有连续、有效的检定或校准证书
- 复校间隔执行国家计量校准规范建议或校准机构给出
#### ① 有效的溯源机构
- 计量标准器：法定计量检定机构或授权机构建立的社会公用计量标准检定/校准
- 主要配套设备：具有相应测量能力的计量技术机构
#### ② 检定溯源要求（重要）★★★
- 凡是有计量检定规程的计量标准器及主要配套设备
- 应当以检定的方式溯源
- 不能以校准方式溯源
#### ③ 校准溯源要求
- 没有检定规程的依据国家计量校准规范进行校准
- 无国家计量校准规范，可依据有效的校准方法
- 校准项目和主要技术指标应满足检定/校准工作需要
#### ④ 比对方式（兜底措施）
- 不能以检定或校准方式溯源时才采用
- 确保计量标准量值的一致性
#### ⑤ 标准物质溯源
- 使用处于有效期内的有证标准物质

### 1.9 计量标准主要计量特性 ★★
- (1) 测量范围
- (2) 不确定度、准确度等级或最大允许误差
##### (3) 稳定性
- 新建：经过半年以上的稳定性考核
- 已建：每年至少一次稳定性考核
- (4) 其他特性：灵敏度、鉴别阈、分辨力、漂移、死区、响应特性等

### 1.10 稳定性考核方法 ★★★
#### 方法一：核查标准法 ★★★
- a. 选量值稳定的被测对象作为核查标准
##### b. 新建计量标准
- 每隔一段时间（>1个月）测一组n次
- 共m组（m≥4）
- 取m组测得值中最大值与最小值之差作为稳定性
##### c. 已建计量标准
- 每年至少1次，n次重复测量取算术平均值
- 相邻两年测得值之差的绝对值作为稳定性
##### 【例】新建二等量块标准装置
- 选10mm三等量块作核查标准
- 每隔1.5月测一组10次，共5组
- 平均值：10.003、10.011、10.010、10.001、10.008
- 稳定性 = 10.011 - 10.001 = 0.010mm
#### 方法二：高等级计量标准法
- 程序同核查标准法
#### 方法三：控制图法
- 适用于准确度较高且重要的计量标准
- 平均值控制图：判断不受控的系统效应
- 标准偏差/极差控制图：判断不受控的随机效应
#### 方法四：规程/规范规定方法
#### 方法五：计量标准器溯源数据法
- 每年溯源的检定/校准数据制成稳定性考核记录表或曲线图

### 1.11 稳定性的判定方法 ★★★
- 采用标称值或示值使用 → 稳定性 < 最大允许误差的绝对值
- 加修正值使用 → 稳定性 < 修正值的扩展不确定度（U，k=2 或U₉₅）
- 规程/规范有规定时 → 依据规程规定判断

### 1.12 检定或校准结果的重复性 ★★★
#### (1) 贝塞尔公式法
- s(yi) = √[Σ(yi-ȳ)²/(n-1)]
- 适合测量次数较多
#### (2) 合并样本标准差（过程标准差）
- sp = √[ΣΣ(ykj-ȳj)²/(m(n-1))]
- 也可写成 sp = √[Σsj²/m]
#### (3) 重复性的要求
- 新建：直接作为不确定度来源用于评定
- 已建（新测重复性 ≤ 新建重复性）：符合要求
- 已建（新测重复性 > 新建重复性）：依据新值重新评定不确定度

### 1.13 检定或校准结果的验证 ★★★
#### 1) 传递比较法（优先采用，具有溯源性）
- 用被考核计量标准与高一级计量标准测同一稳定被测对象
- 满足：|y_lab - y_ref| ≤ √(U²_lab + U²_ref)
##### 当 U_lab/U_ref ≥ 3 时可忽略 U_ref
- 简化为：|y_lab - y_ref| ≤ U_lab
#### 2) 比对法（不具溯源性，仅在不能采用传递比较法时使用）
- |y_lab - ȳ| ≤ √[(n-1)/n] · U_lab

### 1.14 量值溯源和传递框图（三级三要素）★★
##### 三级
- 上一级计量器具
- 本级计量器具
- 下一级计量器具
##### 三要素
- 上级：名称、不确定度/准确度等级/MPE、保存机构
- 本级：名称、测量范围、不确定度/准确度等级/MPE
- 下级：名称、测量范围、不确定度/准确度等级/MPE
- 三级之间注明溯源和传递方法

### 1.15 建立计量标准的技术准备
- 新建至少经过半年试运行
- 考察重复性及稳定性等计量特性
- 确认符合要求

### 1.16 申请考核资料 ★★
#### 新建计量标准考核资料
- 《计量标准考核（复查）申请书》
- 《计量标准技术报告》
- 计量标准器及配套设备有效检定/校准证书复印件
- 可证明测量能力的其他技术资料
- 《计量标准的重复性试验记录》
- 《计量标准履历书》

### 1.17 考核组织与实施 ★★
- 考核组织工作：10个工作日内完成
- 每项计量标准1至2名考评员
- 审批工作：20个工作日内完成
- 考评工作（含整改、复核、审核）：80个工作日内完成
- 《计量标准考核证书》有效期：5年

### 1.18 考评原则
- 新建计量标准：先书面审查→现场考评
##### 复查计量标准：通常采用书面审查
- 资料不能证明测量能力时安排现场考评
- 多项复查考核：可现场抽查方式

### 1.19 计量标准复查 ★★
- 计量标准器应按期送检复核
- 有效期届满6个月前申请复查考核
- 合格 → 准予延长有效期
- 不合格 → 发送《计量标准考核结果通知书》
- 超过有效期 → 按新建计量标准重新申请考核

### 1.20 计量标准器或主要配套设备的更换 ★★★
- (1) 不确定度/准确度/MPE变化 → 按新建申请考核
- (2) 测量范围/检定校准项目变化 → 申请复查考核
- (3) 计量标准器或主要配套设备更换（无变更）→ 履历书记载+重新评定
- (4) 易耗品更换（如标准物质）→ 履历书中予以记载
- (5) 规程或技术规范更换 → 履历书中记载
- (6) 规程更换致实质性变化 → 申请复查考核
- (7) 主要计量特性发生重大变化 → 申请复查考核（期间暂停）
- (8) 检定或校准人员更换 → 履历书中记载
- (9) 单位名称更换 → 报告并申请换发证书

### 1.21 计量标准的封存和撤销
- 有效期内需要暂时封存或撤销
- 填写《计量标准封存（或撤销）申报表》报主管部门审批
- 撤销 → 由主持考核部门收回《计量标准考核证书》

### 1.22 计量标准的恢复使用
- 有效期内 → 申请复查考核
- 超过有效期 → 按新建申请考核

## 二、标准物质 ★★
### 2.1 两个明显特点
- 具有量值准确性
- 用于测量目的
### 2.2 定级三大依据
- 稳定性
- 均匀性
- 准确性
### 2.3 一级标准物质定级条件
- 用绝对测量法或两种以上不同原理可靠方法定值
- 不确定度达国内最高水平
- 均匀性在不确定度范围内
- 稳定性在1年以上
- 包装形式符合技术规范
### 2.4 二级标准物质定级条件
- 与一级比较或用一级定值方法定值
- 不确定度和均匀性满足一般测量需要
- 稳定性在半年以上
- 包装形式符合技术规范

## 三、计量比对 ★★★
### 3.1 主导实验室条件
- ① 技术上具备优势，参加过相关量国际比对或对比对有较深入了解
- ② 在涉及领域内有稳定可靠的计量基准/标准，不确定度符合要求
- ③ 具有相适应技术能力的人员
- ④ 环境条件、材料供应满足要求

### 3.2 主导实验室七项职责
- ① 预先估计比对有效性，设计或选择并起草比对实施方案
- ② 确定稳定可靠的传递标准及适当的传递方式
##### ③ 开展前期实验
- 传递标准的重复性、均匀性和稳定性实验
- 运输特性实验
- ④ 对传递标准采取必要包装措施
- ⑤ 澄清/解释方案，协调或解决问题，监督进程，记录过程
- ⑥ 汇总数据，分析结果，编写比对总结报告
- ⑦ 遵守保密规定

### 3.3 参比实验室六项责任
- (1) 收到比对计划及时书面表明是否参加
- (2) 参与方案讨论，正确理解
- (3) 按方案接收和较送（或发运）传递标准，意外情况及时报主导实验室
- (4) 按进度完成比对，记录过程，按时上报原始数据、测量结果及不确定度
- (5) 对总结报告讨论，参与总结会
- (6) 遵守保密规定

### 3.4 比对实施方案14项内容 ★★
- 1. 概述（来源、目的、范围、性质）
- 2. 总体描述（量及量值，设备和环境要求）
- 3. 实验室（主导和参比，联系人和方式）
- 4. 传递标准（或样品）描述
- 5. 传递路线及比对时间
- 6. 传递标准的运输和使用
- 7. 传递标准的交接
- 8. 比对方法和程序
- 9. 意外情况处理程序
- 10. 记录格式
- 11. 报告内容
- 12. 参考值及数据处理方法
- 13. 保密规定
- 14. 其他注意事项

### 3.5 传递标准的要求 ★★
- 1) 稳定可靠，必要时采用1台主+2台或多台副传递标准
##### 2) 比对路线的三种典型形式
- 圆环式（环形）
- 星形式
- 花瓣式
- 3) 中途出问题时主导实验室提供辅助措施
- 4) 按方案规定时间开展，延误时通知相关实验室
- 5) 主导实验室确定运输方式，保证安全
- 6) 参比实验室接到后立即检查，填好交接单

### 3.6 参考值的确定方法 ★★★
#### 方法1：国家计量基准校准值
- 主导实验室将传递标准送国家计量基准校准
- 校准值作为参考值
#### 方法2：主导实验室传递标准校准值
- 主导实验室不确定度明显小于参比实验室时
- 参考值的不确定度=主导实验室测量结果的不确定度
#### 方法3：算术平均值
- Yri = (1/n)·ΣYji
- uri = (1/n)·√(Σuji²)
#### 方法4：加权平均值 ★★★
- 适用于不确定度可靠性确认且有显著差异时
##### 权重与各实验室宣称不确定度平方成反比
- Wji = 1/uji²
- 加权平均值：Yri = Σ(Yji/uji²) / Σ(1/uji²)
- 加权标准不确定度：uri = 1/√[Σ(1/uji²)]

### 3.7 比对结果评价（En值法）★★★
#### En值计算公式
##### 实验室不参加参考值计算时
- En = (y_lab - y_ref) / √(U²_lab + U²_ref)
##### 实验室参加参考值计算时
- En = (y_lab - y_ref) / √(U²_lab - U²_ref)
- ylab：实验室测量结果
- yref：参考值
- Ulab/Uref：扩展不确定度（k=2 或 U₉₅）
#### 判定准则
- |En| ≤ 1 → 比对结果可接受
- |En| > 1 → 超出合理预期，应分析原因

### 3.8 数据修改与保密 ★★
#### 数据修改
- 报告发出前，参比实验室对数据任何修改均应正式书面方式
- 报告中体现修改过程和原因
- 主导实验室不得提示参比实验室修改数据
- 处理完数据后发现异常，可了解细节，但不允许修改
#### 数据保密
- 整个比对过程主导实验室注意数据保密直至报告发出

### 3.9 比对总结会
- 主导实验室在规定时间内完成初步报告
- 向参比实验室公布并征求意见
- 修改后完成最终报告
- 由比对组织者召开会议审查通过

### 3.10 异常值剔除
- 当参考值为各实验室测量结果平均值
- 个别实验室测量结果偏离过大
- 为公平起见需剔除该实验室测量结果

### 3.11 案例：6实验室比对计算 ★★
#### 已知数据
- 主导：530.1±0.6mm，A：534.5±1.2，B：533.2±1.0
- C：531.1±1.0，D：530.4±0.6，E：532.3±0.8
#### 比对路线（至少两种）
- 环形传递法
- 星形传递法
#### 以主导实验室结果为参考值的En值
- En = (xi - xr)/√(2(ui² + ur²))
#### 加权平均值参考值（参比实验室）
- 分子：Σ(Yj/uj²) = 534.5/1.44 + 533.2/1 + 531.1/1 + 530.4/0.36 + 532.3/0.64
- 分母：Σ(1/uj²) = 1/1.44 + 1/1 + 1/1 + 1/0.36 + 1/0.64
- 标准不确定度 ur = 1/√(Σ1/uj²)
#### 算术平均值参考值
- x̄ = (534.5 + 533.2 + 531.1 + 530.4 + 532.3)/5 = 532.3 mm
#### 主导+部分参比加权平均值
- 取主导、D、E（不确定度较小者）：(530.1/0.36 + 530.4/0.36 + 532.3/0.64) / (1/0.36 + 1/0.36 + 1/0.64) = 530.7 mm

## 四、期间核查 ★★★
### 4.1 期间核查的定义
- 确定计量标准/标准物质/测量仪器是否保持原有状态的操作
- 核查"示值误差""修正值""修正因子"是否与校准结果一致
- 不是重新校准或再校准

### 4.2 程序文件应规定
- 职责分工及工作流程
- 需实施核查的仪器确定原则
- 核查方案的制定和评审程序
- 失控或趋势失控时的处理流程

### 4.3 核查标准选择原则 ★★
- 具有需核查的参数和量值
- 良好的稳定性（及分辨力和重复性）
- 必要时可提供指示
- 不必考虑便携和搬运
- 不一定要求提供参考量值
- 一般选择关键测量参数和基本测量范围或常用测量点

### 4.4 期间核查方法 ★★★
#### 通用方法（参考值赋值法）
##### 1) 经高一等级检定/校准后，立即对核查标准测一组k次（k≥10）测量
- 获得值y₀ 作为参考值ys 赋予核查标准
##### 2) 经过校准有修正值/修正因子时
- ys = y₀ + δ（δ为修正值）
- ys = y₀ - e（e为示值误差）
##### 3) 隔一段时间后第一次期间核查
- 测量m次（m可以不等于k）取算术平均值ȳ₁
- 4) 每隔一段时间重复，得到 ȳ₁，ȳ₂，...，ȳn
##### 5) 控制上下限确定
- [ys - Δ, ys + Δ]：用最大允许误差Δ
- [ys - U, ys + U]：用扩展不确定度U
##### 6) 时间轴
- 一个检定周期内 → 月份为单位
- 历年期间核查曲线 → 年份为单位
#### 控制图法
- 对准确度较高且重要的计量基/标准
- 平均值控制图：判断系统效应
- 标准偏差/极差控制图：判断随机效应

### 4.5 期间核查时机
#### 定期核查
- 规定两次核查之间最长时间间隔
- 测量仪器刚完成溯源时做首次核查（确定初始校准状态）
#### 不定期核查时机
- ① 即将用于非常重要的测量
- ② 准确度要求接近测量仪器极限
- ③ 即将用于外出测量
- ④ 大型仪器环境条件或测量条件发生大变化刚恢复
- ⑤ 发生碰撞、跌落、电压冲击等意外事件后
- ⑥ 对仪器性能有怀疑时

### 4.6 不需期间核查的情况
##### 性能稳定的实物量具（砝码、量块等）
- 校准间隔内通常不会出现大的量值变化
- 玻璃量具等性能稳定的计量器具
- 教学用计量器具

### 4.7 核查结果应对措施 ★★
- δ未超出MPE → 核查通过
- δ接近MPE → 加大核查频次或再校准
- δ超出MPE → 立刻停止使用，进行再校准
- 影响已出具报告 → 采取补救措施
- 可设控制限值和警戒值

### 4.8 案例：焦度计期间核查 ★★★
#### 背景
- 2016年建立工作镜片组检定装置（一级焦度计为主标准器）
- 2017年建立焦度计检定装置（标准镜片组为主标准器）
#### 关键数据
- 标准镜片组扩展不确定度 U=0.01m⁻¹（k=2）
- 一级焦度计MPE = ±0.06 m⁻¹（0~5m⁻¹范围）
- 5m⁻¹检定点修正值 = -0.01 m⁻¹
- 期间核查测量平均值 = 5.01 m⁻¹
#### 问题分析
- 在授权范围内自检 → 做法正确
- 仅对一级焦度计开展期间核查 → 正确（二级和工作镜片组属教学用）
- 用工作镜片组中部分镜片做核查标准 → 合理
- 标准镜片组属实物量具，性能稳定 → 不需单独期间核查
#### 参考值与控制区间计算
- 参考值 ys = ȳ + δ = 5.01 + (-0.01) = 5.00 m⁻¹
- 控制区间：[ys-Δ, ys+Δ] = [5.00-0.06, 5.00+0.06] = [4.94, 5.06] m⁻¹

## 五、计量器具型式评价 ★★★
### 5.1 型式评价的目的与定义
- 计量器具型式：样机+技术文件（图纸、设计资料）
- 法制计量领域的计量技术活动
- 目的：为型式批准提供技术数据和评价
- 作为给予或拒绝型式批准的依据
- 应执行统一的型式评价大纲

### 5.2 型式评价的范围与机构
- 对象：用于社会公众关心其测量工作质量的计量器具
- 承担机构：法定计量技术机构
- 合格 → 政府计量行政部门颁发型式批准证书

### 5.3 办理型式评价的程序 ★★
##### 申请单位向政府计量行政部门递交申请书
- 国内：向省级政府计量行政部门
- 进口（外商或代理人）：向国务院计量行政部门
- 获得受理后委托技术机构进行型式评价
- 通知申请单位

### 5.4 型式评价四阶段
- (1) 审查技术文件、资料
- (2) 制定型式评价大纲
- (3) 试验
- (4) 出具型式评价报告等技术文件，并上报

### 5.5 型式评价结论判定原则 ★★★
- (1) 系列产品中有一种规格不合格 → 该系列判定为不合格
##### (2) 每一规格的判定
- 单项判定：技术要求、实测数据、合格结论；有一台样机不合格则单项不合格
###### 综合判定（基于单项判定）
- 主要单项：影响法制管理、计量性能、安全性能等
- 非主要单项：不影响上述项目
- 一项以上（含一项）主要单项不合格 → 综合判定不合格
- 两项以上（含两项）非主要单项不合格 → 综合判定不合格

### 5.6 型式评价的实施 ★★
- 依据JJF 1015-2002《计量器具型式评价和型式批准通用规范》
- 申请单位提交完整技术资料和试验样机
- 一般3个月内完成
- 长期稳定性、可靠性试验项目可适当延长
- 应事先向委托部门和申请单位说明

### 5.7 不合格的处理
- 首次试验不合格 → 通知申请单位
- 可在3个月内对样机和技术资料进行一次改进
- 改进后送原技术机构重新评价
- 试验中发现不合格但样机条件许可 → 继续做完
- 样机无法继续 → 停止相关工作

### 5.8 型式批准证书与标志
- 经审查合格 → 颁发《型式批准证书》
- 准予使用国家统一规定的型式批准标志和编号
- 经审查不合格 → 书面通知，再申请重办手续
- 可在铭牌或面板等明显部位标注型式批准标志和编号

### 5.9 型式评价大纲要求 ★★
- 计量要求
- 通用技术要求
- 评价的项目
- 试验方法和条件
- 计量器具和设备表
- 数据处理方法
- 合格的判据
- 甚至包括型式评价记录的格式
- 大纲会定期修订
- 改进产品：原则上不受影响部分可不重复评价

### 5.10 通用规范要点
#### 技术资料审查
- 形式审查
##### 内容审查
- 计量单位、外部结构、标识、防欺骗措施
- 命名是否符合规定
- 计量指标、功能、技术要求是否满足
#### 观察项目评价
- 不需要试验的项目通过观察评价
#### 试验项目评价
- 包括功能验证、计量性能试验、环境适应性试验、稳定性试验
- 应记录试验数据和结果
#### 报告编写
- 试验结束后按要求出具型式评价报告
- 计量性能不同的系列产品分别报告

### 5.11 样机和资料处理 ★★
#### 合格样机
- ① 铅封和标记（承担型式评价的技术机构）
- ② 保存：交申请单位保存至停产后第五年
#### 不合格样机
- 复议期过后退回申请单位
#### 技术资料
- 申请单位提交两套：一套返还，一套技术机构保存
- 技术机构保存还包括各种文件、报告和记录
- 按JJF 1069要求保存
#### 保密
- 评价中和评价后均应保密样机、技术资料及结论

### 5.12 案例：YP系列电子天平型式评价 ★★★
#### 背景
- YP系列Ⅱ级电子天平型号：YP203N(200g/0.001), YP503N(500g/0.001)
- YP802N(800g/0.01), YP1002N(1000g/0.01), YP6001N(6000g/0.1)
#### 案例错误点分析
##### 错误1：未经省级初审就直接送计量技术机构 → 不对
- 正确做法：省级初审通过后才委托技术机构
##### 错误2：资料不全就加盖审核章 → 不对
- 正确做法：收到完整技术资料后才能审查
##### 错误3：仅选YP503N和YP1002N两个型号 → 不符合规定
- 正确做法：准确度相同测量区间不同的，样机应包括测量区间上下限的产品；每种产品提供1~3台样机
##### 错误4：YP503N样机均合格就判系列合格 → 不正确
- 正确做法：YP1002N电子干扰试验不合格 → 该型号不合格 → 整个系列不合格
#### 示值误差计算（YP503N 001号样机）
- 0g示值0.000 → 误差0.000，MPE±0.005，合格
- 0.02g示值0.020 → 误差0.000，合格
- 5g示值5.001 → 误差+0.001，合格
- 20g示值19.998 → 误差-0.002，合格
- 50g示值49.995 → 误差-0.005，合格（临界）
- 100g示值100.002 → 误差+0.002，MPE±0.010，合格
- 200g示值199.990 → 误差-0.010，合格（临界）
- 500g示值499.985 → 误差-0.015，MPE±0.015，合格（临界）

## 六、计量检定、校准与检测 ★★★
### 6.1 三个核心概念定义对比 ★★★
#### 检定
- 查明和确认测量仪器符合法定要求
- 对象：依法管理的计量器具目录中的器具
- 内容：检查、加标记和（或）出具检定证书
- 具有法制性
- 是量值传递/溯源的重要形式
- 是计量法制管理重要手段
- 结论：合格与否
#### 校准
- 规定条件下的一组操作
- 第一步：确定示值误差
- 第二步：给出修正值/修正因子/修正曲线及不确定度
- 不应与系统调整（错称"自校准"）混淆
- 不应与校准的验证混淆
#### 检测（法定计量检定机构从事的）
- 1) 计量器具新产品和进口计量器具的型式评价
- 2) 定量包装商品净含量、商品包装、零售商品称重计量检验
- 3) 用能产品的能源效率标识计量检测

### 6.2 计量检定的实施原则（5项）★★
- (1) 经济合理、就地就近
- (2) 按国家计量检定系统表（国务院计量行政部门制定）
##### (3) 按计量检定规程进行
- 国家：国务院计量行政部门制定
- 部门和地方：分别由相关部门制定
- (4) 检定结果必须做出合格与否结论，出具证书或加盖印记
- (5) 工作人员经考核合格并持有检定员证

### 6.3 强制检定的管理与实施 ★★★
#### 范围
##### (1) 计量标准器具
- 社会公用计量标准器具
- 部门和企事业单位使用的最高计量标准器具
##### (2) 工作计量器具
- 列入《实施强制管理量器具目录》
- 监管方式为"强制检定"
- 必须在贸易结算、安全防护、医疗卫生、环境监测中实际使用
- 未按规定申请检定或检定不合格的，不得使用
#### 实施
- (1) 县级以上人民政府计量行政部门指定
  - 法定计量检定机构
  - 或授权的计量技术机构
- (2) 实行定点、定期检定
- (3) 依据《强制检定的工作计量器具检定管理办法》
- (4) 计量标准器具使用者向主持考核部门申报，并按时申请检定
- (5) 工作计量器具使用者登记造册，向当地计量行政部门备案
- (6) 在政府规定期限内完成
- (7) 按规定收费标准收费
- (8) 按检定规程给出检定周期
#### 主要特点
- (1) 县级以上统一实施监督管理（经济合理、就地就近）
##### (2) 固定检定关系，定点送检
- 工作计量器具：当地县（市）级安排
- 计量标准：主持考核的政府计量行政部门安排
- 政府计量行政部门之间可协商跨地区委托检定

### 6.4 非强制检定的管理 ★★
##### 检定周期：企业根据实际使用情况自行确定
- 原则：科学、经济、量值准确
##### 检定方式：企业自行决定
- 本单位检定或送其他机构检定
- 任何单位不得干涉

### 6.5 计量仲裁检定 ★★
#### 定义
- 县级以上政府计量行政部门用计量基准或社会公用计量标准
- 进行的以裁决为目的的检定、测试活动
#### 法律效力
- 数据作为处理计量纠纷的依据，具有法律效力

### 6.6 计量检定印、证管理 ★★
#### 种类
- (1) 检定证书
- (2) 检定结果通知书（又称检定不合格通知书）
- (3) 检定合格证
- (4) 检定合格印
- (5) 注销印
#### 管理要求
- 字迹清楚，数据无误，内容完整
- 检定、核验、主管人员签字
- 加盖检定单位印章
#### 出证规则

- 不合格 → 出具结果通知书或注销原合格印证

### 6.8 非标准方法的确认 ★★★
#### 标准方法
- 计量检定规程
- 计量校准规范
- 型式评价大纲
- 国际标准、国家标准、行业标准
#### 非标准方法
- 自编校准规范、自编型式评价大纲
- 知名技术组织或科学书籍/期刊最新公布的方法
- 设备制造商指定的方法
- 标准方法超出原规定范围或扩充修改也算
#### 确认的含义
- 通过核查并提供客观证据
- 证实特定预期用途的特殊要求得到满足
#### 确认方法（5种）
- (1) 使用计量标准或标准物质进行校准
- (2) 与其他方法所得结果进行比较
- (3) 实验室间比对
- (4) 对影响结果的因素作系统性评审
- (5) 根据理论原理和实践经验对所得结果不确定度进行评定
#### 审批
- 经正式审批手续
- 由对技术问题负责的人员签名批准后方可使用
#### 文件控制
- 专门部门或专职人员对方法文件进行受控管理
- 现行有效文件有受控文件标识
- 作废或无受控状态标识 → 不能作为依据使用

### 6.9 计量标准的选择原则
- 国家计量检定规程和校准规范明确规定的，按规定执行
- 依据其他文件时，按国家计量检定系统表中上一级标准/基准
- 法定计量检定机构 → 应使用经标准考核并取得有效证书的标准

### 6.10 检定校准检测原始记录 ★★
#### 真实性要求
- 必须当时记录，不能事后追记或补记
- 不能以重抄的记录代替
- 不得虚构、伪造数据
#### 信息量要求
- 包含足够信息，使结果能在与原来接近的条件下复现
#### 记录格式
- 不能记在白纸或只有通用格式的纸上
- 为每种器具单独设计适合的记录格式
- 应有记录格式文件编号
#### 记录信息
- 不能只记结果数据
- 应记录标准值、被测仪器示值、计算过程
#### 书写要求
- 用墨水笔填写，不得用铅笔等易擦笔
- 法定计量单位
- 不得随意涂改，错误用横杠划掉，旁边写正确内容，签名/盖章
#### 人员签名
- 执行人员、核验人员、抽样人员均亲笔签名
- 计算机直接输入可电子签名

### 6.11 核验工作内容 ★★
- (1) 对照原始记录检查被测对象信息是否完整、准确
- (2) 检查规程规范是否正确、有效版本
- (3) 检查标准器具和配套设备是否符合、是否在有效期内
- (4) 检查项目是否都已完成
- (5) 对数据计算、换算、修约进行验算
- (6) 检定规程规定要复读的，负责复读
- (7) 检查结论是否正确
- (8) 检查记录修改是否规范，有无修改人签名/盖章
- (9) 检查证书报告与原始记录是否一致
- 证书信息量不能多于原始记录
- 包含意见和解释时，检查是否正确
- 数据有怀疑应追究、改正、必要时重做

### 6.12 校准和测量能力（CMC）★★
- 概念：校准实验室常规条件下能提供给客户的校准和测量的能力
- 应是常规条件下校准中可获得的最小测量不确定度
- 用 k=2 或 p=0.95 的扩展不确定度表示
- 又称最佳测量能力
- 应对每一项校准项目评定CMC
- 向顾客公布

## 七、计量器具误差的表示与评定 ★★★
### 7.1 最大允许误差MPE的表示形式 ★★
#### 概念
- 由规程或规范所允许的示值误差的极限值
- 生产厂规定的技术指标
- 又称允许误差极限或允许误差限
- 通常有对称限，加"±"号
#### 表示形式
- 绝对误差形式
- 相对误差形式
- 引用误差形式
- 上述组合形式
#### 引用误差表示
- 绝对误差与特定值之比的百分数
- 特定值（引用值）：仪器测量范围上限值（满刻度值/FS）或量程
- 例：电流表MPE = ±3%×FS
##### 例：(0~150)V电压表，引用误差限±2%
- 任意示值MPE均为 ±2%×150V = ±3V
- 越使用到测量范围上限时，相对误差越小
##### 转换关系
- 绝对误差 = 引用误差 × 特定值（满刻度值）
- 绝对误差 = 相对误差 × 示值
#### 组合形式
- 例：脉宽 ±(p×10% + 0.025μs)（相对+绝对）
- 例：数字电压表 ±(1×10⁻⁶×量程 + 2×10⁻⁶×读数)（引用+相对）
- "±"应在括号外，写在括号内是错误的

### 7.2 案例：电流表绝对/相对误差 ★★
#### 题目
- 0.5级测量上限100A的电流表，测50A时的绝对误差和相对误差MPE
#### 解答
- 0.5级 → 引用误差±0.5%
- 绝对误差MPE = 100A × ±0.5% = ±0.5A
- 50A示值的相对误差MPE = ±0.5A/50A = ±1%

### 7.3 符合性评定基本要求 ★★★
#### 概念
- 符合性评定 = 合格评定
- 评定示值误差是否在最大允许误差范围内
#### 当 U₉₅/MPEV ≤ 1/3 时（基本判据）
- 测量不确定度对评定的影响可忽略不计
- 合格判据：|Δ| ≤ MPEV
- 不合格判据：|Δ| > MPEV
- |Δ|：被检仪器示值误差的绝对值
- MPEV：被检仪器示值最大允许误差的绝对值
- 型式评价和仲裁鉴定可取 1/5

### 7.4 案例：数字电压表合格性评定（满足1/3要求）★★
#### 已知
- 测量范围0~20V，10V检定
- 示值误差 = +0.0007V
- U₉₅ = 0.25mV
- MPE = ±(0.0035%×读数 + 0.0025%×量程)
#### 计算
- 10V点MPE = ±(0.0035%×10 + 0.0025%×20) = ±0.00085V
- MPEV = 0.00085V
- U₉₅/MPEV = 0.25/0.85 < 1/3 ✓
- |Δ| = 0.0007V < 0.00085V = MPEV
- **结论：合格**

### 7.5 考虑测量不确定度的符合性评定 ★★★
#### 当 U₉₅/MPEV > 1/3 时
- 必须考虑测量不确定度的影响
- (1) 合格判据：|Δ| ≤ MPEV - U₉₅
- (2) 不合格判据：|Δ| ≥ MPEV + U₉₅
- (3) 待定判据：MPEV - U₉₅ < |Δ| < MPEV + U₉₅

### 7.6 案例：高频电压表合格判定（不满足1/3）★★
#### 已知
- MPE = ±2.0%
- 1V点示值误差 = -0.008V
- U₉₅rel = 0.9%
#### 计算
- U₉₅/MPEV不满足1/3 → 考虑测量不确定度
- |Δ| = 0.008V，U₉₅ = 0.9%×1V = 0.009V，MPEV = 2%×1V = 0.02V
- MPEV - U₉₅ = 0.02 - 0.009 = 0.011V
- |Δ| = 0.008V ≤ 0.011V ✓
- **结论：合格**

### 7.7 案例：高频电压表不合格判定 ★★
#### 已知
- 同上MPE = ±2.0%, U₉₅rel = 0.9%
- 1V点示值误差 = 0.030V
#### 计算
- |Δ| = 0.030V
- MPEV + U₉₅ = 0.02 + 0.009 = 0.029V
- |Δ| = 0.030V > 0.029V
- **结论：不合格**

### 7.8 案例：投影仪检定（多次测量）★★
#### 已知
- 10mm处MPE = ±6μm
- 标准线纹尺U = 0.16μm（k=2）
- 10次测量数据：9.999, 9.998, 9.999, 9.999, 9.999, 9.999, 9.999, 9.998, 9.999, 9.999
#### 计算
- U₉₅/MPEV = 0.16/6 < 1/3 ✓
- 平均值 x̄ = 9.9988mm
- 示值误差 = 9.9988 - 10 = -0.0012mm = -1.2μm
- |Δ| = 1.2μm < 6μm = MPEV
- **结论：合格**

## 八、异常值的判别和剔除 ★★★
### 8.1 格拉布斯准则 ★★★
#### 判定步骤
- (1) 计算n个观测值的算术平均值 x̄
- (2) 计算实验标准偏差 s
- (3) 计算各观测值的残差 vi = xi - x̄
- (4) 找残差绝对值最大者 vd → xd 为可疑值
- (5) 给定包含概率p=0.99(α=0.01) 或 p=0.95(α=0.05)
- (6) 计算 |xd - x̄|/s
- (7) 与临界值 G(α, n) 比较
- (8) 若 |xd - x̄|/s > G(α, n) → 判为异常值予以剔除
- (9) 剔除后重新检验剩余数据

#### 案例：n=6 重复观测值 ★★★
- 数据：0.82, 0.78, 0.80, 0.91, 0.79, 0.76
- 算术平均值 x̄ = 0.81
- 实验标准偏差 s = 0.053
- 残差：0.01, -0.03, -0.01, 0.10, -0.02, -0.05
- 最大残差0.10对应xd = 0.91
- |xd - x̄|/s = 0.10/0.0529 = 1.89
- 查表G(0.05, 6) = 1.82
- 1.89 > 1.82 → x4=0.91为异常值，剔除

#### 剔除后重新检验
- 剩余n=5个：x̄ = 0.79, s = 0.022
- 最大残差对应xd = 0.76
- |0.76 - 0.79|/0.022 = 0.03/0.022 = 1.36
- 查表G(0.05, 5) = 1.67
- 1.36 < 1.67 → 0.76不是异常值

### 8.2 狄克逊准则 ★★
#### 排序
- 重复观测值由小到大排列：x₁, x₂, ..., xn
#### 计算统计量γ与γ'
##### (1) n=3~7
- γ₁₀ = (xn - xn-1)/(xn - x₁)
- γ'₁₀ = (x₂ - x₁)/(xn - x₁)
##### (2) n=8~10
- γ₁₁ = (xn - xn-1)/(xn-1 - x₁)
- γ'₁₁ = (x₂ - x₁)/(xn - x₂)
##### (3) n=11~13
- γ₂₁ = (xn - xn-2)/(xn-1 - x₁)
- γ'₂₁ = (x₃ - x₁)/(xn - x₂)
##### (4) n>14
- γ₂₂ = (xn - xn-2)/(xn-2 - x₁)
- γ'₂₂ = (x₃ - x₁)/(xn-2 - x₁)
#### 判定（设临界值D(α, n)）
- 当 γij > γ'ij 且 γij > D(α, n) → xn 为异常值
- 当 γij < γ'ij 且 γ'ij > D(α, n) → x₁ 为异常值
- 否则没有异常值

### 8.3 案例：电阻值n=10的双准则判别 ★★★
#### 数据（已排序）
- 10.0003, 10.0004, 10.0004, 10.0005, 10.0005, 10.0005, 10.0006, 10.0006, 10.0007, 10.0012
#### ① 狄克逊准则（α=0.05, n=10, D=0.530）
- γ₁₁ = (10.0012-10.0007)/(10.0012-10.0004) = 0.625
- γ'₁₁ = (10.0004-10.0003)/(10.0007-10.0003) = 0.25
- γ₁₁ = 0.625 > 0.25 = γ'₁₁ 且 0.625 > 0.530 = D
- → x₁₀ = 10.0012 为异常值
#### ② 格拉布斯准则
- s = 0.00025Ω
- G(0.05, 10) = 2.18
- 最大残差 |x₁₀ - x̄| = 0.00063
- G·s = 2.18 × 0.00025 = 0.00055
- |x₁₀ - x̄| > G·s → x₁₀ 为异常值
#### 结论
- 两种判别法结论相同，x₁₀ 属异常值

## 九、加权算术平均值及其实验标准偏差 ★★★
### 9.1 加权算术平均值的计算
- 对同一被测量进行多组测量，考虑各组的权后所得的被测量估计值
- 公式：x_w = ΣWixi / ΣWi（i=1到m）
- Wi：第i次观测结果的权
- xi：第i次的观测结果
- m：测量的次数
- 权Wi越大，xi越可信赖

### 9.2 加权算术平均值实验标准差
- s_w = √[ΣWi(xi - x_w)² / ((m-1)ΣWi)]

### 9.3 应用：参考值的加权计算
- Wj = 1/uj²（权重与不确定度平方成反比）
- 加权参考值：Yr = Σ(Yj/uj²) / Σ(1/uj²)
- 加权标准不确定度：ur = 1/√(Σ1/uj²)

#### 4. 计量性能要求

### 10.4 国家计量校准规范编写
#### 编写原则
- 符合法律法规规定
- 适用范围明确
- 充分考虑技术和经济合理性
- 为采用最新技术留有空间
#### 主要内容
##### 4. 计量特性（两部分）
- 标准条件下评价计量器具性能
- 使用条件下评估最终测量结果不确定度
- 5. 校准条件

- 注明：送校单位可根据实际情况自主决定

### 10.5 检定周期确定的原则与方法 ★★
##### 原则
- (1) 确保使用中量值准确可靠，超出允差风险尽可能小
- (2) 经济合理，使风险和费用平衡最佳化
- 检定规程一般给出常规条件下的最长周期

### 10.6 计量检定规程、校准规范的使用 ★★
#### (1) 检定手段和条件不完全满足时
- ① 不合格 → 不能开展检定，不能出证书
- ② 制定规程时对特殊情况制定变通条款
#### (2) 部分检定或出证
- ① 具备条件且符合规程要求 → 可作部分检定并出证书（注明）

#### (3) 没有计量检定规程的器具
- ① 暂作计量法制监督检查（地方/部门掌握）
- ② 不能进行仲裁检定，可计量调解

#### (4) 参照某检定规程
- ① 规程允许参照的可作为依据，可出具证书
- ② 参照内容应在规程中明确规定
#### (6) 规程与技术标准协调
- ① 应努力使两者协调一致
- ② 计量检定必须执行计量检定规程
- ③ 因执行规程与技术标准出现纠纷可协商或申请仲裁
#### (7) 部门和地方计量检定规程协调
- ① 部门规程在本部门、地方规程在本地区实施
- ② 同一种器具有多种规程时，由国务院计量行政部门尽快制定国家规程

## 十一、测量不确定度评定 ★★★
### 11.1 A类标准不确定度评定 ★★★
#### 流程
- 对被测量X进行n次独立观测，得到 x₁, x₂, ..., xn
- 计算测量结果（算术平均值 x̄）
- 计算实验标准偏差 s(x)
##### 计算A类标准不确定度
- u(x̄) = s(x̄) = s(x)/√n
#### 实验标准差的估计方法
##### 1. 贝塞尔公式法（适合测量次数较多）
- s(x) = √[Σ(xi - x̄)²/(n-1)]
- 注意：s(x̄) = s(x)/√n 是 x̄ 的实验标准偏差
##### 2. 极差法（小样本）
- s(x) = (xmax - xmin)/Cn
- Cn为极差系数（查表）
##### 极差系数表
- n=2: 1.13, n=3: 1.64, n=4: 2.06, n=5: 2.33
- n=6: 2.53, n=7: 2.70, n=8: 2.85, n=9: 2.97
- n=10: 3.08, n=15: 3.47, n=20: 3.74

### 11.2 规范化常规测量A类评定 ★★★
#### 合并样本标准差
- m组数据，每组测n次
- sp = √[ΣΣ(xij - x̄j)²/(m(n-1))] = √(Σsj²/m)
#### A类标准不确定度
- uA(x̄j) = sp/√n
#### 自由度
- ν = (n-1)·k 或 ν = m(n-1)

### 11.3 案例：测量过程合并样本标准差 ★★

### 11.4 B类标准不确定度评定 ★★★
#### 流程
- 确定区间半宽度 a
- 假设测量值在区间内的概率分布
- 查表确定包含因子 k
- 计算 uB = a/k

#### 常用概率分布与k值

- 均匀分布: k=√3
- 反正弦分布: k=√2
- 三角分布: k=√6
- 梯形分布: k=√(6/(1+β²))（β为上下底半宽度比）
- 两点分布: k=1

## 十二、合成标准不确定度的计算 ★★★
### 12.1 测量不确定度的传播律 ★★★
- 数学模型 y = f(x₁, x₂, ..., xn)
##### 通用公式
- uc²(y) = Σ(∂f/∂xi)²·u²(xi) + 2ΣΣ(∂f/∂xi)(∂f/∂xj)·r(xi,xj)·u(xi)u(xj)

### 12.2 输入量间不相关时合成 ★★★
#### (1) 通用形式 r(xi,xj)=0
- uc(y) = √[Σ(∂f/∂xi)²·u²(xi)]
#### (2) 线性函数 Y=A₁X₁+A₂X₂+...+ANXN（不相关）★★★
- uc(y) = √[ΣAi²·u²(xi)]
#### (3) 乘除形式 Y=A·X₁^P₁·X₂^P₂·...·XN^PN（不相关）★★★
- uc(y)/y = √[Σ(Pi·u(xi)/xi)²]
- 即相对合成标准不确定度
- uc_rel(y) = √[Σ(Pi·u_rel(xi))²]

### 12.3 输入量正强相关 r=+1时
- uc(y) = Σ(∂f/∂xi)·u(xi)
- 灵敏系数均为1时是各分量的代数和
- 不再是方和根法合成

### 12.4 合成标准不确定度的有效自由度
- νeff = uc⁴(y) / Σ[ui⁴(y)/νi]
- 韦尔奇-萨特斯韦特公式

### 12.5 案例：乘积模型有效自由度 ★★
#### 已知
- Y = b·X₁·X₂·X₃
- n₁=10, n₂=5, n₃=15
- u(x₁)/x₁=0.25%, u(x₂)/x₂=0.57%, u(x₃)/x₃=0.82%
#### 计算
- uc(y)/y = √(0.25²+0.57²+0.82²)% = 1.03% ≈ 1%
- νeff = 1.03⁴/(0.25⁴/9 + 0.57⁴/4 + 0.82⁴/14) ≈ 19

### 12.6 案例：300g砝码合成不确定度 ★★★
#### 错误做法（典型陷阱）
- m = m₁ + m₂ = 100 + 200 = 300g
- u_rel(m₁) = u_rel(m₂) = 1×10⁻⁴
- 错误：uc_rel(m) = √(u_rel²(m₁) + u_rel²(m₂)) = √2×10⁻⁴
- 错误结论：uc(m) = 0.043g
#### 正确分析
- 测量模型为加法 m=m₁+m₂，不是乘除形式
- 不能直接用相对标准不确定度合成
##### 应先求绝对不确定度
- u(m₁) = 1×10⁻⁴ × 100g = 0.01g
- u(m₂) = 1×10⁻⁴ × 200g = 0.02g
- 灵敏系数均为+1
- uc(m) = √(0.01² + 0.02²) = √0.0005 = 0.022g
#### 关键规则 ★★★
- 只有函数为相乘（乘除）关系时
- 才可用输入量的相对标准不确定度的方和根值
- 加法/减法模型必须用绝对标准不确定度合成

### 12.7 案例：间接测量电流 ★★★
#### 已知
- I = V/R
- V = 20V，R = 5Ω
- u(R)/R = 0.3%
- 要求 uc(I) ≤ 0.02A
#### (1) 求电压表相对标准不确定度
- I = V/R = 4A
- u(I)/I = 0.02/4 = 0.5%
- 乘除模型：[u(I)/I]² = [u(V)/V]² + [u(R)/R]²
- u(V)/V = √(0.5² - 0.3²)% = 0.4%
#### (2) 均匀分布求最大允许误差
- MPEV/V = k·u(V)/V = √3 × 0.4% ≈ 0.7%
- MPEV = 0.7% × 20V = 0.14V

### 13.2 典型公式速查表
- 贝塞尔公式：s(x) = √[Σ(xi-x̄)²/(n-1)]
- A类不确定度：u(x̄) = s(x)/√n
- B类不确定度：u = a/k

// ===== Parse topics from markdown =====
function parseTopics(md) {
    const blocks = md.split(/(?=^## )/m).filter(b => b.trim());
    return blocks.map((block, i) => {
        const lines = block.split('\n');
        const titleLine = lines[0].replace(/^## /, '');
        const starsMatch = titleLine.match(/(★+)/);
        const stars = starsMatch ? starsMatch[1] : '';
        const title = titleLine.replace(/\s*★+$/, '').trim();
        const subtitles = [];
        lines.forEach(line => {
            const m = line.match(/^### (.+)/);
            if (m) subtitles.push(m[1]);
        });
        return { id: 'topic' + (i + 1), title, stars, subtitles, markdown: block };
    });
}

const topics = parseTopics(fullMarkdown);
let currentMm = null;

// ===== Render outline tree =====
function renderOutline() {
    const tree = ROOT.querySelector('#outlineTree');
    tree.innerHTML = topics.map((t, i) => {
        const subsHtml = t.subtitles.map((s, j) => {
            const sm = s.match(/(★+)/);
            const ss = sm ? '<span class="stars">' + sm[1] + '</span>' : '';
            const st = s.replace(/\s*★+$/, '').trim();
            return '<div class="subtopic-item" data-topic="' + i + '" data-sub="' + j + '" onclick="' + _NS + '.selectSubtopic(' + i + ',' + j + ')">' + st + ' ' + ss + '</div>';
        }).join('');
        const starsHtml = t.stars ? '<span class="stars">' + t.stars + '</span>' : '';
        return '<div class="topic-item" data-index="' + i + '">' +
            '<div class="topic-header" onclick="' + _NS + '.toggleTopic(' + i + ')">' +
            '<span class="arrow">&#9654;</span>' +
            '<span class="title-text">' + t.title + '</span>' +
            starsHtml + '</div>' +
            '<div class="subtopic-list">' + subsHtml + '</div></div>';
    }).join('');
}

// ===== Toggle expand/collapse =====
function toggleTopic(idx) {
    const item = ROOT.querySelectorAll('.topic-item')[idx];
    const arrow = item.querySelector('.arrow');
    const list = item.querySelector('.subtopic-list');
    const isOpen = list.classList.contains('show');
    if (isOpen) {
        list.classList.remove('show');
        arrow.classList.remove('expanded');
    } else {
        list.classList.add('show');
        arrow.classList.add('expanded');
    }
    selectTopic(idx);
}

function expandAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.add('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.add('expanded'));
}

function collapseAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.remove('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.remove('expanded'));
}

// ===== Selection =====
function clearSelection() {
    ROOT.querySelectorAll('.topic-header.active, .subtopic-item.active').forEach(el => el.classList.remove('active'));
}

function selectTopic(idx) {
    clearSelection();
    const header = ROOT.querySelectorAll('.topic-header')[idx];
    header.classList.add('active');
    renderMindmap(topics[idx].markdown, topics[idx].title);
}

function selectSubtopic(topicIdx, subIdx) {
    clearSelection();
    const item = ROOT.querySelectorAll('.topic-item')[topicIdx];
    const subItems = item.querySelectorAll('.subtopic-item');
    if (subItems[subIdx]) subItems[subIdx].classList.add('active');
    renderMindmap(topics[topicIdx].markdown, topics[topicIdx].title);
}

// ===== Render mindmap =====
function renderMindmap(markdown, title) {
    ROOT.querySelector('#titleText').textContent = title;
    const svgEl = ROOT.querySelector('#mindmapSvg');
    svgEl.innerHTML = '';
    svgEl.removeAttribute('style');
    try {
        const { Transformer } = window.markmap;
        const { Markmap } = window.markmap;
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        currentMm = Markmap.create(svgEl, { maxWidth: 300 }, root);
    } catch (e) {
        svgEl.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#999" font-size="14">' + e.message + '</text>';
    }
}

// ===== Search filter =====
function filterOutline(keyword) {
    const kw = keyword.trim().toLowerCase();
    ROOT.querySelectorAll('.topic-item').forEach((item, i) => {
        if (!kw) { item.classList.remove('hidden'); return; }
        const t = topics[i];
        const text = (t.title + ' ' + t.subtitles.join(' ') + ' ' + t.markdown).toLowerCase();
        item.classList.toggle('hidden', !text.includes(kw));
    });
}

    }
}

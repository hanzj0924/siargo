const fullMarkdown = `## 一、测量误差与减小方法 ★★★
### 误差分类 ★★
#### 系统误差（可定误差）
- 定义：在重复测量中保持不变或按可预见方式变化的误差
- 特征：由系统原因引起、重复出现、单向性
- 大小：在一定条件下恒定不变
- 子类：恒定系统误差、可变系统误差（线性/周期性）
#### 随机误差
- 定义：按不可预见方式变化的误差
- 起因：偶发因素引起，不可消除
- 特征：方向大小不固定
- 控制：通过多次重复测量加以控制（取算术平均值）
#### 偶然误差与粗大误差（非测量误差）
- 由人为读数错误、记录错误、仪器偶发故障导致
- 不属于测量误差范畴，应予剔除
### 系统误差的发现（识别）方法 ★★
#### 恒定系统误差的发现
- 多次测量同一被测量
- 测量结果与计量标准复现量值之差 = 恒定系统误差估计值
#### 可变系统误差的发现
- 改变测量条件（时间、温度、频率等）
- 测量结果按某确定规律（线性/非线性）变化时即存在
### 减小或消除系统误差的方法 ★★★
#### 1. 修正值法（系统误差估计值已知时）
- 修正值 = -系统误差估计值
- 修正后测量结果 = 未修正测量结果 + 修正值
- 案例：30 ℃，已知误差-0.1 ℃，修正后=30.1 ℃
#### 2. 消因法
- 消除引起系统误差的因素
- 仪器先校准、采用数字仪表消除人为读数误差等
#### 3. 抵消法（中和法）：恒定系统误差消除
##### ① 异号法（补偿测量法）
- 改变方向、极性等条件，使两次系统误差大小相等、符号相反
- 公式：a=(d+d')/2
- 例：螺杆式读数装置正反方向对线
##### ② 交换法
- 被测物位置相互交换，使误差源对结果作用相反
- 例：天平不等臂时，X = √(P·P')
##### ③ 替代法
- 用已知量值标准件替代被测件
- 例：曹冲称象、高频替代法校准微波衰减器
#### 4. 抵消法（中和法）：可变系统误差消除
##### ① 对称测量法（应对线性系统误差）
- 顺序测量4次，使t₂-t₁=t₄-t₃，线性漂移满足时ε₂-ε₁=ε₄-ε₃
- V_x - V_s = (x+x')/2 - (a+a')/2
##### ② 半周期偶数测量法（应对周期性系统误差）
- 周期性误差表示为：a·sin(2πl/T)
- 相隔T/2的两测量值平均消除系统误差
- 广泛用于测角仪
### 修正系统误差的方法 ★★★
#### 加修正值（系统误差为常数时）
- C = -Δ
- 已修正测得值 X_c = x + C
- 仪器示值修正：Δ=x-x_s，C=-Δ
#### 乘修正因子
- C_r = x_s / x（标准值/未修正测得值）
- X_c = C_r · x
#### 修正曲线
- 测得值修正值随影响量（温度、频率、时间等）变化
- 用最小二乘法将数据点拟合成最佳曲线
#### 修正值表
- 多个影响量时使用
- 函数关系不清楚时使用
#### 注意事项
- 修正值/修正因子常通过校准获得
- 修正值和修正因子都有不确定度
- 已修正测得值的不确定度应包含修正不完善引入的分量

## 二、实验标准偏差与重复性、复现性 ★★★
### 实验标准偏差 s
- 定义：表征测量值分散性的量
- 单次测量与平均值关系：s(x̄) = s(x)/√n
### 估计方法 ★★★
#### 贝塞尔公式法（测量次数较多时）
- s(x) = √[Σ(xᵢ-x̄)²/(n-1)]
- 自由度 ν = n-1
- 适用于各种分布类型，GUM中采用
#### 极差法（测量次数较少时）
- s(x) = (x_max - x_min) / Cₙ
- Cₙ极差系数表（n=2~20，Cₙ=1.13~3.74）
- 优点：计算量小；缺点：数据利用率低
#### 较差法（特殊场合）
- 用相邻测量值差计算：s(x)=√[Σ(xᵢ₊₁-xᵢ)²/(2(n-1))]
- 适用于频率稳定度测量、天文观测
### 算术平均值
- x̄ = (1/n)Σxᵢ
- 是被测量数学期望的最佳估计值
- s(x̄) 用作A类评定的重复性引入的标准不确定度
- 测量次数 n 一般取 3~20
### 测量重复性 ★★★
- 定义：在重复性测量条件下，对同一被测量连续多次测量结果的一致性
- 重复性条件：相同程序、相同观测者、相同条件、相同计量标准、相同地点、短时间
- 量化：实验标准偏差 sᵣ(y)
- 评定时通常 n=10
- 检定/校准结果重复性评定见 JJF 1033
### 测量复现性
- 定义：在不同地点、不同操作者、不同测量系统对同一被测对象重复测量结果的一致性
- 改变条件：测量地点、操作者、测量系统、原理、方法
- 量化：实验标准偏差 sᵣ(y)

## 三、异常值的判别与剔除 ★★★
### 异常值与离群值
- 异常值：因测量条件、仪器、操作异常得到的不正常结果
- 偶然误差/粗大误差：不属于测量误差范畴
- 离群值：与其他值偏离较远且不符合统计规律的个别值
### 三大判别准则 ★★★
#### 拉依达准则（3σ准则）
- 条件：n≥10
- 判据：|x_d - x̄| ≥ 3s 时判为异常值
- 缺点：n>10才适用，GB/T 4883-2008 已不采用
#### 格拉布斯准则
- 适用：n≥3
- 判据：|x_d-x̄|/s > G(α,n) 时判为异常值
- α=0.05 时为异常值；α=0.01 时为统计离群值
- 数据利用率高，计算量较大
- 案例：n=6 时 G(0.05,6)=1.822
#### 狄克逊准则
##### 适用：n≥3，分四个区间使用不同γ统计量
- 3≤n≤7：γ₁₀ = (xₙ-xₙ₋₁)/(xₙ-x₁)
- 8≤n≤10：γ₁₁ = (xₙ-xₙ₋₁)/(xₙ-x₂)
- 11≤n≤13：γ₂₁ = (xₙ-xₙ₋₂)/(xₙ-x₂)
- n≥14：γ₂₂ = (xₙ-xₙ₋₂)/(xₙ-x₃)
- 比较 γᵢⱼ 或 γ'ᵢⱼ 与临界值 D(α,n)
- 不需计算样本平均值和标准偏差，多轮判别更便捷
### 异常值处理原则 ★★
- 不得无原则剔除，避免数据失真
- 当时已知原因明显错误可随时剔除
- 仅怀疑某个值时必须用统计判别法
- 异常值判定后剔除，需重新计算并继续判别（每次只能剔除1个）
- 多种准则同时使用时：结论一致放心，矛盾时取α=0.01；模棱两可以"不是异常值"处理

## 四、最大允许误差的表示形式 ★★★
### 基本概念
- 最大允许误差（MPE）：规程/规范规定的示值误差极限值
- 又称误差限，是技术指标
- 有上下限，通常对称限，需加 "±" 号
### 五种表示形式
#### 绝对误差形式
- 例：标称1Ω标准电阻 ±0.01Ω → 阻值范围0.99~1.01Ω
#### 相对误差形式
- 绝对误差与相应值之比，百分数表示
- 例：电压表±1% → 1V时±0.01V，10V时±0.1V
- 利于全测量范围统一指标
#### 引用误差形式
- 绝对误差 / 引用值（量程或满刻度上限）
- 例：（0~150）V电压表±2% → 任意示值允许误差均为±3V
- 越接近上限，相对误差越小
#### 组合形式
- 相对+绝对：±(τ×10%+0.025μs)
- 引用+相对：±(1×10⁻⁶×量程+2×10⁻⁶×读数)
- 格式要求："±"在括号外，加号连接
### 易错点 ★★
- 测量范围应写成"0.1 V～100 V"或"(0.1～100) V"，不可写"0.1～100 V"
- "准确度"是定性术语，不能用于定量描述
- 应描述为"用相对误差表示的最大允许误差为±0.001%"
- "±"号必须保留

## 五、计量器具示值误差的评定 ★★★
### 基本概念
- 示值误差 = 示值 - 标准值（约定值）
- 评定方法：比较法、分部法、组合法
### 三种误差形式
#### 绝对误差
- Δ = x - x_s
- 有符号有单位，正负反映示值大小关系
- 修正值 C = -Δ
#### 相对误差
- δ = (Δ/x_s) × 100%
- 一般无单位（量纲为1）
- 用百分数表示
#### 引用误差
- δ_f = (Δ/x_N) × 100%
- x_N 为引用值（量程上限/满刻度）
- 用于电流表等准确度等级表示
### 案例计算要点
- 100Ω标准电阻校准值100.02Ω → Δ=-0.02Ω
- 0.5级100A电流表，50A时绝对误差±0.5A，相对误差±1%
- 修正值符号与误差估计值相反

## 六、检定时的符合性评定（合格判据） ★★★
### 基本要求
- 依据：JJF 1094-2002《测量仪器特性评定》
- 关键比值：U₉₅/MPEV 与 1/3 的关系
### U₉₅ ≤ 1/3 MPEV（满足要求） ★★★
- 不确定度影响可忽略
- 合格判据：|Δ| ≤ MPEV
- 不合格判据：|Δ| > MPEV
- 型式评价/仲裁鉴定可取 ≤ 1/5
### U₉₅ > 1/3 MPEV（必须考虑不确定度影响） ★★★
#### 合格判据
- |Δ| ≤ MPEV - U₉₅
#### 不合格判据
- |Δ| ≥ MPEV + U₉₅
#### 待定区
- MPEV - U₉₅ < |Δ| < MPEV + U₉₅
- 不能下合格或不合格的结论
### 符合性评定步骤 ★★
- 计算 U₉₅、MPEV，及其比值
- 根据比值选择判据
- 比较 |Δ| 与 MPEV/MPEV±U₉₅
- 给出结论
### 典型案例
- 数字电压表 10V 点：U₉₅=0.25mV，MPEV=0.85mV，满足1/3，|Δ|=0.7mV<0.85mV → 合格
- 高频电压表 ±2.0%：U₉₅=0.9%，不满足1/3，|Δ|=0.008V，MPEV-U₉₅=0.011V → 合格
- 不对称或单侧允许误差限同样适用上述原则

## 七、测量不确定度评定（GUM法） ★★★
### 标准不确定度A类评定 ★★★
#### 基本流程
- 重复观测得数据列 x₁,x₂,...,xₙ
- 计算最佳估计值 x̄ = (1/n)Σxᵢ
- 计算实验标准偏差 s(x)
- 计算 u_A(x̄) = s(x)/√n
- 自由度 ν = n-1
#### 测量过程标准不确定度A类评定（合并样本标准偏差）
- 通过核查或常规测量获 m 组数据
- 自由度相同时：sₚ = √(Σsⱼ²/m)
- 不同时：sₚ = √[Σ(xᵢⱼ-x̄ⱼ)²/(m(n-1))]
- A类评定：u(y) = sₚ/√n'，n'为获得平均值时的测量次数
- 自由度 ν = (n-1)·m
#### 规范化常规测量A类评定
- 累积大量同类被测件的测量数据
- 使自由度充分大
- 用合并样本标准偏差评定
### 标准不确定度B类评定 ★★★
#### 信息来源
- 以前的观测数据
- 技术资料和测量仪器特性
- 制造厂技术说明书
- 校准证书、检定证书、测试报告
- 手册参考数据
- 检定规程/校准规范规定的数据
- 其他有用信息
#### 区间半宽度 a 的确定 ★★★
- 仪器最大允许误差±Δ → a=Δ
- 校准证书扩展不确定度 U → a=U
- 手册误差±Δ → a=Δ
- 最大最小可能值 a⁺、a⁻ → a=(a⁺-a⁻)/2
- 数字显示分辨力 δx → a=δx/2
#### 概率分布假设 ★★★
- **正态分布**：受多个独立随机影响、证书给出U₉₀/U₉₅/U₉₉
- **三角分布**：中心可能性最大；两个独立量值之和或差
- **反正弦分布**：上下限可能性最大
- **均匀分布**：缺乏了解时；最大允许误差、分辨力、数据修约、度盘回差
- **两点分布**：量块按级使用
- **梯形分布**：上底/下底比为β
#### k 值表 ★★★
- 正态分布：p=0.5时k=0.676；p=0.9时k=1.64；p=0.95时k=1.96；p=0.99时k=2.58；p=0.9973时k=3
- 均匀分布：k=√3
- 三角分布：k=√6
- 反正弦分布：k=√2
- 两点分布：k=1
- 梯形分布：k=√(6/(1+β²))
#### B类标准不确定度计算
- u_B = a/k
- 案例：U=24μg(k=3) → u=8μg
- 案例：U₉₉=90μΩ → k=2.58，u=35μΩ
- 案例：±0.40×10⁻⁶ ℃⁻¹（均匀分布）→ u=0.23×10⁻⁶ ℃⁻¹
#### B类自由度
- 由 Δu(xᵢ)/u(xᵢ) 的估计值确定
- 表：相对值 0/0.10/0.20/0.25/0.30/0.40/0.50 → ν=∞/50/12/8/6/3/2
### 合成标准不确定度 u_c ★★★
#### 测量不确定度传播律（一般公式）
- u²_c(y) = Σ(∂f/∂xᵢ)²·u²(xᵢ) + 2ΣΣ(∂f/∂xᵢ)(∂f/∂xⱼ)·r(xᵢ,xⱼ)·u(xᵢ)·u(xⱼ)
- 灵敏系数 cᵢ = ∂f/∂xᵢ
- 相关系数 r(xᵢ,xⱼ)
#### 输入量不相关时（r=0）★★★
- u_c(y) = √[Σ(∂f/∂xᵢ)²·u²(xᵢ)]
#### 线性组合 Y = A₁X₁+A₂X₂+...+AₙXₙ
- u_c(y) = √[Σ Aᵢ²·u²(xᵢ)]
#### 乘除形式 Y = A·X₁^p₁·X₂^p₂·...·Xₙ^pₙ ★★★
- 相对合成标准不确定度：
- u_crel(y) = √[Σ pᵢ²·u²rel(xᵢ)]
- 仅当函数为相乘关系时才能直接用相对不确定度合成
#### 强相关时（r=+1）
- u_c(y) = Σ|cᵢ|·u(xᵢ)（代数和，不再是方和根）
#### 重要案例 ★★
- m=m₁+m₂ 不能用相对不确定度合成（不是乘积形式）
- 当分辨力效应已包含在 s(qₖ) 中，不应再加入 u(q) 重复计算
- 当 s(qₖ) ≤ u(q) 时取较大者，不能同时纳入
### 合成标准不确定度的有效自由度 ★★★
- ν_eff = u⁴_c(y) / Σ[u⁴ᵢ(y)/νᵢ]
- 乘除形式可用相对形式：
- ν_eff = (u_c/y)⁴ / Σ[(pᵢu(xᵢ)/xᵢ)⁴/νᵢ]
- 又称 Welch-Satterthwaite 公式
### 扩展不确定度 ★★★
#### U = k·u_c
- k一般取2（p≈95%）或3（p≈99%）
- 大多情况取k=2
- 当取其他值需说明来源
- 测量结果表示为 Y = y±U
#### U_p = k_p·u_c
- k_p = t_p(ν_eff)，由t分布表查得
- 应注明 ν_eff 或直接给出 k_p
#### t分布k_p计算
- 例：u_c=0.01mm，ν_eff=9，p=95% → t(0.95,9)=2.26 → U₉₅=0.023mm
#### 重要原则
- 单独表示U时不加"±"号
- 合成标准不确定度无需说明k或p
- 给U时一般应注明k；未注明k时默认指k=2
- 给U_p时应给ν_eff或k_p
### 不确定度符号 ★★
- u：标准不确定度
- uᵢ：分量
- u_r/u_rel：相对标准不确定度
- u_c：合成标准不确定度
- U：扩展不确定度
- U_p：规定包含概率的扩展不确定度
- k/k_p：包含因子
- p：包含概率
- ν/ν_eff：自由度/有效自由度

## 八、测量不确定度的有效位数及数字修约 ★★★
### 有效数字
- 从左端第1个非零数字起至最末一位的全部数字
- 修约误差限的绝对值不超过末位单位量值的一半
- 例：3.8600为五位、0.0038为二位、1002为四位
### 不确定度位数 ★★★
- 报告时U或u_c只能是1~2位有效数字
- 计算过程中可适当多保留几位
- 取一位还是两位取决于修约误差占U的比例
- 第1位有效数字是1或2时，建议保留2位
- 测量要求高时一般取2位
### 数值修约规则 ★★★
#### 通用规则（四舍六入逢五取偶）
- 末位后大于0.5：进一
- 末位后小于0.5：舍弃
- 末位后恰为0.5且后有非0数字：进一
- 末位后恰为0.5且后无数字或皆为0：奇进偶舍
- 例：u_c=0.568 → 0.57；u_c=0.561 → 0.56
- 例：U=10.5 → 10；U=10.5001 → 11
#### 不可连续修约
- 7.691499 修到4位 → 7.691（不可7.691499→7.6915→7.692）
#### 进位保险原则
- 也可将不确定度末位后数字全部进位
- 例：u_c=10.27 → 11mΩ
- 检定员取保险原则也是允许的
### 测量结果最佳估计值的有效位数 ★★★
- 应修约到与不确定度的末位对齐
- 例：y=6.3250g, u_c=0.25g → y=6.32g
- 例：y=1039.56mV, U=10mV → y=1040mV
- 例：U=10.015μs(取2位)=10μs, y=1500.05μs → y=1500μs
- 测量结果 = 1500μs ± 10μs

## 九、测量结果的表示和报告 ★★★
### 完整测量结果包含
- 被测量的最佳估计值（多次测量平均值或函数式计算值）
- 测量不确定度（分散性或包含区间半宽度）
- 例：Y = y ± U(k=2)
### 用合成标准不确定度报告 ★
#### 适用情况
- 基础计量学研究
- 基本物理常量测量
- 复现国际单位制单位的国际比对
#### 报告形式
- m_s = 100.02147g；u_c(m_s)=0.35mg
- m_s = 100.02147(35)g（括号内末位与结果末位对齐）
- m_s = 100.02147(0.00035)g（同单位）
### 用扩展不确定度报告 ★★★
#### 一般情况下使用
- 给出 U 时要给 k 值
- 给出 U_p 时要给 p 值
#### U 的报告（k=2）
- m_s = 100.02147g；U=0.70mg, k=2
- m_s = (100.02147±0.00070)g, k=2
#### U_p 的报告
- m_s = 100.02147g；U₉₅=0.79mg, ν_eff=9
- m_s = (100.02147±0.00079)g, ν_eff=9
- m_s = 100.02147(79)g, ν_eff=9
- m_s = 100.02147(0.00079)g, ν_eff=9
#### 相对扩展不确定度
- U_rel = U/|y|
- m_s = 100.02147g；U_rel=0.70×10⁻⁶, k=2
- m_s = 100.02147(1±0.79×10⁻⁶)g, p=95%, ν_eff=9
### 注意事项 ★★
- 单独表示不确定度时不加"±"号
- 合成标准不确定度时不必说明k或p
- 扩展不确定度k=2或3时不必说明p
- MCM法评定时表示为 [y_low, y_high]
- 元素相对原子质量例：A_r(K)=39.0983(1)→u=0.0001（应说明）

## 十、检定、校准、检测的概念 ★★★
### 检定 ★★★
#### 定义
- 查明和确认测量仪器符合法定要求的活动
- 包括检查、加标记和/或出具检定证书
#### 特点
- 对象：计量器具（测量仪器）
- 目的：确保量值统一和准确可靠
- 结论：合格与否
- 性质：法制性，法定证书有特定法律效力
#### 内容
- 计量性能要求验证（准确度等级、最大允许误差、不确定度、影响量、稳定性）
- 通用技术要求验证（外观、防欺骗、安全性、标记）
- 给出检定结论
- 出具检定证书或检定结果通知书
### 校准 ★★
#### 定义（两步操作）
- 第一步：确定标准值与示值之间的关系（示值误差）
- 第二步：用第一步信息确定如何获得准确测量结果（修正值/修正因子/修正曲线及不确定度）
#### 校准结果形式
- 文字说明、校准函数、校准图、校准曲线、校准表格
- 校准图：示值轴和测量结果轴定义的平面上的一条带
#### 注意
- 不应与"自校准"（实际是调整）混淆
- 不应与校准的验证混淆
### 检测 ★★
- 对给定产品，按规定程序确定特性、处理或服务的技术操作
#### 主要类型
- 计量器具新产品/进口计量器具的型式评价
- 定量包装商品净含量、商品包装、零售商品称重计量检验
- 用能产品能源效率标识计量检测

## 十一、检定的分类与实施 ★★★
### 适用范围
- 《依法管理的计量器具目录》中的计量器具
### 实施工作原则
- 经济合理（充分利用现有设施，合理部署网点）
- 就地就近（不受行政区划和部门管辖限制）
### 按管理环节分类
#### 首次检定
- 对未曾检定过的计量器具进行的检定
- 对象：新生产或新购置从未检定过的
- 所有依法管理计量器具投入使用前都要进行
#### 后续检定
- 首次检定后的任何检定
##### 周期检定
- 按规程规定的周期和程序定期进行
- 防止使用磨损偏离法定要求
##### 修理后检定
- 不合格修理后交付使用前
##### 周期检定有效期内的检定
- 顾客提出要求时
- 封印失效时
- 用户认为有必要时
### 按管理性质分类
#### 强制检定 ★★
- 由人民政府计量行政部门指定法定计量检定机构或授权机构实施
- 定点定期
##### 对象
- 社会公用计量标准器具
- 部门和企事业单位最高计量标准器具
- 列入《实施强制管理目录》且监管方式为强制检定，且在贸易结算、安全防护、医疗卫生、环境监测中使用的工作计量器具
- 未按规定申请检定或不合格继续使用属违法行为
- 申请：申报、登记造册、按周期检定计划送检
#### 非强制检定
- 其他计量器具的检定
- 由使用者依法自己组织实施
- 检定周期可自主确定
#### 仲裁检定 ★★
- 用计量基准或社会公用计量标准进行的裁决性检定
- 处理因计量器具准确度引起的纠纷
- 必须使用国家基准或社会公用计量标准
- 双方当事人在场
- 二次仲裁为终局
- 检定人员可能影响公正应回避
- 必要时校准能力 ≤ MPEV/5
### 部分计量器具特殊规定
- 竹木直尺、玻璃体温计、液体量提：只首次检定，失准报废
- 家庭生活用煤气表/水表/电能表：只首次检定，到期轮换

## 十二、检定/校准/检测依据的文件 ★★★
### 顾客需求识别
- 检定（强制/非强制/仲裁，首次/后续）
- 校准（参数、范围、MPE/U要求、方法）
- 检测（型式评价/净含量/能效）
- 政府指令需弄清时限要求
### 方法依据 ★★★
- 检定：国家计量检定规程，无则部门或地方规程
- 校准：首选国家计量校准规范，可用其他公开发布、设备制造商指定、自编（确认后）、检定规程相关部分
- 型式评价：统一型式评价大纲；无则机构拟定经审批
- 净含量检验：JJF 1070系列
- 食品化妆品包装：JJF 1244-2010
- 能效标识：JJF 1261系列
### 方法确认 ★★★
- 非标准方法必须经确认才可使用
- 标准方法超出范围或扩充修改的也需确认
#### 确认方法
- 参考标准/标准物质校准评估偏移和精密度
- 系统性评审影响因素
- 改变受控参数检验稳健度
- 与其他已确认方法比对
- 实验室间比对
- 评定测量不确定度
- 由相关领域专家技术评价
### 方法文件版本控制
- 必须使用现行有效版本
- 作废、被替代、未确认的非标准/自编文件不得使用
- 应有专门部门或专职人员受控管理
- 现行有效文件有受控标识
- 通过总局公告、网站、期刊及时了解修订情况
### 作业指导书
- 一般需要编写（除非规程足够具体）
- 包含本单位实际情况、设备、注意事项、操作步骤、经验做法
- 须经审核、批准、加受控文件标识

## 十三、人员资质要求 ★★
### 基本要求
- 每个项目至少2名具有相应能力的人员
- 满足计量法律、法规要求
### 法定计量检定机构和授权机构
- 注册计量师资格证 + 注册证（具相应项目）
- 或原计量检定员证（具相应项目）
- 或"计量专业项目考核合格证明"（过渡期）
### 其他企事业单位
- 不要求注册计量师证
- 应经计量专业理论和实际操作培训或考核合格
- 能力证明：培训合格证明等
### 校准/检验/检测人员
- 也需经培训和考核获相应资质证明
### 任命授权
- 明确规定操作员、核验员、主管资格和职责
- 明确任命或授权
### 监督人员
- 熟悉本专业方法、程序、目的
- 能正确进行结果评价
- 一般不脱产
- 及时发现纠正操作疏忽和错误

## 十四、计量标准的选择和仪器设备配备 ★★
### 计量标准选择原则
- 检定规程/校准规范明确规定的应按规定执行
- 依据其他文件时，按检定系统表上一级
- 法定机构应使用经计量标准考核取得证书的计量标准
### 仪器设备配置要求
- 检定按检定规程要求
- 校准按校准规范要求
- 型式评价按大纲要求
- 净含量检验按检验规则
- 能效检测按检测规则
#### 必须满足
- 准确度要求和功能要求
- 在有效期内的检定/校准证书
- 贴有检定/校准状态标识

## 十五、环境条件控制 ★★
- 各种文件中分别规定环境条件要求
- 配备温度计、湿度计、气压表等监视设备
- 被监视场所要进行环境参数记录
- 互相冲突的实验条件需有效隔离
- 例：天平要求无振动，与振动测量仪器分隔

## 十六、原始记录管理 ★★★
### 重要性
- 检定/校准/检测结果和证书报告来源
- 法律责任来源
### 真实性要求
- 必须当时记录，不能事后追记或补记
- 不能用重抄记录代替
- 不得虚构记录、伪造数据
### 信息量要求
- 必须包含足够信息
- 可在尽可能与原来接近的条件下复现实验结果
### 具体要求 ★★★
#### 记录格式
- 不应用白纸或通用格式纸
- 为每种计量器具/仪器单独设计
#### 记录识别
- 应有记录格式文件编号
#### 记录信息
- 必须完整：标准值、被测仪器示值、计算过程
- 不能只记结果数据
#### 书写要求
- 用墨水笔填写，不得用铅笔
- 按法定计量单位使用方法
- 不得擦除/刮去，错误用横杠划掉，旁注正确内容
- 改动者签名或签名缩写
- 计算机存储记录修改也不能让错误数据消失
#### 人员签名
- 执行人员和核验人员亲笔签名
- 抽样人员签名
- 计算机直接输入可用电子签名
#### 保存管理
- 规定保存期，由各单位管理制度规定
- 超过保存期按管理规定办理后销毁

## 十七、数据处理和结果评定 ★★★
### 数据处理
- 遵循规程/规范/大纲/规则的要求
- 数值计算、换算、修约
### 检定结果评定
- 全部符合要求 → "合格"
- 给出准确度等级（×等或×级）
- 不合格出具检定结果通知书
- 依据 JJF 1094-2002
### 校准结果评定
- 给出修正值/校准值及不确定度信息
- 一般不给符合性判断
- 顾客要求时指明符合/不符合哪些条款
- 计量标准器溯源校准可做出符合某级别的结论
### 型式评价结果评定
- 全部项目符合大纲 → 合格 → 建议批准
- 有不符合 → 不合格 → 建议不批准
### 净含量/包装检验结果评定
- 依据 JJF 1070 系列、JJF 1244 中评定准则
- 净含量标注 + 净含量分别评定
### 能效标识检测结果评定
- 依据 JJF 1261 系列合格判据
### 核验 ★★★
#### 核验性质
- 未参与操作的人员对实验过程进行审核
- 核验人员资格不低于操作人员
- 对项目程序熟悉程度不差于操作人员
- 是保证结果准确可靠的重要措施
#### 核验内容
- 被测对象信息完整准确性
- 规程/规范是否正确、是否现行有效版本
- 计量标准器具配套设备是否符合规程、是否检定/校准在有效期内
- 项目是否都已完成
- 数据计算/换算/修约验算
- 检定规程要求复读的负责复读
- 结论是否正确
- 记录修改是否规范、是否有签名
- 证书报告与原始记录一致性
- 证书信息量不超过原始记录信息

## 十八、异常情况处置 ★★★
### 应急处置（一般故障）
- 立即停止实验
- 保护好仪器设备和被测对象
- 通知维修人员排除故障
- 如实记录情况
- 数据有效性分析：影响小可继续；否则重做
### 设备/环境恢复确认
- 供电供水恢复后检查所有设备
- 环境条件检查
- 都符合要求方可继续工作
### 重大事故应急处置
- 漏水、火灾、有毒泄漏、人身安全事故
- 操作人员冷静，立即采取应急措施
- 必要时切断电源
- 保护人员和设备安全
- 按管理规定及时报告，不得隐瞒
- 在负责人组织下处理事故
- 分析原因采取纠正措施
### 问题设备隔离
- 立即停用，贴停用标志
- 有条件应撤离防止误用
### 问题结果追溯 ★★★
- 检查故障前所做工作
- 检查是否影响以前的结果
- 包括已发出的证书报告
- 逐个分析判断
- 有疑问的坚决追回重新检定/校准
- 故障设备修复后检定/校准恢复使用或报废

## 十九、计量标准器和配套设备管理 ★★
### 仪器设备购置
- 按规程规范要求提出采购申请
- 列入"型式批准"目录的设备应经型式批准
- 标准物质应是有证标准物质
### 验收
- 经办人员和专业人员共同验收
- 检查物品是否符合订货合同
- 详细记录验收情况
- 参加验收人员签字确认
- 不符合及时联系供应商
### 标识和建档
- 所有用于检定校准检测的仪器设备建档
- 给唯一性标识
### 检定/校准状态标识
- 专人或部门制订计划，按规定时间通知保管人
- 完成后归档证书
- 新修正值及时替换旧修正值
- 计算机软件中存储的修正值需更新
- 贴反映检定校准状态的标识
### 正确使用和维护
- 按规定资质和操作程序使用
- 专人保管
- 制定维护保养计划
- 做好使用记录和维护保养记录
### 期间核查
- 在相邻两次检定/校准之间进行
- 对象：计量标准、标准物质、其他测量仪器
### 修理改装报废
- 涉及计量性能的维修必须重新检定/校准
- 改装需可行性分析、技术负责人审核、批准后执行
- 改装后必须重新检定/校准
- 计量标准器改装按 JJF 1033-2016 履行手续
- 报废需办理手续，移出实验室及时处理

## 二十、证书报告管理 ★★★
### 证书报告分类
#### 检定证书
- 结论"合格"出具
- 封面：有效时间、双方信息、被检计量器具信息、签名、结论、日期
- 内页：检验条件、设备、原始记录
- 调修后应注明，给出调修前后结果
- 内容结束有终结标志
#### 检定结果通知书
- 结论"不合格"出具
- 结论"不合格"或"见检定结果"
- 只给检定日期，不给有效期
- 检定结果中指出不合格项
#### 校准证书（或校准报告）
- 信息：编号、单位地址、被校器具信息、依据文件、计量标准信息
- 调修后应注明，给出前后结果
- 校准间隔：计量标准器溯源校准应给；一般不给建议；顾客要求可给
- 一般不给符合性判断；顾客要求时指明哪些条款符合
- 内容结束有终结标志
#### 检测报告
- 型式评价报告（依据JJF 1015-2014附录A）
- 计量检验报告（JJF 1070系列、JJF 1244附录格式）
- 能效检测报告（依据JJF 1261）
### 证书审核和批准
- 由授权签字人实施
- 是最终质量把关
- 授权签字人：高水平、责任心强、对本专业负责
- 只能审核熟悉专业授权范围内的证书
### 证书报告修改和变更 ★★★
#### 追加文件方式
- 原证书内容正确但不完整
- 不收回原证书
- 注明"对序号为...的检定证书的补充"
- 应符合证书要求，加签名加公章
#### 重新出具方式
- 原证书有不正确内容
- 必须重新编号，不可使用原编号
- 必须声明代替关系
- 收回作废的原件
- 保存在有关部门作为重要记录
### 质量控制方法 ★
- 使用标准物质或质量控制物质
- 使用其他已校准能提供可溯源结果的仪器
- 测量和检测设备的功能核查
- 使用核查或工作标准制作控制图
- 测量设备的期间核查
- 使用相同或不同方法重复检定/校准/检测
- 留存样品的重复检定/校准/检测
- 物品不同特性结果之间的相关性
- 报告的审查
- 实验室内比对
- 盲样测试
### 副本保存
- 必须保留副本备查
- 副本必须与发出原件完全一致
- 妥善保管便于检索
- 规定保存期，到期批准后销毁
- 可以是复印件或软件载体
- 计算机中副本应只读

## 二十一、计量检定印、证 ★
### 种类和使用
- 检定证书：证明计量器具经检定获满意结果

- 伪造、盗用、倒卖强制检定印证 → 违法，追究法律责任
- 由计量基准/社会公用计量标准检定的印证有法律效力
- 可作为调解、仲裁、审理、判决的法律依据

## 二十二、计量标准命名与分类编码 ★
### 依据
- JJF 1022-2014《计量标准命名与分类编码》
### 基本类型
- 标准装置
- 检定装置
- 校准装置
- 工作基准装置
### 命名原则

- 在"计量标准器"或"参量"名称后加"工作基准装置"
- 例：电容工作基准装置

## 二十三、计量标准的考核 ★★★
### 考核要求六大方面
- 计量标准器及配套设备
- 计量标准的主要计量特性
- 环境条件及设施
- 人员
- 文件集
- 计量标准测量能力的确认
### 计量标准器及配套设备 ★★★
#### 配置原则
- 按检定规程或技术规范要求
- 科学合理、完整齐全配置（包括计算机及软件）
#### 计量特性
- 符合相应规程或技术规范
- 满足开展工作需要
### 计量标准溯源性 ★★★
#### 基本要求
- 定期溯源至计量基准或社会公用计量标准
- 主要配套设备需有连续有效证书
- 检定周期不超过规程规定
- 校准复校间隔执行规范规定或校准机构给出
#### 检定溯源
- 凡是有计量检定规程的标准器和主要配套设备应当以检定方式溯源
- 不能以校准方式溯源
#### 校准溯源
- 没有检定规程的依据国家计量校准规范校准
- 如无校准规范可依据有效的校准方法
#### 比对方式
- 当不能以检定或校准方式溯源时才采用
#### 标准物质
- 使用处于有效期内的有证标准物质
#### 国际溯源
- 国家计量基准和社会公用计量标准不能满足时
- 经市场监管总局同意后溯源到国际计量组织或其他国家
### 主要计量特性 ★★
- 测量范围
- 不确定度/准确度等级/最大允许误差
- 稳定性：新建至少半年；已建每年至少一次
- 其他：灵敏度、鉴别阈、分辨力、漂移、死区、响应特性等
### 文件集 ★
- 计量检定规程或技术规范
- 计量标准技术报告（新建撰写；重大变化重新修订）
- 检定或校准的原始记录
- 检定或校准证书
- 管理制度
### 测量能力的确认
- 通过技术资料审查（稳定性考核、重复性试验、不确定度评定、计量比对）
- 通过现场试验确认
### 检定/校准结果重复性 ★★★
- 贝塞尔公式或合并样本标准差计算
- 新建：直接作为不确定度来源
- 已建：不大于新建时 → 符合；大于 → 重新评定不确定度
### 计量标准稳定性 ★★★
#### 考核方法
- 采用核查标准（新建：m≥4组，时间间隔>1个月；已建：每年至少一次）
- 采用高等级计量标准
- 采用控制图法
- 采用规程规范规定方法
- 采用计量标准器溯源数据
#### 判定方法
- 使用标称值或示值：稳定性 < 最大允许误差绝对值
- 加修正值使用：稳定性 < 修正值的扩展不确定度（U,k=2 或 U₉₅）
- 规程有规定时按规定判断
#### 案例提示
- 用被校测量仪器考核计量标准稳定性是不严格的
- 因为被校仪器准确度低于计量标准
### 不确定度评定要求
- 多种被测对象：分别评定
- 多种参数：分别评定
- 不同测量点不确定度不同：原则上每点都给出
### 检定/校准结果验证 ★★★
#### 传递比较法（优先）
- 用更高一级计量标准
- 公式：|y_lab - y_ref| ≤ √(U²_lab + U²_ref)
- 当 U_ref ≤ U_lab/3 时简化为：|y_lab - y_ref| ≤ U_lab
#### 比对法（不可能用传递比较法时）
- 公式：|y_lab - ȳ| ≤ √((n-1)/n) · U_lab
### 量值溯源和传递框图 ★★★
- 三级：上一级、本级、下一级计量器具
- 三要素：名称、测量范围/不确定度/准确度等级/MPE、保存机构（本框图无此项）
- 三级之间应注明溯源和传递方法

## 二十四、计量标准考核的后续监管 ★★★
### 计量标准器/主要配套设备更换 ★★★
- 不确定度/准确度/MPE变化 → 按新建申请考核
- 测量范围/项目变化 → 申请复查考核
- 上述均无变更 → 填写《计量标准更换申报表》报审批
- 易耗品（含标准物质）更换 → 履历书记载
### 其他更换
- 计量检定规程或技术规范更换 → 履历书记载
- 实质性变化 → 申请复查考核
- 环境条件重大变化 → 报告，提供自查表，必要时重新溯源；主要计量特性重大变化暂停工作并申请复查
- 检定/校准人员更换 → 履历书记载
- 单位名称更换 → 报告并申请换发证书
### 封存和撤销
- 填《计量标准封存（或撤销）申报表》报审批
- 同意撤销的收回考核证书
### 恢复使用
- 有效期内 → 申请复查考核
- 超过有效期 → 按新建申请
### 技术监督
- 计量比对、盲样试验、现场实验等方式
- 合格的复查时可不安排现场考评
- 不合格限期整改并报告
- 无正当理由不参加或整改后仍不合格 → 注销证书

## 二十五、计量检定规程编写规则 ★★
### 编写原则
- 符合国家有关法律法规
- 适用范围明确
- 各项要求科学合理，可行经济
- 积极采用国际建议、国际文件、国际标准
### 结构（必备章节加下划线） ★★★
- 封面、扉页、目录、引言
- **范围**（必备）
- 引用文件
- 术语和计量单位
- **概述**（必备）
- **计量性能要求**（必备）
- **通用技术要求**（必备）
- **计量器具控制**（必备）
- 附录
### 主要内容
#### 编号
- JJG XXXX—XXXX（代号、顺序号、发布年号）
#### 计量性能要求
- 计量特性名称和对应计量要求
#### 通用技术要求
- 外观结构、防止欺骗、操作适应性和安全性、标记
- 检定规程独有
#### 计量器具控制
- 首次检定、后续检定、使用中检查
- 型式评价也属于计量器具控制范围
- 检定项目用"+"和"-"表示
- 检定方法优先采用国际文件、国家标准
#### 检定结果处理
- 合格/不合格结论
#### 检定周期
- 一般给出常规条件下的最长周期
- 原则：计量器具能保持规定计量性能的最长时间间隔
#### 附录
- 检定记录格式
- 检定证书内页格式
- 检定结果通知书内页格式
- 推荐的检定方法、程序图表、参考数据
### 正确执行检定规程
- 手段不满足 → 不能检定出证
- 实际需要部分检定 → 证书中注明
- 无规程 → 不能仲裁检定，可计量调解

## 二十六、计量校准规范编写规则 ★
### 编写原则
- 符合法律法规
- 适用范围明确
- 充分考虑技术和经济合理性
- 为采用最新技术留有空间
### 结构（必备章节加下划线） ★★★
- 封面、扉页、目录、引言
- **范围**（必备）
- 引用文件

## 二十七、比对、能力验证和测量审核 ★★★
### 比对的含义与作用 ★★
#### 比对
- 在规定条件下，对相同准确度等级或指定不确定度范围的同种测量仪器复现的量值之间比较的过程
- 两个或两个以上实验室，按预先规定条件，各自测量性能稳定的相同或类似传递标准器
- 通过分析测量结果的量值，确定实验室间量值的一致程度
- 不仅应用于校准、检定能力验证，也可扩展应用于检测、检验或测量能力验证
#### 能力验证
- 利用实验室间比对，按照预先制定的准则评价参加者的能力
- 在校准、检定的某个特定领域，对一轮或多轮次能力验证的设计和运作称为能力验证计划
#### 测量审核
- 一个参加者对被测样品进行实际测试，其测试结果与参考值进行比较的活动
- 是对一个参加者进行"一对一"能力评价的能力验证计划
- 审核实验室（能力验证提供者）对申请实验室的校准或检测等能力的验证活动
#### 比对的作用
- 考察各实验室测量量值的一致程度
- 考察实验室计量标准的可靠程度
- 检查各计量检定机构的检定准确度是否保持在规定范围内
- 考察各实验室人员技术水平和数据处理能力
- 国际互认的技术基础
### 比对的类型 ★★
#### 国际比对
- 国际计量局组织的关键比对：取得关键比对参考值
- 辅助比对：满足关键比对未涵盖的特定需求
- 双边比对：参加过关键/辅助比对的研究院与另一研究院开展
- 区域比对（亚太计量规划组织）：与国际关键比对对应
#### 国内比对
- 国家计量比对：经市场监管总局考核合格的计量基准或计量标准量值的比对
- 地方计量比对：经县级以上地方市场监管部门考核合格的计量标准量值的比对
- 其他形式比对：各计量实验室根据自身需要开展的非官方实验室间比对
### 主导实验室 ★★
#### 应具备的条件
- 在技术上具备优势，参加过相关量的国际比对或对比对有较深入了解
- 在比对涉及的领域内有稳定、可靠的计量基准或计量标准
- 具有与所承担比对主导实验室工作相适应的技术能力的人员
- 环境条件、材料供应满足要求
#### 承担的责任
- 预先估计比对有效性，设计比对方案并起草比对实施方案
- 确定稳定、可靠的传递标准及适当的传递方式
- 开展前期实验（传递标准的重复性、均匀性、稳定性、运输特性）
- 对传递标准采取必要的包装措施，保证传递过程的安全
- 澄清比对实施方案，协调解决比对过程中出现的问题
- 汇总参比实验室的实验数据及相关资料，编写比对总结报告
- 遵守有关比对的保密规定
### 参比实验室责任 ★★
- 收到比对计划时，应按要求及时书面表明是否参加比对
- 参与比对实施方案的讨论，正确理解方案内容
- 按比对实施方案的要求接收和交送传递标准，确保安全完整
- 按照比对实施方案的进度完成比对工作，按时上报数据
- 参与比对总结报告的讨论
- 遵守有关比对的保密规定
### 比对实施方案 ★★
- 概述（比对任务来源、目的、范围和性质）
- 总体描述（比对所针对的量及选定的量值）
- 实验室信息（主导实验室和参比实验室联系方式）
- 传递标准描述（尺寸、重量、制造商、技术数据）
- 传递路线及比对时间
- 传递标准的运输和使用
- 传递标准的交接
- 比对方法和程序
- 意外情况处理程序
- 记录格式
- 参比实验室报告要求
- 参考值及数据处理方法
- 保密规定
### 传递标准 ★★
- 应稳定可靠，必要时可采用主传递标准+副传递标准同时投入
- 路线形式：环式、星形式、花瓣式
- 稳定性高时可采用圆环式
- 稳定性易受环境运输影响时应选择花瓣式
- 主导实验室确定运输方式，保证传递过程安全
### 参考值确定 ★★
- 国家计量基准校准值作为参考值
- 主导实验室传递标准的校准值作为参考值
- 各参比实验室测量结果的算术平均值（不确定度接近时）
- 各参比实验室测量结果的加权平均值（不确定度有显著差异时）
- 主导实验室和部分参比实验室的加权算术平均值
### 比对结果评价 ★★★
#### En值（归一化偏差）
- 不参加参考值计算：En = (ylab-yref)/√(U²lab+U²ref)
- 参加参考值计算：En = (ylab-yref)/√(U²lab-U²ref)
- 覆盖因子k一般取2
#### 判定
- |En|≤1：比对结果可接受，在合理的预期范围内
- |En|>1：超出合理预期，应分析原因
### 数据管理 ★★
- 参比实验室对数据的任何修改均应以正式书面方式
- 主导实验室不得以任何理由提示参比实验室修改数据或报告
- 整个比对过程中主导实验室应注意数据保密，直至报告发出
- 数据处理应遵循比对实施方案，不得随意变更处理方法
### 测量审核的实施 ★★
#### 申请
- 由实验室根据自身能力验证需要向有资质的实验室提出申请
- 预先明确目的、范围、性质、针对的量及选定的量值范围
#### 样品要求
- 由审核实验室选定和提供
- 应稳定可靠，在测量审核活动周期内保持校准状态
- 应具有盲样特性
#### 参考值
- 通常采用审核实验室对样品的校准结果
- 测量不确定度相对于申请实验室要验证的能力水平应有明显优势
#### 结果判定
- 采用En值判定
- 还应考虑实验室获授权项目依据的标准中的相关要求

## 二十八、期间核查 ★★★
### 期间核查的定义 ★★
- 根据规定程序，为了确定计量标准、标准物质或其他测量仪器是否保持其原有状态而进行的操作
- 核查"示值误差""修正值"或"修正因子"是否与校准结果保持一致
- 不是重新校准或再校准
- 期间核查可以为制定合理的校准间隔提供依据或参考
### 期间核查与校准/检定的区别 ★★
- 目的不同：校准确定溯源性；核查确认校准状态是否继续可信
- 执行主体不同：校准由有资格的机构人员进行；核查由本实验室人员进行
- 核查不能代替校准或检定，核查不具有溯源性
- 核查是用简便方法对仪器是否保持校准状态进行的确认
- 核查中使用的最大允许误差可能与校准时使用的不同
### 核查对象 ★★
#### 工作标准
- 基准、参考标准、传递标准、工作标准均应纳入
- 考虑因素：是否具备核查条件、对测量结果的影响、是否不够稳定
- 使用频繁、经常携带到现场、使用条件恶劣的优先核查
#### 辅助设备及其他测量仪器
- 根据出现问题的可能性和严重性合理确定
- 辅助设备变化会在主设备的测量结果中表现出来
#### 实物量具和标准物质
- 性能稳定的实物量具（砝码、量块）通常不需单独进行期间核查
- 玻璃量具等性能稳定的计量器具一般可不作期间核查
### 核查标准选择 ★★
- 应具有需核查的参数和量值，能由被核查仪器测量
- 应具有良好的稳定性，必要时具有足够的分辨力和良好的重复性
- 必要时应可以提供指示，以便重复前次核查实验时的条件
- 不必考虑便携和搬运问题（本实验室自己进行）
- 不一定要求提供参考量值，主要用来观察测量结果的变化
### 核查时机 ★★★
#### 定期核查
- 应规定两次核查之间的最长时间间隔
- 测量仪器刚刚完成溯源时做首次核查（最佳时机）
- 以后进行的核查与首次核查的结果比较
- 2次校准或检定之间通常不止1次核查
#### 不定期核查
- 即将用于非常重要/高准确度的测量时
- 即将用于外出测量时
- 刚刚从外出测量回来时
- 环境温湿度或其他测量条件发生大变化，刚刚恢复时
- 发生碰撞、跌落、电压冲击等意外事件后
- 对测量仪器性能有怀疑时
### 核查方法 ★★★
#### 参考值已知时
- 被核查对象经校准后，定期利用核查标准对其进行核查
- 短时间内重复测量n次，得到算术平均值x̄
- 核查点误差 δ = x̄ - xs
#### 参考值未知时
- 从校准证书获取核查点的误差e或修正值c
- 校准返回后立即用被核查对象对核查标准重复测量n次得 x̄₀
- 核查标准参考值：xs = x̄₀ - e 或 xs = x̄₀ + c
- 第j次核查误差：δj = x̄j - xs = x̄j - x̄₀ + e
#### 控制图法
- 均值控制图：判断是否受不受控的系统效应影响
- 标准偏差/极差控制图：判断是否受不受控的随机效应影响
- 以最大允许误差或扩展不确定度确定控制限
### 符合性判据 ★★
- 若判据用最大允许误差表示：MPE = MPE方法
- 应考虑参考值xs的测量不确定度，对判据做加严处理
- 有些机构取 MPE = 0.8×MPE方法
### 核查结果处置 ★★
- 误差δ未超出MPE：核查通过
- 误差δ接近MPE：应加大核查频次或采取其他有效措施
- 误差δ超出MPE：立即停止使用，必要时进行再校准
- 影响已出具报告结果有效性时，应采取相应补救措施
### 期间核查文件 ★★
#### 程序文件
- 期间核查的职责分工及工作流程
- 需要实施期间核查的仪器确定的原则
- 核查方案的制定和评审程序
#### 作业指导书
- 被核查的测量仪器信息
- 核查内容：功能或计量特性
- 核查的位置或量值点
- 使用的核查标准信息
- 核查的实验条件
- 核查的步骤（操作流程、重复测量次数、数据处理方法）
- 核查的频次和时间安排
- 核查获得量值的最大允许误差
- 核查记录信息和保存要求
- 核查结果的判定原则与结论
- 核查结果异常的处理流程
- 关于需要增加临时核查的特殊情况的规定

// ===== Parse topics from markdown =====
function parseTopics(md) {
    const blocks = md.split(/(?=^## )/m).filter(b => b.trim());
    return blocks.map((block, i) => {
        const lines = block.split('\n');
        const titleLine = lines[0].replace(/^## /, '');
        const starsMatch = titleLine.match(/(★+)/);
        const stars = starsMatch ? starsMatch[1] : '';
        const title = titleLine.replace(/\s*★+$/, '').trim();
        const subtitles = [];
        lines.forEach(line => {
            const m = line.match(/^### (.+)/);
            if (m) subtitles.push(m[1]);
        });
        return { id: 'topic' + (i + 1), title, stars, subtitles, markdown: block };
    });
}

const topics = parseTopics(fullMarkdown);
let currentMm = null;

// ===== Render outline tree =====
function renderOutline() {
    const tree = ROOT.querySelector('#outlineTree');
    tree.innerHTML = topics.map((t, i) => {
        const subsHtml = t.subtitles.map((s, j) => {
            const sm = s.match(/(★+)/);
            const ss = sm ? '<span class="stars">' + sm[1] + '</span>' : '';
            const st = s.replace(/\s*★+$/, '').trim();
            return '<div class="subtopic-item" data-topic="' + i + '" data-sub="' + j + '" onclick="' + _NS + '.selectSubtopic(' + i + ',' + j + ')">' + st + ' ' + ss + '</div>';
        }).join('');
        const starsHtml = t.stars ? '<span class="stars">' + t.stars + '</span>' : '';
        return '<div class="topic-item" data-index="' + i + '">' +
            '<div class="topic-header" onclick="' + _NS + '.toggleTopic(' + i + ')">' +
            '<span class="arrow">&#9654;</span>' +
            '<span class="title-text">' + t.title + '</span>' +
            starsHtml + '</div>' +
            '<div class="subtopic-list">' + subsHtml + '</div></div>';
    }).join('');
}

// ===== Toggle expand/collapse =====
function toggleTopic(idx) {
    const item = ROOT.querySelectorAll('.topic-item')[idx];
    const arrow = item.querySelector('.arrow');
    const list = item.querySelector('.subtopic-list');
    const isOpen = list.classList.contains('show');
    if (isOpen) {
        list.classList.remove('show');
        arrow.classList.remove('expanded');
    } else {
        list.classList.add('show');
        arrow.classList.add('expanded');
    }
    selectTopic(idx);
}

function expandAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.add('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.add('expanded'));
}

function collapseAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.remove('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.remove('expanded'));
}

// ===== Selection =====
function clearSelection() {
    ROOT.querySelectorAll('.topic-header.active, .subtopic-item.active').forEach(el => el.classList.remove('active'));
}

function selectTopic(idx) {
    clearSelection();
    const header = ROOT.querySelectorAll('.topic-header')[idx];
    header.classList.add('active');
    renderMindmap(topics[idx].markdown, topics[idx].title);
}

function selectSubtopic(topicIdx, subIdx) {
    clearSelection();
    const item = ROOT.querySelectorAll('.topic-item')[topicIdx];
    const subItems = item.querySelectorAll('.subtopic-item');
    if (subItems[subIdx]) subItems[subIdx].classList.add('active');
    renderMindmap(topics[topicIdx].markdown, topics[topicIdx].title);
}

// ===== Render mindmap =====
function renderMindmap(markdown, title) {
    ROOT.querySelector('#titleText').textContent = title;
    const svgEl = ROOT.querySelector('#mindmapSvg');
    svgEl.innerHTML = '';
    svgEl.removeAttribute('style');
    try {
        const { Transformer } = window.markmap;
        const { Markmap } = window.markmap;
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        currentMm = Markmap.create(svgEl, { maxWidth: 300 }, root);
    } catch (e) {
        svgEl.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#999" font-size="14">' + e.message + '</text>';
    }
}

// ===== Search filter =====
function filterOutline(keyword) {
    const kw = keyword.trim().toLowerCase();
    ROOT.querySelectorAll('.topic-item').forEach((item, i) => {
        if (!kw) { item.classList.remove('hidden'); return; }
        const t = topics[i];
        const text = (t.title + ' ' + t.subtitles.join(' ') + ' ' + t.markdown).toLowerCase();
        item.classList.toggle('hidden', !text.includes(kw));
    });
}

// ===== Init =====
function init() {
    ROOT = document.querySelector('[data-page="shiwu"]');
    if (!ROOT) { setTimeout(init, 50); return; }

    // 绑定静态按钮事件
    var inp = ROOT.querySelector('#searchInput');
    if (inp) inp.oninput = function() { filterOutline(this.value); };
    var btns = ROOT.querySelectorAll('.toolbar button');
    if (btns[0]) btns[0].onclick = expandAll;
    if (btns[1]) btns[1].onclick = collapseAll;

    renderOutline();
    selectTopic(0);
    if (ROOT.querySelectorAll('.subtopic-list').length > 0) {
        ROOT.querySelectorAll('.subtopic-list')[0].classList.add('show');
        ROOT.querySelectorAll('.arrow')[0].classList.add('expanded');
    }
}
// 注册到全局命名空间供 onclick 调用
window[_NS] = { toggleTopic: toggleTopic, selectSubtopic: selectSubtopic };
init();
})();

const fullMarkdown = `## 一、计量法律法规体系

### 1.1 计量立法宗旨 ★★
- 加强计量监督管理
- 保障国家计量单位制的统一
- 保障量值的准确可靠（核心宗旨）
- 促进国民经济和科学技术发展
- 保护消费者免受不准确/不诚实测量的危害
- 保护人民健康和生命财产安全

### 1.2 计量法的调整范围 ★★
- 侧重调整：国家计量单位制的统一和量值的准确可靠
- 侧重调整：影响社会经济秩序、危害国家和人民利益的计量问题
- 不是所有计量工作问题都要立法（如教学示范用、家庭自用器具）

### 1.3 《计量法》基本内容 ★
- 计量立法宗旨、调整范围
- 计量单位制
- 计量基准、计量标准
- 计量检定、计量器具管理
- 计量监督、计量授权、计量认证
- 计量机构、计量人员
- 计量纠纷处理
- 计量法律责任

### 1.4 计量法规体系（三个层次）★★★
#### 第一层次：计量法律
##### 《中华人民共和国计量法》
- 基本法
- 实施计量监督管理的最高准则
#### 第二层次：计量行政法规（国务院制定/批准）
- 主要有7个（重要，常考选择题）
##### 一细则
- 《中华人民共和国计量法实施细则》
##### 三单位（关于法定计量单位）
- 《国务院关于在我国统一实行法定计量单位的命令》
- 《全面推行我国法定计量单位的意见》
- 《关于改革全国土地面积计量单位的通知》
##### 二办法（关于计量器具）
- 《中华人民共和国进口计量器具监督管理办法》
- 《中华人民共和国强制检定的工作计量器具检定管理办法》
##### 一国防
- 《国防计量监督管理条例》（国务院、中央军委发布）
#### 第三层次：计量规章（国务院计量行政部门发布）
- 资料性、说明性文件
##### 主要包括
- 《计量基准管理办法》
- 《计量标准考核办法》
- 《标准物质管理办法》
- 《法定计量检定机构监督管理办法》
- 《计量器具新产品管理办法》
- 《中华人民共和国进口计量器具监督管理办法实施细则》
- 《计量检定印、证管理办法》
- 《计量违法行为处罚细则》
- 《仲裁检定和计量调解办法》
- 《零售商品称重计量监督管理办法》
- 《定量包装商品计量监督管理办法》
- 《商品量计量违法行为处罚规定》
- 《计量授权管理办法》
- 《计量监督员管理办法》

- 《计量比对管理办法》
- 《能源计量监督管理办法》
- 《国家计量检定规程管理办法》

### 1.5 计量监督管理体制 ★
#### 管理体制（按行政区划，统一领导，分级负责）
##### 全国：国务院计量行政部门负责实施统一监督管理
- 纵向和横向的行政执法性监督
##### 地方：县级以上地方计量行政部门负责实施监督管理
- 纵向和横向的行政执法性监督
##### 军队：按《军队计量条例》实施
- 纵向行政管理监督
- 注意：不是《国防计量监督管理条例》
##### 部门：各有关部门计量行政机构负责本部门计量监督管理
- 纵向行政管理监督
#### 主要监督职责（轮换考）
- 贯彻执行国家计量工作的方针、政策和规章制度，推行国家法定计量单位
- 制定和协调计量事业的发展规划，建立计量基准和社会公用计量标准，组织量值传递
- 对制造、修理、销售、使用计量器具实施监督
- 进行计量认证，组织仲裁检定，调解计量纠纷
- 监督检查计量法律法规的实施情况，对违法行为按细则规定处理

## 二、计量技术机构

### 2.1 法定计量检定机构 ★★
#### 两种形式
##### 依法设置
- 县级以上人民政府计量行政部门依法设置的计量检定机构
- 国家法定计量检定机构
##### 授权认定
- 县级以上计量行政部门根据需要授权
- 专业性或区域性计量检定机构
#### 法定机构监督管理（2025年1月1日新规）★★★
##### 两级管理模式
- 国家市场监管总局：统一监督管理
- 县级以上地方市场监管部门：本行政区域内监管
#### 机构职责
- 为计量监督管理提供技术支撑
- 研究、建立、保存、维护计量基准和计量标准
- 开展量值传递
- 执行检定、型式评价、商品量检验
- 组织或参加计量比对
- 提供计量校准测试服务
- 研究和起草计量技术规范
- 开展公益性计量科普和教育实践

### 2.2 其他计量检定机构和计量技术机构（任务授权）★
- 不是法定计量检定机构
##### 经政府计量行政部门授权可以承担
- 建立社会公用计量标准
- 对其内部使用的强制检定计量器具执行检定
- 承担法律规定的其他检定、测试任务

### 2.3 计量技术机构管理体系依据
- 法定机构依据：JJF 1069《法定计量检定机构考核规范》
- 其他机构依据：GB/T 27025《检测和校准实验室能力的通用要求》

### 2.4 公正性要求 ★★
- 法制性的必然要求
- 社会存在价值的基础
#### 三方面保证
##### 组织结构的独立性
- 保证对结果判断的独立性
- 工作质量不受任何内部和外部压力诱惑影响
##### 经济利益的无关性
- 不以营利为目的
- 不参与任何影响公正性或职业道德的活动
##### 人员素质和职业道德

## 三、管理体系要求

### 3.1 管理体系文件 ★★
- 质量方针和总体目标
- 质量手册
- 程序文件
- 作业指导书
- 表格
- 质量计划
- 规范
- 外来文件
- 记录

### 3.2 质量方针和总体目标 ★★
#### 总体目标
- 可测量
- 与质量方针一致
- 管理评审时进行评审
#### 质量方针声明内容
- 服务质量承诺
- 服务标准声明
- 管理体系目的
- 体系文件执行要求
- 质量保证和持续改进的承诺

### 3.3 质量手册 ★
- 编制和保持，阐明质量方针
- 包括或注明支持性程序
- 确定技术负责人和质量负责人的作用和责任

### 3.4 文件控制 ★★
- 发布前批准
- 持续有效的再次批准
- 更改和修订状态得到识别
- 使用处可获得有效版本
- 保持清晰、易于识别
- 外来文件得到识别并控制分发
- 防止作废文件非预期使用

### 3.5 记录控制 ★
##### 质量记录
- 内部审核记录
- 管理评审报告
- 纠正/预防措施记录
##### 技术记录
- 检定、校准、检测数据和信息的积累

### 3.6 资源的配备和管理 ★★
#### 人员
##### 人员配备
- 检定、校准项目每个不少于2人
- 检测项目每个参数或试验项目不少于2人
- 应使用长期正式职工或合同制职工
##### 人员资质
- 经考核合格并被授权后持证件上岗
- 型式评价试验：每个参数或岗位至少有1人取得工程师以上技术职称
- 本专业工作3年以上
##### 人员培训
- 有计划有针对性
- 专业培训和管理培训
##### 人员职责
- 定岗定责
##### 授权与记录 ★★
- 特定类型抽样、检定、校准、检测
- 签发证书、报告
- 提出意见和解释
- 操作特定类型设备
- 保留授权和能力确认的日期记录
#### 设施和环境条件
##### 环境条件控制
- 不影响检定校准检测结果有效性
- 不对测量质量产生不良影响
##### 实验室设施
- 不相容活动相邻区域有效隔离
- 防止交叉污染
- 进入和使用加以控制
- 确保良好内务
#### 测量设备
##### 设备配置
- 计量基（标）准名称及设备一览表
- 商品量及商品包装计量检验设备一览表
- 型式评价试验设备一览表
- 一览表注明：名称、型号、测量范围、不确定度（准确度等级/最大允许误差）、量值传递或溯源关系
##### 设备性能
- 计量基、标准必须按规定考核合格，取得证书和溯源证明
- 检测的测量设备应有有效的计量检定证书或校准证书
- 性能试验设备应有有效的校准或检测报告
##### 设备使用
- 由经过授权的人员操作
- 设备使用和维护说明书便于取用
##### 设备记录
- 计量标准按JJF 1033《计量标准考核规范》要求建立文件集
- 保存对结果有重要影响的每一设备及其软件的记录
##### 设备管理（8条要点）★★★
- 唯一性标识
- 安全处置保养维护程序文件
- 隔离防误用及停用措施程序
- 检定/校准状态标示（含日期）
- 返回状态的核查
- 期间核查（稳定性确认）
- 修正参数的更新（含计算机软件备份）
- 软硬件保护

### 3.7 与顾客有关的过程 ★
- 要求/标书/合同的评审
- 服务顾客

## 四、检定、校准和检测方法及方法的确认

### 4.1 基本要求 ★★
- 应使用适合的方法和程序
- 包括抽样、处置、运输、储存和准备
- 适当时包括测量不确定度评定
- 包括统计技术分析

### 4.2 方法的选择 ★★★
#### 计量检定
- 必须使用国家计量检定规程
- 无国家规程：可使用部门或地方计量检定规程
- 必须是现行有效版本
#### 校准
- 应使用满足顾客需要、适宜的国家校准规范
- 无国家规范：尽可能使用国际、地区或国家的标准/技术规范
- 或使用相应的计量检定规程
- 现行有效的版本
#### 计量器具型式评价
- 使用国家统一的型式评价大纲或包含型式评价要求的检定规程
- 无国家大纲：依据JJF 1015《计量器具型式评价通用规范》、JJF 1016《计量器具型式评价大纲编写导则》拟定
#### 商品量及商品包装计量检验
- 国家统一的商品量及商品包装计量检验技术规范
- 无国家规范：执行省级以上政府计量行政部门规定的检测方法
#### 用能产品能源效率标识计量检测
- 国家统一的用能产品能源效率标识计量检测技术规范

### 4.3 非标准的方法 ★★
- 概念：在校准规范、检测技术规范或标准中未包含的方法
- 自编的校准规范属此类
- 必须时使用
  - 理解顾客要求
  - 明确校准或检测的目的
  - 征得顾客同意
- 使用前应经适当的确认

### 4.4 方法的确认 ★★★
#### 概念
- 通过核查并提供客观证据，证实特定预期用途的特定要求得到满足
- 用于确定方法性能
  - 校准
  - 比对
  - 系统性评审
  - 不确定度评定
- 方法所得值的范围和准确度应适应顾客需求
- 包括：要求详细说明、特性量测定、要求满足核查、有效性声明
#### 要求
- 需要做方法确认的范围
  - 非标准方法
  - 机构设计（制定）的方法
  - 超出预定范围使用的标准方法
  - 扩充和修改过的标准方法
- 目的：证实方法适用于预期用途，满足应用领域需要
- 确认记录：结果、确认程序、是否适合预期用途的声明

### 4.5 校准和测量能力评价 ★★
- CMC定义：校准实验室在常规条件下能够提供给客户的校准和测量的能力
- 即常规条件下的校准中可获得的最小测量不确定度
##### 评价要求
- 应有评价CMC的程序
- 评价覆盖所开展所有校准项目的参数和量程

### 4.6 测量不确定度的评定 ★★
- 应有评定测量不确定度的程序
- 对各种类型的检定、校准和检测都应按规定要求进行不确定度评定

### 4.7 数据控制 ★★
##### 数据核查
- 对计算、数据传送和信息系统进行系统适当的检查
##### 数据检索能力
- 计算机软件适用性
- 数据保护程序：输入、存储、传输、处理的完整性和保密性
- 维护正常运行条件

## 五、检定、校准检测质量保证

### 5.1 过程控制 ★★
- 计量标准/仪器/设备受控
- 标准文件受控
- 信息资源受控
- 环境条件受控
- 人员受控
- 结果受控
- 质量受控
- 异常处置受控

### 5.2 结果控制 ★★
- 定期使用有证标准物质内部质量控制
- 参加实验室间比对或能力验证
- 利用相同或不同方法重复检定/校准/检测
- 对存留物品再检定/校准/检测
- 分析物品不同特性结果的相关性

## 六、原始记录、数据处理和报告

### 6.1 原始记录和数据处理 ★★★
##### 按规定期限保存
- 原始记录
- 检定证书、校准证书、检测报告副本
##### 包含足够信息以便复现
- 识别不确定度的影响因素
- 记录抽样人员、执行人员、核验人员签名
##### 记录要求
- 观测结果、数据、计算应在产生时予以记录
- 按特定任务分类识别
##### 错误处理
- 划改，不可擦掉或涂掉
- 正确值填写在旁边
- 改动有改动人签名或签名缩写
- 电子记录采取同等措施

### 6.2 检定、校准和检测结果的报告 ★★
#### 基本要求
- 准确、清晰、明确、客观
- 符合检定规程、校准规范、型式评价大纲、检测规则要求
- 形式：检定证书、检定结果通知书、校准证书、型式评价报告、检验/检测报告
- 包括顾客要求的全部信息
- 仅在书面协议下可简化报告
#### 检定证书
- 按《计量检定印、证管理办法》出具或加盖检定合格印
- 已被调整或修理时，保留前后检定记录并报告前后结果
#### 校准证书
- 应符合相关技术规范规定
- 仅与量和功能性检测的结果有关
- 给出校准值或修正值时，应同时给出不确定度
- 调整或修理时，报告前后校准结果
##### 复校时间间隔
- 校准规范包含建议或与顾客达成协议时给出
- 其他情况校准证书不包含复校时间间隔
##### 符合性声明
- 指明符合或不符合该规范的那些条款
- 略去测量结果时应记录并保存以备查阅
- 应考虑测量不确定度
#### 检测报告
- 计量器具型式评价
- 商品量及商品包装计量检验
- 能源效率标识计量检测
- 必须按政府计量部门要求和相应技术规范出具
#### 意见和解释
- 把意见和解释的依据制定成文件
- 应被清晰标注
##### 内容
- 关于结果符合或不符合要求的说明
- 合同的履行情况
- 如何使用结果的建议
- 用于改进的指导意见
#### 证书和报告的修改
##### 实质性修改
- 仅以追加文件或信息变更的形式
- 包括"对……的检定证书的补充文件"声明
##### 必要时发布全新证书或报告
- 注以唯一性标识
- 注明所代替的原件
#### 证书和报告的管理
- 证书专用印章应有专人保管
- 制定管理程序

## 七、不符合工作的控制 ★★

### 7.1 触发条件
- 工作或工作结果不符合管理体系要求
- 不符合顾客同意的要求时

### 7.2 政策和程序保证
- 确定不符合工作管理的责任和权限
  - 必要时暂停工作
  - 扣发检定证书、校准证书、检验/检测报告
- 对不符合工作的严重性进行评价
- 立即进行纠正
  - 对可接受性做出决定
- 必要时通知顾客并取消工作
- 规定批准恢复工作的职责

### 7.3 后续动作
- 不符合工作识别可能在管理体系和技术运作各环节
- 不符合工作可能再度发生时立即执行纠正措施程序
- 对政策和程序符合性产生怀疑时也应执行纠正措施

## 八、内部审核与管理评审 ★★

### 8.1 内部审核
#### 审核过程
##### 依据
- 预定的日程表和形成文件的程序
- 验证持续符合管理体系和JJF 1069-2012《法定计量检定机构考核规范》要求
##### 全要素审核
- 涉及管理体系的全部要素
- 包括检定、校准和检测活动
##### 负责人
- 质量负责人按日程表要求和管理层需要策划和组织
##### 审核员
- 经过培训和具备资格的人员执行
- 资源允许时审核人员独立于被审核活动
##### 周期
- 通常不超过12个月
#### 消除不符合及原因
- 采取纠正措施
##### 追溯受影响结果
- 调查表明结果可能已受影响时书面通知顾客
#### 审核记录
- 审核活动领域
- 审核发现的情况
- 因此采取的纠正措施
#### 后续活动
- 对所采取措施的验证
- 验证结果的报告

### 8.2 管理评审
#### 评审要求
- 机构负责人定期组织
- 确保持续的适宜性、充分性和有效性
- 包括改进的机会评价和管理体系变更的需求
  - 含质量方针和总体目标变更的需求
- 保持管理评审的记录
#### 评审输入
- 程序适用性
- 内审结果
- 纠正预防措施
- 顾客反馈等
#### 评审输出
- 管理体系有效性及其过程有效性的改进
- 与法律法规要求和顾客要求有关的检定、校准和检测的改进
- 资源需求

## 九、纠正措施和预防措施 ★★★

### 9.1 纠正措施
#### 定义
- 为消除已发现的不合格或其他不期望情况的原因所采取的措施
#### 要求
- 制定纠正措施的政策和形成文件的程序
- 指定合适的人员
- 在识别出不符合工作或偏离时实施
#### 原因分析
- 从确定问题根本原因的调查开始
- 是纠正措施程序中最关键有时也是最困难的部分
#### 选择和实施
- 选择最可能消除问题和防止再次发生的措施
- 与问题严重程度和风险大小相适应
- 任何变更制定成文件并加以实施（文件化）
#### 监控
- 对纠正措施的结果进行监控
- 确保所采取措施有效
#### 附加审核
- 触发条件：对符合政策程序或考核规范产生怀疑时
- 通常在纠正措施实施后进行
- 确定纠正措施的有效性
- 仅在问题严重或对业务有危害时进行

### 9.2 预防措施
- 消除潜在不合格原因的措施
- 识别改进和潜在不符合原因
- 制定措施计划并实施监控

## 十、计量授权管理

### 10.1 计量授权的形式 ★★
- 授权专业性或区域性计量检定机构作为法定计量检定机构
- 授权建立计量基准、社会公用计量标准
- 授权计量检定机构对内部使用的强制检定计量器具执行强制检定
##### 授权技术机构承担
- 计量标准的技术考核
- 仲裁检定
- 计量器具新产品型式评价
- 标准物质定级鉴定
- 计量器具产品质量监督试验
- 对社会开展强制检定、非强制检定

### 10.2 计量授权的申请 ★★
##### 申请建立计量基准的授权
- 向国务院计量行政部门提出申请
##### 申请承担计量器具新产品型式评价的授权
- 向省级以上人民政府计量行政部门提出
##### 申请对本部门内部使用强检计量器具执行强检的授权
- 向同级人民政府计量行政部门提出
##### 申请对本单位内部使用强检的工作计量器具执行强检的授权
- 向当地县（市）级人民政府计量行政部门提出
##### 申请作为法定计量检定机构、建立社会公用计量标准等
- 根据承担授权任务的区域，向相应的人民政府计量行政部门提出

### 10.3 计量授权的考核 ★★
##### 法定计量检定机构、本地区最高社会公用计量标准
- 受理部门报请上一级人民政府计量行政部门主持考核
##### 计量基准、非本地区最高社会公用计量标准等
- 由受理申请的人民政府计量行政部门主持考核
##### 申请单位有关计量检定、测试人员
- 应当具有相应职业资格
##### 考核合格
- 由受理申请的政府计量行政部门批准
- 颁发相应的计量授权证书
- 公布被授权单位的机构名称和承担授权的业务范围

## 十一、计量基准

### 11.1 计量基准的含义 ★
- 国家计量基准
- 经国家决定承认
- 在一个国家内作为对有关量的其他测量标准定值的依据
- 体现国家科学计量水平
- 处于全国传递计量单位量值的最高或起始位置
- 也是全国计量单位量值溯源的终点

### 11.2 计量基准的法律地位
- 必须经国务院计量行政部门批准
- 颁发计量基准证书后方可正式使用
- 可代表国家参加国际比对
- 与国际计量基准保持一致

### 11.3 计量基准的地位和作用 ★★
- 国家量值的源头
- 经国务院计量行政部门批准作为统一全国量值的最高依据
- 各级计量标准和工作计量器具的量值都要溯源于计量基准
- 可以进行仲裁检定，作为处理计量纠纷的依据，具有法律效力

### 11.4 计量基准的建立 ★★
#### 建立原则
- 国务院计量行政部门统一规划、组织建立
- 基础性、通用性的计量基准
  - 建立在市场监管总局设置或授权的计量技术机构
- 专业性强、仅为个别行业所需要、工作条件特殊的计量基准
  - 可建立在有关部门或单位所属的计量技术机构
  - 例如：工频大电流比例基准建立在国家高电压计量站
- 全国各级计量标准和工作计量器具量值都应直接或间接溯源到计量基准
#### 建立条件
- 能够独立承担法律责任
- 具有专职技术人员和管理人员
  - 从事计量基准研究、保存、维护、使用、改造等工作
- 具有保存、维护和改造计量基准装置及实验室环境条件
- 具有保证量值定期复现和长期稳定可靠运行的经费和技术保障能力
- 具有相应的质量管理体系
- 具有参与国际比对、承担国内比主导实验室和量值传递的技术水平
#### 申报评审流程
- 计量技术机构向国务院计量行政部门申报
- 委托专家组进行文件资料审查和现场评审
- 专家组出具评审报告
- 审核合格的批准并颁发计量基准证书
- 向社会公告

### 11.5 计量基准的监督 ★
- 国务院计量行政部门定期复核
- 不定期监督检查
- 复核周期一般为5年
- 计量技术机构应定期检查计量基准技术状况
- 因故中断量值传递的应向国务院计量行政部门报告

## 十二、计量标准

### 12.1 计量标准的含义 ★★
- 计量标准是计量标准器具的简称
- 准确度等级低于计量基准
- 用于检定其他计量标准或工作计量器具的计量器具
- 凡不用于量值传递或溯源而只用于日常测量的，无论准确度多高都称为工作计量器具

### 12.2 计量标准的地位和作用 ★★★
- 处于国家计量检定系统表的中间环节
- 起承上启下的作用
- 将计量基准复现的单位量值通过检定逐级传递到工作计量器具
- 确保全国计量单位制和量值的统一
- 是实现量值统一的物质基础和重要保障

### 12.3 计量标准的分类
##### 按法律地位、使用和管辖范围
- 社会公用计量标准
- 部门计量标准
- 企事业单位计量标准
- 必须依法考核合格才有资格开展量值传递

### 12.4 计量标准的分级和应用 ★★
#### 最高等级计量标准（3类）
- 最高等级社会公用计量标准
- 部门最高计量标准
- 企事业单位最高计量标准
#### 其他等级计量标准（3类）
- 其他等级社会公用计量标准
- 部门其他等级计量标准
- 企事业单位其他等级计量标准
#### 应用范围
##### 社会公用计量标准
- 向社会开展计量检定或校准
##### 部门计量标准
- 在本部门内部开展非强制检定或校准
##### 企事业单位计量标准
- 在本单位内部开展非强制检定或校准

### 12.5 社会公用计量标准 ★★★
- 经政府计量行政部门考核、批准
- 作为统一本地区量值的依据
- 在社会上实施计量监督具有公证作用
- 仲裁检定后的数据可作为仲裁依据，具有法律效力
##### 考核
- 县级以上地方政府计量行政部门建立的本行政区域内最高等级
  - 须向上一级人民政府计量行政部门申请考核
- 其他等级
  - 由当地人民政府计量行政部门主持考核
- 经考核合格者，由当地县级以上政府计量行政部门审批颁发社会公用计量标准证书

### 12.6 部门计量标准 ★★
- 国务院有关主管部门和省级人民政府有关主管部门
- 根据本部门特殊需要，可建立本部门使用的计量标准器具
##### 部门最高计量标准
- 须经同级人民政府计量行政部门考核合格后由有关主管部门批准
- 作为统一本部门量值的依据
- 在本部门内部开展非强制检定工作

### 12.7 企事业单位计量标准 ★★
- 《计量法》第八条规定可建立本单位使用的计量标准器具
##### 各项最高计量标准
- 须经与企业、事业单位主管部门同级的政府计量行政部门主持考核
- 取得计量标准考核证书才能在本单位内开展非强制检定
##### 乡镇企业最高计量标准
- 由当地县（市、区）级人民政府计量行政部门主持考核

### 12.8 计量标准的考核 ★★★
- 国务院计量行政部门统一监督管理全国计量标准考核工作
- 省级计量行政部门负责本行政区域内
##### 社会公用计量标准的考核
- 国务院组织建立的及省级最高等级
  - 由国务院计量行政部门主持考核
- 地（市）、县级最高等级
  - 由上一级计量行政部门主持考核
- 各级地方其他等级
  - 由组织建立的计量行政部门主持考核
##### 部门计量标准的考核
- 国务院和省级有关部门最高等级
- 须经同级政府计量行政部门主持考核
##### 企事业单位计量标准的考核
- 经主管部门同级政府计量行政部门主持考核
##### 无主管部门的单位
- 向登记注册地的计量行政部门申请
##### 授权单位计量标准的考核
- 向授权的计量行政部门申请
- 取得证书才能开展授权范围的检定工作

### 12.9 计量标准的复查 ★
- 考核证书有效期为5年
- 有效期届满6个月前申请复查考核
- 经复查合格，准予延长有效期
- 不合格的发送《计量标准考核结果通知书》
- 超过有效期的，按新建计量标准重新申请考核
##### 全国概况
- 社会公用计量标准6万余项
- 部门和企事业单位最高计量标准4万余项
- 总计10万余项

## 十三、标准物质 ★

### 13.1 标准物质的含义
- 具有一种或多种足够均匀、稳定并很好地确定了的特性
- 用以校准测量装置、评价测量方法或给材料赋值
- 国际上又称为参考物质
- 可以是纯的或混合的气体、液体或固体
- 用于统一量值的标准物质属于计量器具范畴

### 13.2 国家标准物质（有证标准物质）
- 我国纳入依法管理的标准物质
- 附有证书
- 一种或多种特性值用建立了溯源性的程序确定
- 可溯源到准确复现的测量单位
- 每一种出证特性值都附有给定包含概率（或包含因子）的不确定度
- 国务院计量行政部门负责审批
- 截至2021年底有15188种（一级3089种，二级12099种）

### 13.3 标准物质的特点
- 具有量值准确性
- 用于测量的目的

### 13.4 标准物质的分级 ★
##### 一级（用于传递）
- 定义法或准确可靠方法定值
- 不确定度达国内最高水平
##### 二级（工作器具）
- 准确可靠方法或与一级比较定值

### 13.5 标准物质的作用
- 量值准确可靠和实现全国量值统一的法定依据
- 作为计量标准来检定、校准或校对仪器设备
- 作为比对标准考核仪器设备、测量方法和操作是否正确
- 测定物质或材料的组成和性质
- 考核实验室间测量结果准确度和一致性
- 鉴定试制的仪器设备或评价新的测量方法
- 用于仲裁检定

### 13.6 标准物质的管理
- 制造单位应具备相适应的设施、人员和分析测量仪器设备
##### 制造标准物质新产品
- 应进行定级鉴定
- 经评审取得标准物质定级鉴定证书后方可生产、销售

## 十四、量值传递与量值溯源

### 14.1 量值传递 ★★
- 通过校准或检定
- 将国家测量标准所实现的单位量值通过各等级测量标准传递到工作测量仪器
- 保证测量量值准确一致

### 14.2 计量溯源性 ★★★
- 通过文件规定的不间断的校准链
- 测量结果与参照对象联系起来的特性
- 校准链中每项校准均会引入测量不确定度
- 实例：钢直尺→三等标准线纹尺→二等→一等→633 nm波长国家计量基准

### 14.3 量值传递与溯源的关系 ★★
- 同一过程的两种不同表达
- 互为逆过程
- 量值传递：自上而下逐级传递
- 量值溯源：自下而上的溯源行为
- 量值传递的起点是计量基准
- 溯源的起点是计量器具测得的量值
- 通过工作计量器具→各级计量标准→国家计量基准
- 量值溯源可通过送检或送校实现

### 14.4 量值传递与溯源的必要性
- 《计量法》第一条计量立法宗旨
- 保障国家计量单位制的统一和量值的准确可靠
- 最基础、最核心的过程就是量值传递和量值溯源
- 即检定和校准
- 我国用国家计量检定系统表来表示

## 十五、计量检定的法制管理

### 15.1 强制检定 ★★★
#### 强制检定的范围
##### 县级以上人民政府计量行政部门对以下实行强制检定
- 社会公用计量标准器具
- 部门和企业事业单位使用的最高计量标准器具
- 用于贸易结算、安全防护、医疗卫生、环境监测方面的列入强检目录的工作计量器具
- 未按规定申请检定或检定不合格的，不得使用
#### 强制检定的方式
##### 只做首次强制检定
- 失准报废
- 限期使用，到期轮换
##### 进行周期检定
- 检定周期由相应检定规程确定
- 检定规程修订后以修订后为准
#### 强制检定的主要特点
- 县级以上政府计量行政部门统一实施监督管理
- 经济合理、就地就近原则
##### 固定检定关系，定点送检
- 强检工作计量器具
  - 当地县（市）级政府计量行政部门安排
  - 指定的计量检定机构进行检定
  - 政府计量行政部门之间可协商跨地区委托检定
- 强检计量标准
  - 主持考核的政府计量行政部门安排
  - 指定的计量检定机构进行检定
##### 使用单位
- 按规定登记造册
- 向当地政府计量行政部门备案
- 向指定的计量检定机构申请强检
##### 承担机构
- 按检定规程规定的检定周期
- 安排好周期检定计划，实施强检
##### 监督检查
- 县级以上政府计量行政部门经常进行监督检查
- 未按规定申请周期检定的追究法律责任、责令停止使用、可处罚款

### 15.2 计量检定印、证的管理 ★★★
#### 印、证的种类（5种）
- 检定证书
- 检定结果通知书（又称检定不合格通知书）
- 检定合格证：证明检定合格的证件
##### 检定合格印
- 在计量器具上加盖的印记
- 形式：錾印、喷印、钳印、漆封印、合格标签
##### 注销印
- 经检定不合格，注销原检定合格印记
#### 印、证的管理
- 必须符合《计量检定印、证管理办法》和有关国家计量检定规程
##### 检定合格
- 出具《检定证书》《检定合格证》或加盖检定合格印
##### 周期检定不合格
- 出具《检定结果通知书》（或《检定不合格通知书》）
- 注销原检定合格印、证
##### 证书要求
- 字迹清楚
- 数据无误
- 内容完整
- 检定/核验/主管人员签字
- 加盖检定单位印章
##### 保管与制度
- 印、证应有专人保管，建立使用管理制度
##### 伪造、盗用、倒卖处罚
- 没收非法印、证和全部违法所得
- 可并处罚款
- 构成犯罪的依法追究刑事责任

## 十六、计量技术规范

### 16.1 计量技术规范的范围
- 国家计量检定系统表
- 计量检定规程
- 计量器具型式评价大纲
- 计量校准规范

### 16.2 计量检定系统表（量值溯源等级图）★★
- 只有国家计量检定系统表一种
- 由国务院计量行政部门组织制定、修订
- 由建立计量基准的单位负责起草
- 一项国家计量基准基本上对应一个检定系统表
#### 内容规定
- 国家计量基准的主要计量特性
- 从计量基准通过计量标准向工作计量器具量值传递的程序和方法
- 计量标准复现和保存量值的不确定度
- 工作计量器具的最大允许误差

### 16.3 计量检定规程 ★★
#### 含义
- 评定计量器具特性
- 规定计量性能、法制计量控制要求、检定条件、检定方法、检定周期
- 对计量器具做出合格与否判定
#### 法律规定
- 计量检定必须执行计量检定规程
#### 分类（3类）
##### 国家计量检定规程
- 由国务院计量行政部门组织制定
##### 部门计量检定规程
- 国务院有关部门制定
- 适用于本部门
- 对尚没有国家计量检定规程的计量器具
- 国家规程颁布后即行废止
##### 地方计量检定规程
- 省级计量行政部门制定
- 适用于本地区
- 对尚没有国家计量检定规程的计量器具
- 国家规程颁布后即行废止

### 16.4 计量器具型式评价大纲
- 型式评价应依据型式评价大纲进行
- 国家计量检定规程已规定型式评价要求的，按规程执行
##### 无国家型式评价大纲的
- 由承担型式评价的技术机构依据相关标准、规范和国际建议拟定
- 经审核确认后实施

### 16.5 其他计量技术规范
- 国务院计量行政部门组织制定
#### 通用计量技术规范
- 通用计量名词术语
- 计量标准考核规范
#### 专用计量技术规范
- 各专业的计量校准规范
- 用能产品的能效标识计量检测规则等
#### 涉及范围
- 综合性、基础性
- 涉及计量管理的技术文件
- 计量校准
- 计量器具型式评价
- 商品量定量包装检验
- 用能产品能源效率标识计量检测

### 16.6 计量技术规范的编号 ★★★
##### 国家计量检定规程
- JJG XXXX-XXXX（顺序号1999号以下）
- JJG 2XXX-XXXX（顺序号2000号以上，国家计量检定系统表）
##### 国家计量技术规范
- JJF XXXX-XXXX
##### 地方和部门计量检定规程
- JJG（）XXXX-XXXX
- 括号内中文字代表批准单位和施行范围
##### 实例
- JJG(京)39-2006《智能冷水表检定规程》（地方）
- JJF（石化）005-2015《旋转辊筒式磨耗机校准规范》（部门技术规范）

## 十七、量和单位

### 17.1 量 ★
- 现象、物体或物质的特性
- 大小用一个数和一个参照对象表示

### 17.2 序量 ★
- 由约定测量程序定义
- 只能与同类的其他量按其大小排序建立联系
- 只能写入经验关系式
- 不具有计量单位或量纲
- 无代数运算关系
- 差值或比值无物理意义

### 17.3 量的符号 ★★
- 用单个拉丁或希腊字母
- 必须用斜体表示
##### 下标用法
- 物理量符号、变量、坐标、序号：斜体
- 其他：正体

### 17.4 量制 ★
- 基本量和导出量的特定组合
- 以基本量符号组合作为缩写（如lmt量制）

### 17.5 量纲 ★★★
- 量与量制中各基本量的依存关系
- 用大写正体罗马字母表示
##### 七个基本量的量纲符号
- 长度：L
- 质量：M
- 时间：T
- 电流：I
- 热力学温度：Θ
- 物质的量：N
- 发光强度：J
- 量纲仅表示量的构成，不表示其性质
- 不同的量可以有相同的量纲
  - 如功和力矩：L²MT⁻²
##### 量纲法则
- 只有量纲相同的量才能相加减
- 等号两边的量纲必须相同

### 17.6 量纲为一的量 ★★★
- 因子指数均为零的量
- 在量纲式中，所有因子的指数为零
##### 实例
- 平面角
- 折射率
- 质量分数
- 摩擦系数
- 马赫数
- 特点：率、系数、分数等

### 17.7 单位制 ★
- 由基本单位、导出单位、它们的倍数和分数单位
- 以及使用规则组成

## 十八、国际单位制（SI）

### 18.1 SI基本单位（7个）★★★
- 长度：米（m）
- 质量：千克/公斤（kg）
- 时间：秒（s）
- 电流：安[培]（A）
- 热力学温度：开[尔文]（K）
- 物质的量：摩[尔]（mol）
- 发光强度：坎[德拉]（cd）
##### 注释
- 圆括号中名称是它前面名称的同义词
- 方括号中字在不致混淆时可省略
- 单位名称简称可作中文符号

### 18.2 SI导出单位（21个具有专门名称）★★★
- 弧度（rad）：1 rad = 1 m/m = 1
- 球面度（sr）：1 sr = 1 m²/m² = 1
- 频率赫[兹]（Hz）：1 Hz = 1 s⁻¹
- 力牛[顿]（N）：1 N = 1 kg·m/s²
- 压力/压强/应力帕[斯卡]（Pa）：1 Pa = 1 N/m²
- 能量/功/热量焦[耳]（J）：1 J = 1 N·m
- 功率/辐射能通量瓦[特]（W）：1 W = 1 J/s
- 电荷[量]库[仑]（C）：1 C = 1 A·s
- 电压/电动势/电位伏[特]（V）：1 V = 1 W/A
- 电容法[拉]（F）：1 F = 1 C/V
- 电阻欧[姆]（Ω）：1 Ω = 1 V/A
- 电导西[门子]（S）：1 S = 1 Ω⁻¹
- 磁[通量]韦[伯]（Wb）：1 Wb = 1 V·s
- 磁通[量]密度/磁感应强度特[斯拉]（T）：1 T = 1 Wb/m²
- 电感亨[利]（H）：1 H = 1 Wb/A
- 摄氏温度（℃）：1 ℃ = 1 K
- 光通量流[明]（lm）：1 lm = 1 cd·sr
- [光]照度勒[克斯]（lx）：1 lx = 1 lm/m²
- [放射性]活度贝可[勒尔]（Bq）：1 Bq = 1 s⁻¹
- 吸收剂量戈[瑞]（Gy）：1 Gy = 1 J/kg
- 剂量当量希[沃特]（Sv）：1 Sv = 1 J/kg

### 18.3 SI词头（20个）★★★
#### 正词头（≥10⁰，10个）
- 10²⁴ 尧[它] Y
- 10²¹ 泽[它] Z
- 10¹⁸ 艾[可萨] E
- 10¹⁵ 拍[它] P
- 10¹² 太[拉] T
- 10⁹ 吉[咖] G
- 10⁶ 兆 M
- 10³ 千 k
- 10² 百 h
- 10¹ 十 da
#### 负词头（<10⁰，10个）
- 10⁻¹ 分 d
- 10⁻² 厘 c
- 10⁻³ 毫 m
- 10⁻⁶ 微 μ
- 10⁻⁹ 纳[诺] n
- 10⁻¹² 皮[可] p
- 10⁻¹⁵ 飞[母托] f
- 10⁻¹⁸ 阿[托] a
- 10⁻²¹ 仄[普托] z
- 10⁻²⁴ 幺[科托] y
#### 注意
- SI词头不包括"万、亿、万亿"等中文数词
- 这类数词使用不受词头名称影响，但不应混淆
- 千克（kg）除外，加词头需以g为基础

## 十九、我国法定计量单位

### 19.1 法定计量单位的组成 ★★★
- SI基本单位（7个）
- 包括SI辅助单位在内的具有专门名称的SI导出单位（21个）
- 组合形式SI导出单位
- SI单位的倍数单位（包括十进倍数和分数，20个词头）
- 国家选定的作为法定计量单位的非SI单位（16个）
- 由以上单位构成的组合形式单位

### 19.2 国家选定的非SI单位（16个）★★
##### 时间
- 分（min）：1 min = 60 s
- [小]时（h）：1 h = 60 min = 3600 s
- 天（日）（d）：1 d = 24 h = 86400 s
##### [平面]角
- [角]秒（"）：1" = (π/648000) rad
- [角]分（'）：1' = 60" = (π/10800) rad
- 度（°）：1° = 60' = (π/180) rad
##### 旋转速度
- 转每分（r/min）：1 r/min = (1/60) s⁻¹
##### 长度
- 海里（n mile）：1 n mile = 1852 m（只用于航程）
##### 速度
- 节（kn）：1 kn = 1 n mile/h = (1852/3600) m/s（只用于航程）
##### 质量
- 吨（t）：1 t = 10³ kg
- 原子质量单位（u）：1 u ≈ 1.660540×10⁻²⁷ kg
##### 体积
- 升（L,l）：1 L = 10⁻³ m³ = 1 dm³
##### 能
- 电子伏（eV）：1 eV ≈ 1.602177×10⁻¹⁹ J
##### 极差
- 分贝（dB）/奈培（Np）：1 Np = 8.68589 dB
##### 线密度
- 特[克斯]（tex）：1 tex = 10⁻⁶ kg/m
##### 面积
- 公顷（hm²,ha）：1 hm² = 10⁴ m²

## 二十、法定计量单位使用规则

### 20.1 名称使用规则 ★★★
- 组合单位名称与符号顺序一致
##### 乘号无对应名称，除号对应"每"字
- "每"字无论分母有几个单位只出现一次
- 例：J/(kg·K) → 焦耳每千克开尔文
- 错误：每千克开尔文焦耳、焦耳每千克每开尔文
##### 乘方形式
- 指数名称在前，单位名称在后
- 由数字加"次方"二字
- 例：m⁴ → 四次方米
##### 长度的2次和3次幂
- 表示面积、体积时用"平方""立方"
- 否则用"二次方""三次方"
- 例：体积dm³为"立方分米"，断面系数m³为"三次方米"
##### 汉字书写不加任何乘除符号或其他符号
- 例：Ω·m为"欧姆米"，错误："欧姆·米""欧姆-米""[欧姆][米]"
- 例：kg/m³为"千克每立方米"

### 20.2 符号使用规则 ★★★
##### 中文符号
- 必要时可将单位简称（含带词头的简称）作为符号使用
##### 字体
- 拉丁或希腊字母一律用正体
##### 大小写
- 单位符号一律用小写字母
- 来源于人名的单位符号第一个字母大写
- 升的符号L例外
- 例：秒（s）、帕斯卡（Pa）
##### 复数
- 单位符号没有复数形式
- 不得附加任何其他标记或符号
##### 词头符号大小写
- 因数 ≤ 10³：小写（如k、d、c）
- 因数 ≥ 10⁶：大写（如M、G）
##### 不同时使用单位符号和中文符号
- 例：速度不得写成km/小时
##### 组合单位（相乘）符号形式
- N·m或N m两种
- 同时是某词头符号且可能混淆时，应置于右侧
- 例：力矩"牛顿米"应写成N m，避免误解为毫牛顿
##### 中文组合符号
- 两单位之间用居中圆点代表乘号
- 例：动力黏度"帕·秒"
##### 组合单位（相除）符号形式
- kg/m³、kg·m⁻³、kg m⁻³三种之一
- 可能误解时用居中圆点或斜线
- 例：m·s⁻¹或m/s，不宜用ms⁻¹（误解为每毫秒）
##### 中文组合符号（相除）
- 千克／米³ 或 千克·米⁻³ 两种之一
- 运算时除号
  - 可用水平横线表示
##### 分子无量纲
- 一般不用分式而用负数幂
- 例：波数单位用m⁻¹，不用1/m
##### 斜线表示相除
- 单位符号分子分母都与斜线处于同一行内
- 分母含两个以上符号时整个分母加圆括号
- 除加括号避免混淆外，斜线不得多于一条
- 例：W/(K·m)，不能写成W/K·m或W/K/m
##### 单位符号位置
- 写在全部数值之后
- 与数值之间留适当空隙
- 例：100 m，不应写成100m
##### 词头符号
- 与单位符号之间不得有间隙
- 不加表示相乘的任何符号
- 例：cm、dm
##### 读音
- 应按名称或简称读音
- 不得按字母读音
##### 摄氏度（℃）
- 可作为中文符号使用
- 可与其他中文符号构成组合形式

### 20.3 使用场合规则 ★★
##### 单位与词头名称
- 一般只宜在叙述性文字中使用
##### 单位和词头符号
- 在公式、数据表、曲线图、刻度盘、产品铭牌等需简单明了表示处使用
- 也可用于叙述性文字中
- 应优先采用符号
##### 单位的整体性
- 名称或符号必须作为整体使用，不得拆开
- 例：20 ℃应读"20摄氏度"，不读"摄氏20度"或"20度"
- 例：30 km/h读"三十千米每小时"，不读"每小时三十千米"

### 20.4 词头使用规则 ★★★
##### 一般使用范围
- 量值处于0.1～1000范围内
- 例：1.2×10⁴ N → 12 kN
- 例：0.00394 m → 3.94 mm
- 例：11401 Pa → 11.401 kPa
- 例：3.1×10⁻⁸ s → 31 ns
##### 习惯使用例外
- 机械制图长度用mm
- 导线截面积用mm²
- 同一量的数值表或叙述同一量的文章中使用相同单位时数值不受限制
##### 词头h、da、d、c
- 一般用于某些长度、面积和体积单位中
- 根据习惯和方便也可用于其他场合
- 非法定单位用词头
  - 有些非法定单位可按习惯用SI词头构成倍数或分数单位
##### 不得用SI词头的情况
- 摄氏度
- 非十进制单位（如度、角分、角秒、分、时、日）
- 词头不得重叠使用
  - 应该用nm，不应该用mμm
##### 万、亿等中文数词
- 是我国习惯用的数词，仍可使用
- 但不是词头
- 例：万公里可记为"万 km"或"10⁴ km"
- 例：万吨公里可记为"万 t·km"或"10⁴ t·km"
##### 相乘组合单位加词头
- 词头通常加在第一个单位之前
- 例：力矩单位kN·m，不宜写成N·km
##### 相除（或乘除）组合单位加词头
- 词头一般加在分子中第一个单位前
- 分母中一般不用词头
- kg是SI单位，不作为有词头的单位对待
- 例：kJ/mol不宜写成J/mmol
##### 长度、面积、体积作分母例外
- 习惯与方便，分母可选用词头
- 例：密度单位可选用g/cm³
##### 一般不在分子分母同时用词头
- kg不作为有词头对待
- 例：电场强度不宜用kV/mm，而是MV/m
- 例：质量摩尔浓度可以用mmol/kg
##### 倍数单位的指数
- 指包括词头在内的单位的幂
- 例：1 cm² = 1×(10⁻² m)² = 1×10⁻⁴ m²
- 错误：1 cm² ≠ 10⁻² m²
- 例：1 μs⁻¹ = 1×(10⁻⁶ s)⁻¹ = 10⁶ s⁻¹
##### 计算建议
- 所有量值都采用SI单位表示
- 词头以相应10的幂代替
- kg本身是SI单位，不应换成10³ g
##### 中文符号避免与中文数词混淆
- 必要时使用圆括号
- 例：旋转频率"3千秒⁻¹"
  - 表示"三每千秒"：写为"3（千秒）⁻¹"（千为词头）
  - 表示"三千每秒"：写为"3千（秒）⁻¹"（千为数词）
- 例：体积"2千米³"
  - 表示"二立方千米"：写为"2(千米)³"（千为词头）
  - 表示"二千立方米"：写为"2千(米)³"（千为数词）

## 二十一、测量基础

### 21.1 测量 ★★
- 通过实验获得并可合理赋予某量一个或多个量值的过程

### 21.2 计量 ★
- 实现单位统一、量值准确可靠的活动
##### 特点
- 准确性
- 一致性
- 溯源性
- 法制性
##### 分类
- 法制计量
- 科学计量
- 工业计量

### 21.3 测量原理 ★
- 测量所依据的自然科学定律、定理和已得到充分理论解释的自然效应
##### 实例
- 力的测量：牛顿第二定律
- 电学测量：欧姆定律
- 温度测量：热电效应
- 质量测量：杠杆原理
- 弹簧秤测质量：弹性系数

### 21.4 测量方法 ★★★
#### 按量值取得方式分类
##### 直接测量法
- 直接得到被测量值
- 测得量值由测量仪器示值直接给出（即使经过修正）
##### 间接测量法
- 通过测量与被测量有函数关系的其他量得到被测量值
- 例：长方形面积通过长×宽确定
#### 按基本量测量分类
##### 基本测量法（绝对测量法）
- 通过对一些基本量的测量，确定被测量值
##### 定义测量法
- 根据量的单位定义来确定该量的测量方法
- 既适用于基本单位也用于导出单位
#### 按比较方式分类
##### 直接比较测量法
- 被测量值直接与已知其值的同一种量相比较
- 必须是同一种量才能比较
- 要用比较式测量仪器
- 例：等臂天平上用砝码测量质量
- 误差分量同方向增减相互抵消
##### 替代测量法（曹冲称象）
- 选定且已知值的同种量替代被测量
- 使指示装置上得到相同效应以确定被测量值
- 例：质量计量中波尔特法
- 优点：消除天平不等臂性带来的不确定度分量
#### 按差值测量分类
##### 微差测量法
- 被测量与同它只有微小差别的已知同种量相比较
- 通过测量两量值间差值确定被测量值
- 例：量块在比较仪上测量活塞直径
##### 符合测量法
- 用观察某些标记或信号相符合的方法
- 测量被测量值与作为比较标准用的同一种已知量值之间微小差值
- 例：游标卡尺测量零件尺寸
#### 按补偿方式分类
##### 补偿测量法
- 一次测量包含正向误差，另一次包含负向误差
- 大部分误差互相补偿消去
- 例：电学计量中改变测量仪器电流方向，取两次读数和的二分之一
##### 零值测量法（平衡测量法）
- 调整已知值的与被测量有已知平衡关系的量
- 通过平衡原理确定被测量值
- 例：电桥测量电阻
#### 按测量特点和方式
- 接触测量和非接触测量
- 动态测量和静态测量
- 模拟测量和数字测量
- 手动测量和自动测量

### 21.5 被测量 ★★★
- 拟测量的量
- 测量时要对被测量进行明确定义
- 可以是物理量、化学量、生物量等
- 在医学测量中可能是一种生理活动

### 21.6 影响量 ★★★
- 在直接测量中不影响实际被测的量
- 但会影响示值与测量结果之间关系的量
##### 实例
- 安培计直接测量交流电流幅度时受频率影响（电流是被测量，频率是影响量）
- 直接测量血浆中血红蛋白浓度时，胆红素物质量浓度会影响测量结果

### 21.7 量的真值 ★★
- 简称真值
- 与量的定义一致的量值
- 真值只有通过完善的测量才能获得
- 但测量时不可避免受影响量影响
- 真值按其本性是不确定的

### 21.8 约定量值 ★★★
- 又称量的约定值，简称约定值
- 对于给定目的，由协议赋予某量的量值
- 有时称为"约定真值"
##### 实例
- 标准自由落体加速度 gn = 9.80665 m/s²
- 约瑟夫逊常量 KJ-90 = 483597.9 GHz/V
- 是真值的一个估计值
- 有测量不确定度，通常认为不确定度适当小，甚至可能为零

## 二十二、测量误差

### 22.1 测量误差的应用 ★★
- 定义：测得的量值减去参考量值
- 简称误差
- 当存在已知参考量值时，可获得
- 当参考量值是真值时，由于真值未知，不可获得
- 是测量值偏离参考量值的程度
- 通常指绝对误差
- 获得估计值的目的通常是为了得到测量结果的修正值

### 22.2 测量误差的分类 ★★★
#### 系统误差
- 在重复测量中保持不变或按可预见方式变化的测量误差分量
- 特点：重复性、单向性
- 来源可以是已知或未知
- 已知来源：可从测量方法上采取措施减小或消除
  - 例：等臂天平称重时用交换法或替代法消除两臂不等的系统误差
#### 随机误差
- 在重复测量中按不可预见方式变化的测量误差分量
- 特点：双向性
- 由影响量的随机时空变化所引起
- 导致重复测量中数据的分散性
- 减小方法：多次重复测量取平均值

### 22.3 测量误差的修正 ★★
- 修正：对测量值（估计值）系统误差的补偿
##### 修正值
- 用代数法与未修正测量结果相加
- 以补偿其系统误差的值
- 修正值 = -系统误差估计值

## 二十三、测量准确度、正确度、精密度

### 23.1 测量准确度 ★★
- 被测量的测得值与其真值间的一致程度

### 23.2 测量正确度 ★★
- 无穷多次重复测量所得量值的平均值与一个参考量值间的一致程度
- 与系统测量误差有关
- 与随机测量误差无关

### 23.3 测量精密度 ★★
- 在规定条件下，对同一或类似被测对象重复测量所得示值或测得值间的一致程度
##### 用于定义
- 测量重复性
- 期间测量精密度
- 测量复现性

### 23.4 期间测量精密度
- 一组期间精密度测量条件下的测量精密度

## 二十四、测量重复性和测量复现性

### 24.1 测量重复性 ★★
- 简称重复性
- 一组重复性测量条件下的测量精密度
#### 重复性测量条件
- 相同测量程序
- 相同操作者
- 相同测量系统
- 相同操作条件
- 相同地点
- 短时间内对同一或相类似被测对象重复测量
- 化学中术语"序列内精密度测量条件"

### 24.2 测量复（再）现性 ★★
- 简称复现性
- 在复现性测量条件下的测量精密度
#### 复现性测量条件
- 不同地点
- 不同操作者
- 不同测量系统
- 对同一或相类似被测对象重复测量
- 给出复现性时应说明改变和未变的条件及实际改变到什么程度

## 二十五、测量仪器（计量器具）

### 25.1 测量仪器及其作用
#### 含义 ★
- 又称计量器具
- 单独或与一个或多个辅助设备组合，用于进行测量的装置
- 必须具有符合规范要求的计量学特性，特别是准确度
#### 测量仪器特点 ★
- 是用于进行测量的独立装置
- 可以是实物量具，也可以是测量仪器仪表或测量系统
- 可以单独使用
  - 例：体温计、电压表、直尺、度盘秤
- 也可以连同其他辅助设备一起使用
  - 例：砝码、热电偶、标准电阻
#### 按产生量值对象分类
##### 表/计/测···仪
- 产生与正在测量的外部量相对应的测得的量值
- 例：电流表、温度计
##### 实物量具（"源"特性）
- 以固定形态呈现自身量值
- 例：砝码、直尺
#### 测量仪器的作用
- 通过测量获得量值，定量认识客观世界的重要工具
- 计量基标准中复现测量单位、实现量值传递（溯源）的重要手段
- 实施计量法制管理的重要工具和手段

### 25.2 实物量具 ★★
#### 定义
- 具有所赋量值
- 使用时以固定形态复现或提供一个或多个量值的测量仪器
- 复现：砝码、尺子
- 提供：标准信号发生器
#### 特点
- 复现或提供其自身示值（标称值）所标注的量值
##### 在使用时提供一个或多个量值
- 量块、直尺一直呈现一个或一组长度量值
- 卷尺被拉直后复现一组长度量值
- 标准物质能提供一个或多个量值（多种化学物质浓度）
##### 一般无外部比较测量机构
- 砝码、标准电阻只呈现一个量值
- 电阻箱有调节功能但无外部比较测量机构
#### 与外部量比较的方式
- 与其他配套比较测量仪器组合使用
  - 砝码配套天平，标准电阻配套电桥
- 自带比较测量机构实现独立测量
  - 游标卡尺、千分尺
- 由使用者承担比较测量机构作用
  - 直尺：使用者承担长度比较器角色
#### 标称值
- 实物量具自身量值的标示
- 用标准测量仪器对所提供量值的测得值经化整或近似
##### 实例
- 砝码上10 g
- 单刻度量杯1 L
- 量块100 mm
- 多刻度玻璃量器和电阻箱
  - 通常取上限作为标称值（总标称值）
##### 同时标注
- 准确度等级
- 使用条件（如额定电流值）
#### 误差与偏差
- 示值误差 = 示值（标称值） - 实测值（标准值）
- 偏差 = 实测值 - 设计值（目标值或标称值）
- 制造时的设计值对应于产品的标称值
#### 例题判定
- 实物量具：钢卷尺、注射器、铁路计量油罐车（复现）；电阻箱（提供）；卡尺（双重身份）
- 非实物量具：台秤、热电偶、电能表（不直接复现量值，有测量机构）

### 25.3 测量系统 ★
#### 新定义
- 组合起来用于特定量在规定区间内给出测得值信息的一台或多台测量仪器
- 通常还包括试剂、电源等其他物品或装置
#### 旧定义
- 用于特定测量目的、由测量仪器和有关其他设备组装起来的一套系统
#### 应用
- 可单独用于测量
- 也可作为计量标准使用
- 按用途又称为检定装置或校准装置

### 25.4 测量设备 ★
- 为实现测量过程所必需的：测量仪器、软件、测量标准、标准物质、辅助设备或其组合
- 是测量过程所必需的测量仪器相关的硬件和软件统称
- 可理解为：测量中除人、场所、被测对象以外的硬件和软件部分
- 是一个总称
- 比测量仪器或测量系统的含义更为广泛

### 25.5 测量链 ★
- 测量系统从测量信号输入单元到输出单元形成的测量信号传递链
- 在测量系统中构成信号从敏感器到输出单元的单一路径的系列单元
##### 实例
- 电声测量链：传声器→衰减器→滤波器→放大器→电压表
- 机械式压力测量链：波登管→杠杆系统→两个齿轮→机械刻度盘

### 25.6 测量仪器的分类（按输出形式）
#### 指示式测量仪器 ★
- 提供带有被测量量值信息的输出信号
- 信号可以是可视、声音或电信号
- 例：电压表、测微仪、温度计、电子天平
#### 显示式测量仪器 ★
- 输出信号以可视形式表示的指示式测量仪器
- 通常分为模拟式显示和数字式显示
- 也可以带有对示值的记录功能
##### 模拟显示式测量仪器
##### 连续可变的显示
- 指针式位移显示
- 亮度变化显示
##### 步进式显示
- 光柱长度显示
- 光的不同色度显示
##### 实例
- 磁电系仪表、电磁系仪表、电动系仪表
- 玻璃水银温度计、弹簧秤
##### 数字显示式测量仪器
- 提供数字化人眼可见输出
- 即时数字显示方式
- 显示屏或记录纸上一段时间内的数字记录
- 不包括数字通信和存储器上的数字信息记录（不是人眼直接可见）
- 实例：数字电压表、数字电流表、数字功率表、数字频率计
##### 记录式测量仪器
- 提供示值记录的测量仪器
- 例：温度记录仪、气压记录仪
- 单点或多点打印记录
- 具有记录器

### 25.7 测量仪器的标尺 ★★★
#### 概念
- 测量仪器显示单元的部件
- 由一组有序的带数码的标记构成
- 在模拟式测量仪器中使用十分广泛
- 一个测量仪器可以有一个或多个标尺（如万用表）
- 不是所有测量仪器都有标尺
#### 标尺长度
- 标尺第一个标记（始端）与最末一个标记（末端）之间连线的长度
- 通过全部最短标记的中点
- 又称标尺基线
- 实线（直线标尺：直尺、卡尺）
- 虚线（圆弧曲线、圆等：电压表、电流表、百分表）
#### 标尺间距
- 沿标尺长度的线段（标尺基线）所测量得到的任何两个相邻标尺标记之间的距离
- 标尺间隔相同时，间距大有利于减小读数误差
#### 标尺间隔（分度值）
- 对应两相邻标尺标记的两个值之差
- 习惯上称为分度值
- 标尺间隔和分度值是同义词
##### 实例
- 百分表：0.01 mm
- 千分表：0.001 mm
- 体温计：0.1 ℃
#### 标尺分度
- 标尺分成多少个可以分辨的区间
- 分度更细可提高读数精度

## 二十六、测量仪器的特性

### 26.1 示值 ★★★
- 由测量仪器或测量系统给出的量值
##### 表示形式
- 可视形式
- 声响形式
- 传输到其他装置
##### 给出方式
- 模拟输出显示器上指示的位置
- 数字输出所显示或打印的数字
- 编码输出的码形图
- 实物量具的赋值
- 示值与相应被测量值不必是同类量的值

### 26.2 示值区间（范围）★★★
- 也称示值范围
- 极限示值界限内的一组量值
- 用标在显示装置上的单位表示
- 例：99 V～201 V

### 26.3 标称量值 ★★★
- 简称标称值
##### 实例
- 标准电阻器标称量值：100 Ω
- 单刻度量杯量值：1000 mL
- 盐酸溶液HCl的物质的量浓度：0.1 mol/L
- 恒温箱温度：-20 ℃

### 26.4 标称示值区间（范围）★★★
- 简称标称区间，也称标称范围
- 通常以最小和最大示值表示
- 例：100 V～200 V

### 26.5 量程 ★★★
- 标称示值区间的两极限量值之差的绝对值
- 例：-10 V～+10 V的标称示值区间，量程为20 V

### 26.6 测量区间（范围）★★★
- 又称工作区间、测量范围、工作范围
- 在规定条件（一般是测量精度要求）下
- 能够满足测量要求的测量能力范围

### 26.7 灵敏度 ★★
- 测量仪器示值变化与被测量值变化之比
- 灵敏度高有利于获得小的鉴别阈

### 26.8 选择性 ★★
- 抗干扰能力
- 在多个被测量同时存在时区分被测量的能力

### 26.9 分辨力 ★★★
#### 测量仪器的分辨力
- 引起相应示值产生可觉察到变化的被测量的最小变化
- 反映测量仪器对被测量的分辨能力
- 与内部噪声、外部噪声、摩擦等因素有关
- 也可能与被测量的值有关
- 与显示装置的分辨力是不同概念
#### 显示装置的分辨力
##### 模拟式显示装置
- 以指示器所指标尺标记所对应的数值为示值
- 分辨力为标尺间隔（或分度值）的1/2到1/10
##### 实例
- 线纹尺最小分度值1 mm，分辨力0.5 mm
- 万能工具显微镜可估读到两相邻标记间隔的1/10
##### 数字式显示装置
- 当噪声对示值影响可忽略时
- 分辨力是最低位数字的最小可变化量
- 例：数字电压表最低位变化1个字示值差为1 μV，分辨力为1 μV
##### 半数字式显示装置
- 模拟和数字综合
- 实例：家用电度表

### 26.10 鉴别阈 ★★★
- 引起相应示值不可检测到变化的被测量值的最大变化
- 实际操作上对指针式仪器
  - 常采用引起相应示值可检测到变化的被测量值的最小变化
##### 实例
- 天平指针产生可觉察位移的最小负荷变化为10 mg → 鉴别阈10 mg
- 电子电位差计输入量同方向缓慢改变0.04 mV指针才有可觉察变化 → 0.04 mV
#### 灵敏度与鉴别阈的关系
- 灵敏度高有利于获得小的鉴别阈
- 仅靠提高制造水平减小噪声或摩擦能减小鉴别阈
- 但不能提高灵敏度
#### 分辨力和鉴别阈的区别
##### 分辨力
- 测量仪器或显示装置的设计参数
- 数值不需要测量来确定
- 是仪器设计的结果
##### 鉴别阈
- 性能参数
- 要通过测量才能确定

### 26.11 死区 ★★★
- 当被测量值双向变化时
- 相应示值不产生可检测到的变化的最大区间
- 即不引起相应示值产生可检测出变化的所测量量值双向变化的最大区间
#### 产生原因
- 机构零件的摩擦
- 零部件之间的间隙
- 弹性材料的变形
- 阻尼机构的影响
#### 影响因素
- 与被测量的变化速率有关
- 双向快速改变时死区可能增大

### 26.12 检出限 ★★
- 由给定测量程序产生的测得值
- 至少有规定的概率可对没有该成分的物质作出正确判别

### 26.13 测量仪器的稳定性 ★★★
- 测量仪器保持其计量特性随时间恒定的能力
- 通常指随时间不变化的能力
#### 定量表示方式
- 用计量特性发生某个规定的量的变化所需经过的时间
- 计量特性经过规定时间所发生的变化量
#### 重要性
- 对计量基准、计量标准、某些实物量具特别重要
- 示值的稳定是保证量值准确的基础
#### 不稳定原因
- 元器件的老化
- 零部件的磨损
- 使用、贮存、维护工作不仔细
#### 周期检定/校准
- 是对稳定性的一种考核
- 是科学合理确定检定周期的重要依据之一

### 26.14 仪器漂移 ★★★
- 由于测量仪器计量特性的变化引起的示值在一般时间内的连续或增量变化
- 是计量特性随时间的慢变化
- 示值变化与被测量变化无关
- 与影响量的刻意变化无关
#### 实例
##### 热导式氢分析器
- 5%量程处示值变化称为零漂移
- 85%量程处示值变化减去5%处示值变化称为量程漂移
- 校准气体调到5%和85%量程，24h后记录前后读数
#### 产生原因
- 温度、压力、湿度等变化
- 仪器本身性能的不稳定
#### 减少漂移措施
- 预热
- 预先放置一段时间与室温等温

### 26.15 示值误差 ★★★
- 测量仪器示值与对应输入量的参考量值之差
- 简称测量仪器的误差
- 通常用绝对误差表示，也可用相对误差表示
#### 实例：玻璃量器
- 标称值V = 1000 mL
- 标准玻璃量器检定容量标准值V0 = 1005 mL
- 示值误差 = V - V0 = 1000 - 1005 = -5 mL
#### 与偏差和修正值的区别
- 偏差 = 实际值（标准值/约定真值） - 标称值
- 示值误差 = 示值（标称值） - 实际值
- 修正值 = -示值误差
#### 例题分析
- 量块标称值10 mm，实际值10.1 mm
- 示值误差 = 10 - 10.1 = -0.1 mm
- 偏差 = 10.1 - 10 = 0.1 mm（量块做大了0.1 mm，修理时应磨去）
- 修正值 = -(-0.1) = 0.1 mm（使用结果应加上0.1 mm修正）

### 26.16 引用误差 ★★★
- 测量仪器或测量系统的误差除以仪器的特定值
- 特定值称为引用值
  - 测量仪器的量程
  - 下限为零的标称范围或测量范围的上限
- 是测量仪器绝对误差与其引用值之比
#### 实例
- 标称范围（0～150）V电压表
- 示值100.0 V处，标准电压表检定实际值99.4 V
- 100.0 V处示值误差 = 100.0 - 99.4 = +0.6 V
- 引用误差 = (100.0 - 99.4)/150 × 100% = 0.4%
- 与相对误差区别
  - 相对误差 = (100.0 - 99.4)/99.4 × 100% = 0.6%

### 26.17 固有误差（基本误差）★★
- 在参考工作条件下确定的测量仪器的误差

### 26.18 仪器偏移 ★★
- 测量仪器示值的系统误差

## 二十七、测量仪器的使用条件

### 27.1 参考工作条件 ★★★
- 简称参考条件
- 为测量仪器或测量系统的性能评价或测量结果的相互比较而规定的工作条件
- 有文件规定，尽可能消除影响量
- 测量仪器的基本计量性能就是参考条件下规定
- 检定和校准通常要在参考条件下进行
- 参考条件就是计量检定规程或校准规范上规定的工作条件

### 27.2 额定工作条件 ★★★
- 为使测量仪器或测量系统按设计性能工作
- 在测量时必须满足的工作条件
- 即测量仪器的正常工作条件

### 27.3 极限工作条件 ★★★
- 使测量仪器或测量系统所规定的计量特性不受损害也不降低
- 其后仍可在额定工作条件下正常工作
- 所能承受的极端工作条件
- 应规定被测量和/或影响量的极限值
##### 实例
- 有些测量仪器可超过测量上限10%的超载试验
- 型式试验中部分项目属于极端条件下的考核

### 27.4 稳态工作条件 ★★★
- 为使由校准所建立的关系保持有效
- 测量仪器或测量系统的工作条件
- 即使被测量随时间变化
- 经校准的测量仪器在此条件下工作可保持校准结果有效
- "稳态"理解为"保持校准特性有效"
- 例：保持修正值有效的工作条件

## 二十八、计量器具管理

### 28.1 计量器具新产品管理 ★★★
##### 新产品定义
- 本单位从未生产过的计量器具
- 重大改进的计量器具
- 须经省级以上计量行政部门计量性能考核合格
#### 型式批准
##### 强制管理目录内且监管方式为型式批准的

##### 其他计量器具

#### 管理体制
- 市场监管总局：全国统一监督管理（进口或重要）
- 省级市场监管部门：本地区（一般）

### 28.2 零售商品称重计量监督 ★★★
- 对象：以重量结算的食品、金银饰品

### 28.3 定量包装商品计量监督 ★★★
- 管理对象：统一质量、体积、长度、面积、计数标注的预包装商品
- 例外：药品、危险化学品
#### 净含量标注
- 净含量 + 数字 + 法定计量单位
##### 同种多件
- 标注单件净含量和总件数
- 或总净含量

- 标注各种单件净含量和件数
- 或分别标注总净含量

// ===== Parse topics from markdown =====
function parseTopics(md) {
    const blocks = md.split(/(?=^## )/m).filter(b => b.trim());
    return blocks.map((block, i) => {
        const lines = block.split('\n');
        const titleLine = lines[0].replace(/^## /, '');
        const starsMatch = titleLine.match(/(★+)/);
        const stars = starsMatch ? starsMatch[1] : '';
        const title = titleLine.replace(/\s*★+$/, '').trim();
        const subtitles = [];
        lines.forEach(line => {
            const m = line.match(/^### (.+)/);
            if (m) subtitles.push(m[1]);
        });
        return { id: 'topic' + (i + 1), title, stars, subtitles, markdown: block };
    });
}

const topics = parseTopics(fullMarkdown);
let currentMm = null;

// ===== Render outline tree =====
function renderOutline() {
    const tree = ROOT.querySelector('#outlineTree');
    tree.innerHTML = topics.map((t, i) => {
        const subsHtml = t.subtitles.map((s, j) => {
            const sm = s.match(/(★+)/);
            const ss = sm ? '<span class="stars">' + sm[1] + '</span>' : '';
            const st = s.replace(/\s*★+$/, '').trim();
            return '<div class="subtopic-item" data-topic="' + i + '" data-sub="' + j + '" onclick="' + _NS + '.selectSubtopic(' + i + ',' + j + ')">' + st + ' ' + ss + '</div>';
        }).join('');
        const starsHtml = t.stars ? '<span class="stars">' + t.stars + '</span>' : '';
        return '<div class="topic-item" data-index="' + i + '">' +
            '<div class="topic-header" onclick="' + _NS + '.toggleTopic(' + i + ')">' +
            '<span class="arrow">&#9654;</span>' +
            '<span class="title-text">' + t.title + '</span>' +
            starsHtml + '</div>' +
            '<div class="subtopic-list">' + subsHtml + '</div></div>';
    }).join('');
}

// ===== Toggle expand/collapse =====
function toggleTopic(idx) {
    const item = ROOT.querySelectorAll('.topic-item')[idx];
    const arrow = item.querySelector('.arrow');
    const list = item.querySelector('.subtopic-list');
    const isOpen = list.classList.contains('show');
    if (isOpen) {
        list.classList.remove('show');
        arrow.classList.remove('expanded');
    } else {
        list.classList.add('show');
        arrow.classList.add('expanded');
    }
    selectTopic(idx);
}

function expandAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.add('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.add('expanded'));
}

function collapseAll() {
    ROOT.querySelectorAll('.subtopic-list').forEach(el => el.classList.remove('show'));
    ROOT.querySelectorAll('.arrow').forEach(el => el.classList.remove('expanded'));
}

// ===== Selection =====
function clearSelection() {
    ROOT.querySelectorAll('.topic-header.active, .subtopic-item.active').forEach(el => el.classList.remove('active'));
}

function selectTopic(idx) {
    clearSelection();
    const header = ROOT.querySelectorAll('.topic-header')[idx];
    header.classList.add('active');
    renderMindmap(topics[idx].markdown, topics[idx].title);
}

function selectSubtopic(topicIdx, subIdx) {
    clearSelection();
    const item = ROOT.querySelectorAll('.topic-item')[topicIdx];
    const subItems = item.querySelectorAll('.subtopic-item');
    if (subItems[subIdx]) subItems[subIdx].classList.add('active');
    renderMindmap(topics[topicIdx].markdown, topics[topicIdx].title);
}

// ===== Render mindmap =====
function renderMindmap(markdown, title) {
    ROOT.querySelector('#titleText').textContent = title;
    const svgEl = ROOT.querySelector('#mindmapSvg');
    svgEl.innerHTML = '';
    svgEl.removeAttribute('style');
    try {
        const { Transformer } = window.markmap;
        const { Markmap } = window.markmap;
        const transformer = new Transformer();
        const { root } = transformer.transform(markdown);
        currentMm = Markmap.create(svgEl, { maxWidth: 300 }, root);
    } catch (e) {
        svgEl.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#999" font-size="14">' + e.message + '</text>';
    }
}

// ===== Search filter =====
function filterOutline(keyword) {
    const kw = keyword.trim().toLowerCase();
    ROOT.querySelectorAll('.topic-item').forEach((item, i) => {
        if (!kw) { item.classList.remove('hidden'); return; }
        const t = topics[i];
        const text = (t.title + ' ' + t.subtitles.join(' ') + ' ' + t.markdown).toLowerCase();
        item.classList.toggle('hidden', !text.includes(kw));
    });
}

// ===== Init =====
function init() {
    ROOT = document.querySelector('[data-page="fagui"]');
    if (!ROOT) { setTimeout(init, 50); return; }

    // 绑定静态按钮事件
    var inp = ROOT.querySelector('#searchInput');
    if (inp) inp.oninput = function() { filterOutline(this.value); };
    var btns = ROOT.querySelectorAll('.toolbar button');
    if (btns[0]) btns[0].onclick = expandAll;
    if (btns[1]) btns[1].onclick = collapseAll;

    renderOutline();
    selectTopic(0);
    if (ROOT.querySelectorAll('.subtopic-list').length > 0) {
        ROOT.querySelectorAll('.subtopic-list')[0].classList.add('show');
        ROOT.querySelectorAll('.arrow')[0].classList.add('expanded');
    }
}
// 注册到全局命名空间供 onclick 调用
window[_NS] = { toggleTopic: toggleTopic, selectSubtopic: selectSubtopic };
init();
})();

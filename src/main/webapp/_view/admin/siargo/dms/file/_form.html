#set(pageId=RandomUtil.random(6))
<form onsubmit="return false;" id="dmsFileForm_#(pageId)" data-dms-form action="#(action)"
	method="post">
	<input type="hidden" name="dmsFile.id" value="#(dmsFile.id??)" />
	<div class="row">
		<!-- 第一列 -->
		<div class="col">
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">文件类别</label>
				<div class="col">
					<select class="form-control" data-autoload data-refresh="true"
						data-url="admin/siargo/dms/category/getCategoryListWithCount"
						name="dmsFile.categoryId" data-text="=请选择类别=" data-value-attr="id"
						data-rule="select" data-text-attr="name" data-tips="请选择文件类别"
						data-select="#(dmsFile.categoryId ?? categoryId)"
						data-select-type="select2">
					</select>
				</div>
			</div>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">生效日期</label>
				<div class="col">
					<input type="text" 
						data-date 
						data-type="date" 
						data-fmt="yyyy-MM-dd" 
						readonly="readonly" 
						autocomplete="off" 
						class="form-control"
						placeholder="请选择生效日期" 
						maxlength="10" 
						name="dmsFile.activeDate" 
						value="#datetime(dmsFile.activeDate??,'yyyy-MM-dd')">
				</div>
			</div>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">文件备注</label>
				<div class="col">
					<textarea class="form-control" style="height: 50px;"
						placeholder="请输入文件描述" maxlength="1000" name="dmsFile.description">#(dmsFile.description??)</textarea>
				</div>
			</div>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">关键字</label>
				<div class="col">
					<input type="hidden" name="keywords" data-dms="keywords"
						value="#(keywords??)" /> <input type="text" autocomplete="off"
						class="form-control mb-2" data-dms="keyword"
						placeholder="输入关键字后按回车添加" />
					<div data-dms="tags" class="d-flex flex-wrap"></div>
				</div>
			</div>
			<div class="form-group row">
				<label class="col-sm-2 col-form-label">文件上传</label>
				<div class="col">
					<input type="hidden" name="tempFilePath" value="" />
                    <input type="hidden" name="overwriteTokens" value="{}" />
                    <input type="file" data-dms="input" hidden accept=".pdf"
                        #if(!dmsFile.id) multiple #end />
                    <button type="button" class="btn btn-outline-primary" data-dms="choose">
                        <i class="fa fa-upload mr-1"></i>选择文件上传
                    </button>
                    <span class="ml-2 text-muted" data-dms="progress"></span>
                    <div data-dms="list" class="mt-2"></div>
                    <small class="text-muted mt-2 d-block">仅支持PDF，每个最大100MB；#if(!dmsFile.id)最多10个；#end同名文件确认覆盖后上传，保存后生效。</small>
				</div>
			</div>
		</div>
		<!-- 第二列 -->
		<div></div>
	</div>

</form>
#define js()
<script>
$(function () { SiargoDmsFileForm.init("dmsFileForm_#(pageId)"); });
</script>
#end

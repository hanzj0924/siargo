#@jboltLayout() #define main() #set(pageId=RandomUtil.random(6))
<div class="jbolt_page jb_vflex" data-key="#(pmkey)">

	<div class="jbolt_page_title">
		<div class="row">
			<div class="col-md-auto">
				<h1><i class="fa fa-folder-open text-warning mr-2"></i>技术通知单类别管理</h1>
			</div>
			<div class="col-md-auto"></div>
		</div>
	</div>
	<div class="jbolt_page_content jb_vbody">
		<!-- JBoltTable的数据模板定义-->
		<textarea class="jb_tpl_box" id="dmsCategoryRowtpl_#(pageId)">
{@each datas as data,index}
<tr data-id="${data.id}">
<td>${pageNumber,pageSize,index | rownum}</td>
<td>
	<div class="d-flex align-items-center category-name-cell">
		<div class="category-icon mr-3">
			<i class="fa fa-folder-o"></i>
		</div>
		<span class="font-weight-medium text-dark mr-3">${data.name}</span>
		{@if data.fileCount > 0}
		<small class="text-muted ml-auto"><i class="fa fa-file-text-o mr-1"></i>${data.fileCount} 个文件</small>
		{@else}
		<small class="text-muted ml-auto"><i class="fa fa-inbox mr-1"></i>暂无文件</small>
		{@/if}
		<a href="javascript:;" data-openpage="dialog" data-area="290,320"
			tooltip data-title="移动到指定位置" data-handler="refreshJBoltTable"
			data-url="admin/siargo/dms/category/moveTo/${data.id}"
			class="btn btn-outline-info btn-sm ml-3">
			<i class="fa fa-arrows-v"></i> 移动到
		</a>
	</div>
</td>
<td>
	<div class="btn-group btn-group-sm" role="group">
		<a href="admin/siargo/dms/category/up/${data.id}" data-ajaxbtn
			data-loading="执行中 " tooltip data-title="上移" data-handler="moveUp"
			class="btn btn-outline-info">
			<i class="fa fa-arrow-up"></i>
		</a>
		<a href="admin/siargo/dms/category/down/${data.id}" data-ajaxbtn
			data-loading="执行中 " tooltip data-title="下移" data-handler="moveDown"
			class="btn btn-outline-info">
			<i class="fa fa-arrow-down"></i>
		</a>
	</div>
</td>
</tr>
{@/each}
</textarea>

		<!-- 工具条 toolbar -->
		<div class="jbolt_table_toolbar" id="dmsCategory_toolbar_#(pageId)">
			<div class="row">
				<div class="col-sm-6 text-left">
					<div class="btn-group" role="group" aria-label="btn-group">
						<button data-openpage="dialog" data-area="350,250"
							data-handler="jboltTablePageToFirst" data-title="新增"
							data-url="admin/siargo/dms/category/add"
							class="btn btn-outline-primary btn-sm">
							<i class="fa fa-plus"></i> 新增
						</button>
						<button data-openpage="dialog" data-area="350,250"
							data-handler="refreshJBoltTable" data-title="修改"
							data-check-handler="jboltTableGetCheckedId"
							data-url="admin/siargo/dms/category/edit/"
							class="btn btn-outline-info btn-sm">
							<i class="fa fa-edit"></i> 修改
						</button>
						<button data-ajaxbtn data-handler="removeJBoltTableCheckedTr"
							data-check-handler="jboltTableGetCheckedIds"
							data-url="admin/siargo/dms/category/deleteByIds?ids="
							data-confirm="确定删除选中数据？" class="btn btn-outline-danger btn-sm">
							<i class="fa fa-trash"></i> 删除
						</button>
						<button data-ajaxbtn data-confirm="确认初始化顺序吗？"
							data-handler="jboltTablePageToFirst" data-title="初始化排序"
							data-url="admin/siargo/dms/category/initRank"
							class="btn btn-outline-success btn-sm">
							<i class="fa fa-sort"></i> 初始化排序
						</button>
						<button onclick="jboltTableRefresh(this)"
							class="btn btn-outline-secondary btn-sm">
							<i class="fa fa-refresh"></i> 刷新
						</button>
					</div>
				</div>
				<div class="col-sm-6 text-right">
					<form class="form-inline d-inline-block" id="dmsCategoryForm_#(pageId)"
					      onsubmit="return false;" method="post">
						<input type="text" autocomplete="off" class="form-control"
							placeholder="输入关键字搜索" name="keywords" value="" />
						<button type="submit" class="btn btn-outline-secondary">
							<i class="fa fa-search"></i> 查询
						</button>
					</form>
				</div>
			</div>
		</div>

		<table class="jbolt_table jbolt_main_table table-center"
			data-jbolttable data-ajax="true"
			data-pagesize="100"
			data-height="fill_box"
			data-url="admin/siargo/dms/category/datas"
			data-column-prepend="1:checkbox"
			data-conditions-form="dmsCategoryForm_#(pageId)"
			data-rowtpl="dmsCategoryRowtpl_#(pageId)"
			data-page="dmsCategoryPage_#(pageId)"
			data-toolbar="dmsCategory_toolbar_#(pageId)">
			<thead class="fw-normal">
				<tr>
					<th data-width="70">序号</th>
					<th data-max-width="200" data-column="name">类别名称</th>
					<th data-width="120">操作</th>
				</tr>
			</thead>
			<tbody>
			</tbody>
		</table>
	</div>
</div>
#end

#define css()
<style>
.category-icon {
	width: 36px;
	height: 36px;
	border-radius: 8px;
	background: linear-gradient(135deg, #fff3cd 0%, #ffeaa7 100%);
	display: flex;
	align-items: center;
	justify-content: center;
	color: #e0a800;
	font-size: 16px;
}
.category-name-cell {
	padding-left: 40px;
	padding-right: 40px;
}
.category-icon i {
	margin: 0;
}
.font-weight-medium {
	font-weight: 500;
}
</style>
#end

#@jboltLayout() #define main() #set(pageId=RandomUtil.random(6))
<link rel="stylesheet" href="assets/css/siargo.css">
<div class="jbolt_page jb_vflex" data-key="#(pmkey)">

	<div class="jbolt_page_title">
		<div class="row">
			<div class="col-md-auto">
				<h1><i class="fa fa-folder-open text-warning mr-2"></i>技术通知单类别管理</h1>
			</div>
			<div class="col-md-auto"></div>
		</div>
	</div>
	<div class="jbolt_page_content jb_vbody">
		<!-- JBoltTable的数据模板定义-->
		<textarea class="jb_tpl_box" id="dmsCategoryRowtpl_#(pageId)">
{@each datas as data,index}
<tr data-id="${data.id}">
<td class="text-center">${pageNumber,pageSize,index | rownum}</td>
<td>
	<div class="d-flex align-items-center">
		<i class="fa fa-folder-o dms-cat-folder mr-2"></i>
		<span class="dms-cat-name">${data.name}</span>
	</div>
</td>
<td>
	{@if data.filecount > 0}
	<span class="dms-cat-count">${data.filecount}</span>
	{@else}
	<span class="dms-cat-count is-empty">空</span>
	{@/if}
</td>
<td class="text-center">
	<a href="admin/siargo/dms/category/edit/${data.id}"
		data-area="350,250" tooltip data-title="编辑"
		data-handler="refreshJBoltTable" data-dialog-title="编辑类别"
		class="jbolt_table_editbtn"> <i class="fa fa-pencil"></i>
	</a> <a href="admin/siargo/dms/category/deleteByIds?ids=${data.id}"
		data-ajaxbtn data-loading="删除中" tooltip data-title="删除"
		data-handler="refreshJBoltTable" data-confirm="确定删除类别「${data.name}」？"
		class="jbolt_table_delbtn"> <i class="fa fa-remove c-danger"></i>
	</a> <a href="admin/siargo/dms/category/up/${data.id}" data-ajaxbtn
		data-loading="执行中" tooltip data-title="上移" data-handler="moveUp"
		class="jbolt_table_btn"> <i class="fa fa-arrow-up"></i>
	</a> <a href="admin/siargo/dms/category/down/${data.id}" data-ajaxbtn
		data-loading="执行中" tooltip data-title="下移" data-handler="moveDown"
		class="jbolt_table_btn"> <i class="fa fa-arrow-down"></i>
	</a> <a href="javascript:;" data-openpage="dialog" data-area="290,320"
		tooltip data-title="移动到指定位置" data-handler="refreshJBoltTable"
		data-url="admin/siargo/dms/category/moveTo/${data.id}"
		class="jbolt_table_btn"> <i class="fa fa-arrows-v"></i>
	</a>
</td>
</tr>
{@/each}
</textarea>

		<!-- 工具条 toolbar -->
		<div class="jbolt_table_toolbar dms-cat-toolbar" id="dmsCategory_toolbar_#(pageId)">
			<div class="row">
				<div class="col-sm-6 text-left">
					<button data-openpage="dialog" data-area="350,250"
						data-handler="jboltTablePageToFirst" data-title="新增类别"
						data-url="admin/siargo/dms/category/add"
						class="btn btn-outline-primary btn-sm">
						<i class="fa fa-plus"></i> 新增类别
					</button>
					<button data-ajaxbtn data-confirm="确认初始化顺序吗？"
						data-handler="jboltTablePageToFirst" data-title="初始化排序"
						data-url="admin/siargo/dms/category/initRank"
						class="btn btn-outline-secondary btn-sm ml-2">
						<i class="fa fa-sort"></i> 初始化排序
					</button>
					<button onclick="jboltTableRefresh(this)"
						class="btn btn-outline-secondary btn-sm ml-2">
						<i class="fa fa-refresh"></i> 刷新
					</button>
				</div>
				<div class="col-sm-6 text-right">
					<form class="form-inline d-inline-block" id="dmsCategoryForm_#(pageId)"
					      onsubmit="return false;" method="post">
						<input type="text" autocomplete="off" class="form-control"
							placeholder="输入关键字搜索" name="keywords" value="" />
						<button type="submit" class="btn btn-outline-secondary">
							<i class="fa fa-search"></i> 查询
						</button>
					</form>
				</div>
			</div>
		</div>

		<table class="jbolt_table jbolt_main_table dms-cat-table"
			data-jbolttable data-ajax="true"
			data-pagesize="100"
			data-height="fill_box"
			data-url="admin/siargo/dms/category/datas"
			data-conditions-form="dmsCategoryForm_#(pageId)"
			data-rowtpl="dmsCategoryRowtpl_#(pageId)"
			data-page="dmsCategoryPage_#(pageId)"
			data-toolbar="dmsCategory_toolbar_#(pageId)">
			<thead class="fw-normal">
				<tr>
					<th data-width="70">序号</th>
					<th data-column="name">类别名称</th>
					<th data-width="110">文件数</th>
					<th data-width="220">操作</th>
				</tr>
			</thead>
			<tbody id="dmsCatTbody_#(pageId)">
			</tbody>
		</table>
	</div>
</div>
#end
